<title>JS Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fira+Code:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* JS Orbit: night-sky theme, glowing floating tiles, lesson map, segmented progress. */
:root {
  --bg: #080c1d; --panel: #111936; --panel2: #1a2450; --ink: #eef1ff; --muted: #9aa6d8; --line: #28346a; --dot: #34417e;
  --a1: #2de2c4; --a2: #9b7bff; --a3: #ffb62e; --a4: #ff5d8f; --shadow: rgba(0, 0, 0, .5); --glow: rgba(45, 226, 196, .8); --pillbg: #0b1230;
  --idea: #2d2470; --tip: #0f4440; --warn: #5a3a0c; --catch: #5c1c3c; --wrap: #1d2c70;
  --disp: "Sora", system-ui, sans-serif; --body: "DM Sans", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
    --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
    --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
  --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
  --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: clip; }
body { margin: 0; background: radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--a2) 22%, transparent), transparent), radial-gradient(700px 380px at 5% 0%, color-mix(in srgb, var(--a1) 14%, transparent), transparent), var(--bg); color: var(--ink); font: 14px/1.6 var(--body); padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; position: relative; z-index: 20; }
.brand { font: 700 18px var(--disp); display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; }
.ring { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, var(--a1), var(--a2), var(--a4), var(--a3), var(--a1)); position: relative; }
.ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.menu { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font: 600 12.5px var(--disp); display: flex; gap: 8px; align-items: center; }
.menu:hover { border-color: var(--a1); }
.spacer { flex: 1; }
.pg { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.bar { width: 110px; height: 6px; border-radius: 6px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); }
.map { display: none; position: absolute; left: 0; right: 0; top: 100%; max-height: min(70vh, 640px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 24px 60px var(--shadow); }
.map.show { display: block; }
.map h3 { margin: 12px 0 8px; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.map h3:first-child { margin-top: 0; }
.map h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.lc { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: flex; gap: 9px; align-items: center; }
.lc:hover { border-color: var(--a1); }
.lc.on { border-color: var(--a1); box-shadow: 0 0 0 1px var(--a1) inset; }
.lc b { font: 600 12px var(--mono); color: var(--muted); width: 22px; flex: none; }
.lc span { font: 600 13px var(--disp); line-height: 1.25; flex: 1; }
.lc em { font-style: normal; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 10px; }
.lc.done em { background: var(--a1); border-color: var(--a1); color: #04201c; }
.lc.done em::after { content: "\2713"; font-weight: 700; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.center { min-width: 0; display: grid; gap: 10px; }
.crumb { font: 500 11.5px var(--mono); color: var(--a1); margin: 0; letter-spacing: .04em; }
.head h1 { font: 700 clamp(22px, 3.4vw, 32px)/1.1 var(--disp); margin: 4px 0 4px; letter-spacing: -.02em; background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--a2) 60%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font: 500 11px var(--mono); border-radius: 999px; padding: 2px 10px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.chip:nth-child(1) { color: var(--a1); border-color: color-mix(in srgb, var(--a1) 50%, var(--line)); }
.chip:nth-child(2) { color: var(--a3); border-color: color-mix(in srgb, var(--a3) 50%, var(--line)); }
.chip:nth-child(3) { color: var(--a4); border-color: color-mix(in srgb, var(--a4) 50%, var(--line)); }
.stagebox { position: relative; background: radial-gradient(640px 300px at 50% 42%, color-mix(in srgb, var(--a2) 20%, var(--panel)), var(--panel)); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.read { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; max-width: calc(100% - 200px); }
.rd { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-left: 3px solid var(--a1); border-radius: 8px; padding: 3px 10px; min-width: 80px; backdrop-filter: blur(6px); }
.rd:nth-child(2) { border-left-color: var(--a3); } .rd:nth-child(3) { border-left-color: var(--a4); } .rd:nth-child(4) { border-left-color: var(--a2); }
.rd small { display: block; font: 500 9.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.rd b { font: 600 13px var(--mono); color: var(--ink); }
.tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 2; }
.sbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font: 600 12px var(--disp); }
.sbtn:hover { border-color: var(--a1); }
.scrollx { overflow: hidden; }
svg.scene { display: block; width: 100%; height: auto; max-height: calc(100vh - 290px); }
.gdot { fill: var(--dot); }
.face { stroke: color-mix(in srgb, #fff 30%, transparent); stroke-width: 1; stroke-linejoin: round; }
.shadow { fill: var(--shadow); stroke: none; filter: blur(5px); }
.glyph { font: 600 12px var(--mono); fill: #060c1c; text-anchor: middle; pointer-events: none; }
.pillbox { fill: var(--pillbg); stroke: color-mix(in srgb, var(--a1) 55%, var(--line)); stroke-width: 1.2; }
.pt { font: 600 12.5px var(--mono); fill: var(--ink); text-anchor: middle; }
.ps { font: 400 10.5px var(--mono); fill: var(--muted); text-anchor: middle; }
.n { transition: transform .75s cubic-bezier(.3, .8, .3, 1); }
.in { transition: opacity .45s, transform .6s cubic-bezier(.3, 1.4, .5, 1); }
.in.off { opacity: 0; transform: translateY(-22px) scale(.92); }
.n.dim .in { opacity: .28; }
.n.hi .in { filter: drop-shadow(0 0 10px var(--glow)); animation: bob 1.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.eg { fill: none; stroke-width: 2.4; stroke-linecap: round; animation: draw .5s ease backwards; }
.eg circle { filter: drop-shadow(0 0 5px var(--glow)); }
@keyframes draw { from { opacity: 0; } to { opacity: 1; } }
.legend { display: flex; gap: 12px 16px; padding: 4px 14px 10px; font: 400 11px var(--mono); color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stepper { overflow-x: hidden; position: sticky; bottom: 8px; z-index: 6; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 12px; box-shadow: 0 -8px 24px var(--shadow); }
.stepper h5 { margin: 0 0 8px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; background: none; border: 0; padding: 0; text-align: left; }
.dot span.c { display: block; width: 100%; height: 7px; border-radius: 99px; background: var(--line); font-size: 0; transition: background .3s; }
.dot.past span.c { background: var(--a1); opacity: .7; }
.dot.cur span.c { background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); box-shadow: 0 0 12px var(--glow); }
.dot span.l { font: 500 10.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot.cur span.l { color: var(--ink); font-weight: 600; }
.panel { position: sticky; top: 8px; display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 15px; position: relative; overflow: hidden; }
.card:first-child::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--a1), var(--a2), var(--a4)); }
.stephead { display: flex; justify-content: space-between; align-items: center; font: 500 11px var(--mono); color: var(--muted); }
.tag { border-radius: 999px; padding: 2px 10px; font: 600 10px var(--mono); letter-spacing: .08em; color: var(--ink); }
.tag.PROBLEM { background: var(--catch); } .tag.CONCEPT { background: var(--idea); } .tag.TECHNIQUE { background: var(--tip); } .tag.WATCH { background: var(--warn); } .tag.RECAP { background: var(--wrap); }
.card h2 { font: 700 19px/1.25 var(--disp); margin: 9px 0 8px; letter-spacing: -.01em; }
.card p { margin: 0 0 8px; }
.card code, .kc code { font: 500 12px var(--mono); background: var(--panel2); border-radius: 5px; padding: 1px 5px; color: var(--a1); }
pre.cd { background: #060a17; color: #dbe4ff; font: 400 12px/1.65 var(--mono); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.kc { border-radius: 12px; padding: 9px 12px; margin-top: 10px; border-left: 3px solid var(--a2); }
.kc small { display: block; font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; color: var(--muted); }
.kc.idea { background: var(--idea); border-color: var(--a2); } .kc.know { background: var(--tip); border-color: var(--a1); } .kc.warn { background: var(--warn); border-color: var(--a3); }
.chg { margin-top: 10px; font-size: 12.5px; }
.chg small { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chg ul { margin: 4px 0 0; padding-left: 16px; }
.nav { display: flex; gap: 8px; margin-top: 12px; }
.nbtn { border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); background: var(--panel2); }
.nbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; flex: 1; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.nbtn:disabled { opacity: .35; cursor: default; }
.hint { font: 400 10.5px var(--mono); color: var(--muted); margin-top: 8px; }
.learn h4 { margin: 0 0 6px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.learn label { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 2px 0; color: var(--muted); }
.learn label.on { color: var(--ink); }
.learn .bx { width: 14px; height: 14px; border: 1.5px solid var(--dot); border-radius: 50%; flex: none; margin-top: 3px; display: grid; place-items: center; font-size: 9px; }
.learn label.on .bx { background: var(--a1); border-color: var(--a1); color: #04201c; }
.learn label.on .bx::after { content: "\2713"; font-weight: 700; }
@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
  .read { max-width: 100%; position: static; padding: 8px 10px 0; }
  .tools { position: static; padding: 8px 10px 0; }
  .pg .bar { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 13.5px; }
  .dot span.l { display: none; }
  .sbtn { padding: 3px 10px; }
  .rd { min-width: 0; }
  .card h2 { font-size: 17px; }
  svg.scene { max-height: 56vh; }
  .stepper { padding: 8px 10px; }
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style>
[hidden] { display: none !important; }
.mode { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode a { font: 600 12.5px var(--disp); color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 999px; }
.mode a.on { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; }
#iv { display: grid; gap: 12px; max-width: 980px; margin: 0 auto; }
.ivhero { display: flex; gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.ivhero h1 { font: 700 clamp(24px, 4vw, 34px)/1.1 var(--disp); margin: 4px 0; letter-spacing: -.02em; }
.ivprog { min-width: 150px; display: grid; gap: 4px; font: 500 12px var(--mono); color: var(--muted); }
.ivprog b { font: 700 22px var(--disp); color: var(--ink); }
.ivprog .bar { width: 100%; }
.how { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font: 600 12px var(--disp); }
.how .chip { color: var(--a1); }
.ivtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.ivtab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); display: flex; gap: 8px; align-items: center; }
.ivtab em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.ivtab:hover { border-color: var(--a1); }
.ivtab.on { background: linear-gradient(90deg, color-mix(in srgb, var(--a1) 28%, var(--panel)), color-mix(in srgb, var(--a2) 28%, var(--panel))); border-color: var(--a1); }
.tabdesc { margin: 0; }
.ivbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ivbar input { flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 8px 12px; font: 14px var(--body); }
.ivbar input:focus { outline: 2px solid var(--a1); outline-offset: 1px; }
.chip.fb { cursor: pointer; }
.chip.fb.on { background: var(--a1); color: #04201c; border-color: var(--a1); }
.ivlist { display: grid; gap: 8px; }
.ivc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ivc[open] { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.ivc summary { list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 11px 14px; }
.ivc summary::-webkit-details-marker { display: none; }
.ivc .num { font: 600 12px var(--mono); color: var(--a2); }
.ivc .tt { flex: 1; font: 600 14.5px/1.35 var(--disp); }
.ivc .tt small { display: block; font: 400 11px var(--mono); color: var(--muted); margin-top: 2px; }
.lvl { font: 600 10px var(--mono); border-radius: 999px; padding: 2px 9px; background: var(--panel2); color: var(--muted); letter-spacing: .04em; }
.lvl.l-mustknow, .lvl.l-tricky { color: var(--a4); } .lvl.l-easy { color: var(--a1); } .lvl.l-medium, .lvl.l-common { color: var(--a3); } .lvl.l-seniorish { color: var(--a2); }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 11px; font-style: normal; }
.ivc.done .tick { background: var(--a1); border-color: var(--a1); color: #04201c; }
.ivc.done .tick::after { content: "\2713"; font-weight: 700; }
.ivb { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.ivb .ask { margin: 8px 0 0; font-size: 14.5px; }
.ivb .lab { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 4px; }
.ivb .kc { margin: 0; }
.ivb pre.cd { margin: 0; }
.ivl { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.ivbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font: 600 12.5px var(--disp); justify-self: start; }
.ivbtn:hover:not(:disabled) { border-color: var(--a1); }
.ivbtn:disabled { opacity: .45; cursor: default; }
.ivbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; }
.ivbtn.mark { margin-top: 4px; }
.ivb .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ans { display: grid; gap: 8px; }
.hint-i { background: var(--panel2); border-left: 3px solid var(--a3); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; margin-top: 6px; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
@media (max-width: 640px) { .ivc summary { padding: 10px; gap: 8px; } .lvl { display: none; } .mode a { padding: 5px 10px; } }
</style>

<style>
#rv { display: grid; gap: 12px; max-width: 1100px; margin: 0 auto; }
.cs { columns: 300px; column-gap: 12px; }
.csc { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tone, var(--a1)); border-radius: 14px; padding: 4px 12px 8px; margin: 0 0 12px; }
.csc h3 { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px; font: 700 14px var(--disp); }
.csc h3 em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.csdef, .csidea { margin: 4px 0 0; font-size: 12.5px; }
.csdef b, .csidea b { font: 700 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--tone, var(--a1)); margin-right: 4px; }
.csidea { background: var(--panel2); border-left: 3px solid var(--tone, var(--a1)); border-radius: 8px; padding: 6px 10px; margin: 8px 0 6px; }
.csr { padding: 7px 0; border-top: 1px dashed var(--line); }
.csr:first-of-type { border-top: 0; }
.csr pre { margin: 0; font: 500 12px/1.5 var(--mono); color: var(--tone, var(--a1)); white-space: pre-wrap; overflow-wrap: anywhere; }
.csr p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.rvlist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.rvlist.day { grid-template-columns: 1fr; }
.rvb { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.rvb.done { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.rvh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rvh h3 { margin: 0; font: 700 16px var(--disp); }
.rvh small { display: block; font: 500 11px var(--mono); color: var(--muted); }
.rvn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--disp); background: linear-gradient(135deg, var(--a1), var(--a2)); color: #06121f; flex: none; }
.rvt { font: 600 11.5px var(--mono); color: var(--a3); background: var(--panel2); border-radius: 999px; padding: 3px 11px; flex: none; }
.rvcks { display: grid; gap: 4px; }

      if (ed.pk) { const pk = sv('circle', { r: 7, class: 'face', style: 'fill:#2de2c4;stroke:#fff;stroke-width:1.5' }, sv('animateMotion', { dur: (ed.dur || 1.8) + 's', repeatCount: 'indefinite', path: dpath })); eg.append(pk); }
      eLayer.append(eg);
      if (ed.t) lbls.push({ t: ed.t, cx: (P0[0] + 2 * M[0] + P1[0]) / 4 + (ed.lo ? ed.lo[0] : 0), cy: (P0[1] + 2 * M[1] + P1[1]) / 4 + (ed.lo ? ed.lo[1] : -18), w: Math.max(String(ed.t).length * 7.5, 0) + 20 });
    }
    layoutLabels(items, lbls);
  }
  const refresh = () => { for (const id in els) els[id].key = ''; };
  return { init, load, apply, refresh };
})();

function closeMap() { $('side').classList.remove('show'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
function renderHead() {
  const L = LESSONS[cur];
  $('crumb').textContent = `${LEVELS[L.lvl].name}  ·  Lesson ${cur + 1} of ${LESSONS.length}`;
  $('title').textContent = L.title; $('sub').textContent = L.sub;
  $('chips').innerHTML = `<span class="chip">${L.steps.length} steps</span><span class="chip">${L.min} min</span><span class="chip">${esc(L.diff)}</span>`;
  document.title = L.title + ' · JS Orbit';
}
function renderStepper() {
  const L = LESSONS[cur], n = L.steps.length;
  const h = document.createElement('h5'); h.innerHTML = `<span>Steps</span><span>${stepI + 1} / ${n}</span>`;
  const dots = document.createElement('div'); dots.className = 'dots';
  L.steps.forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'dot' + (i < stepI ? ' past' : '') + (i === stepI ? ' cur' : '');
    b.innerHTML = `<span class="c">${i + 1}</span><span class="l">${esc(s.short || '')}</span>`;
    b.onclick = () => go(i); dots.append(b);
  });
  $('stepper').replaceChildren(h, dots);
}
function renderPanel() {
  const L = LESSONS[cur], s = L.steps[stepI], n = L.steps.length, p = $('panel');
  const prevOn = stepI ? stateAt(L, stepI - 1).on : new Set(), now = stateAt(L, stepI).on;
  const label = (id) => { const nd = L.nodes[id]; return nd.t || nd.g || id; };
  const added = [...now].filter(x => !prevOn.has(x) && L.nodes[x].k !== 'tag' || false).map(x => '+ ' + label(x));
  const gone = [...prevOn].filter(x => !now.has(x) && L.nodes[x].k !== 'tag').map(x => '− ' + label(x));
  const chg = [...added, ...gone].slice(0, 5);
  const tagCls = s.tag.split(' ')[0];
  const learnN = L.learn.length, upto = Math.floor(((stepI + 1) / n) * learnN + (stepI === n - 1 ? 1 : 0));
  let html = `<div class="card"><div class="stephead"><span class="tag ${tagCls}">${esc(TAGN[tagCls] || s.tag)}</span><span>Step ${stepI + 1} of ${n}</span></div><h2>${esc(s.title)}</h2>`;
  s.body.forEach(t => html += `<p>${rich(t)}</p>`);
  if (s.code) html += `<pre class="cd">${esc(s.code)}</pre>`;
  if (s.key) html += `<div class="kc ${s.key[0]}"><small>${{ idea: 'Remember', know: 'Tip', warn: 'Careful' }[s.key[0]]}</small>${rich(s.key[1])}</div>`;
  if (chg.length) html += `<div class="chg"><small>Now on stage</small><ul>${chg.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`;
  html += `<div class="nav"><button class="nbtn" id="bk" ${stepI === 0 ? 'disabled' : ''}>Prev</button><button class="nbtn go" id="nx"><span>${stepI === n - 1 ? (cur < LESSONS.length - 1 ? 'Next lesson' : 'Finish') : 'Next'}</span><span>&rarr;</span></button></div>`;
  html += `<div class="hint">Keys: &larr; &rarr; step, space plays, R replays</div></div>`;
  html += `<div class="card learn"><h4>Goals</h4>${L.learn.map((t, i) => `<label class="${i < upto ? 'on' : ''}"><span class="bx"></span><span>${esc(t)}</span></label>`).join('')}</div>`;
  p.innerHTML = html;
  $('bk').onclick = () => go(stepI - 1); $('nx').onclick = next;
  if (stepI === n - 1) { const qc = quizCard(L); if (qc) p.firstElementChild.after(qc); }
  const rd = $('read'); rd.replaceChildren();
  (s.read || []).forEach(([k, v]) => { const d = document.createElement('div'); d.className = 'rd'; d.innerHTML = `<small>${esc(k)}</small><b>${esc(v)}</b>`; rd.append(d); });
}
function paint() {
  const L = LESSONS[cur]; DARK = isDark();
  Scene.apply(stateAt(L, stepI));
  const st0 = stateAt(L, stepI);
  Scene.apply({ ...st0, over: st0.over, hi: st0.hi, edges: st0.edges });
  renderStepper(); renderPanel();
  if (stepI === L.steps.length - 1 && !done.has(L.id)) { done.add(L.id); store.set('jsm-done', JSON.stringify([...done])); buildSide(); }
}
function go(i) {
  const n = LESSONS[cur].steps.length;
  stepI = Math.max(0, Math.min(n - 1, i)); paint();
}
function next() {
  const n = LESSONS[cur].steps.length;
  if (stepI < n - 1) go(stepI + 1);
  else if (cur < LESSONS.length - 1) location.hash = LESSONS[cur + 1].id;
  else stop();
}
function stop() { playing = false; clearInterval(timer); $('play').textContent = 'Play'; }
function play() {
  if (playing) return stop();
  playing = true; $('play').textContent = 'Pause';
  timer = setInterval(() => { const n = LESSONS[cur].steps.length; if (stepI < n - 1) go(stepI + 1); else stop(); }, 3800);
}
function open(idx) {
  stop(); cur = idx; stepI = 0; openLv.add(LESSONS[idx].lvl);
  Scene.load(LESSONS[idx]); renderHead(); buildSide();
  DARK = isDark(); Scene.refresh(); paint();
  window.scrollTo(0, 0);
}
function route() {
  const hsh = (location.hash || '').slice(1);
  const isIv = hsh.startsWith('interview'), isRv = hsh.startsWith('revise');
  document.querySelector('.app').hidden = isIv || isRv; $('iv').hidden = !isIv; $('rv').hidden = !isRv;
  $('mLess').classList.toggle('on', !isIv && !isRv); $('mIv').classList.toggle('on', isIv); $('mRv').classList.toggle('on', isRv);
  $('menuBtn').hidden = isIv || isRv; closeMap();
  if (isIv) { stop(); document.title = 'Interview Lab · JS Orbit'; renderIv(hsh.split('/')[1] || ivState.tab); window.scrollTo(0, 0); return; }
  if (isRv) { stop(); document.title = 'Revise · JS Orbit'; renderRv(hsh.split('/')[1] || rvState.tab); window.scrollTo(0, 0); return; }
  const idx = LESSONS.findIndex(l => l.id === hsh);
  open(idx < 0 ? 0 : idx);
}
$('replay').onclick = () => { stop(); go(0); play(); };
$('play').onclick = play;
$('menuBtn').onclick = () => { const s = $('side'); const sh = s.classList.toggle('show'); $('menuBtn').setAttribute('aria-expanded', String(sh)); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMap(); });
document.addEventListener('keydown', (e) => {
  if (!$('iv').hidden || !$('rv').hidden) return;
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(stepI - 1); }
  else if (e.key === ' ' && !(e.target.tagName === 'BUTTON')) { e.preventDefault(); play(); }
  else if (e.key === 'r' || e.key === 'R') { stop(); go(0); play(); }
});
if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { Scene.refresh(); paint(); });

/* ===== Recap quiz: 3 rounds (5, 7, 9 questions), each unlocks after 60% ===== */
const QUIZ = {};
const QR = [{ n: 5, name: 'Easy' }, { n: 7, name: 'Medium' }, { n: 9, name: 'Hard' }];
const qPass = (n) => Math.ceil(n * 0.6);
let qBest = {}; try { qBest = JSON.parse(store.get('orbit-quiz') || '{}'); } catch (e) { }
const qSave = () => store.set('orbit-quiz', JSON.stringify(qBest));
const QZ = {};
function qShuf(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function qRich(s) { return String(s).split('`').map((t, i) => i % 2 ? E('code', {}, t) : t); }
function qUnlocked(id, r) { if (r === 0) return true; const b = qBest[id] || []; return (b[r - 1] || 0) >= qPass(QR[r - 1].n); }
function qStart(id, r) { const qs = QUIZ[id][r]; QZ[id] = { r, i: 0, pick: -1, score: 0, fin: false, res: [], ord: qs.map(q => qShuf(q.o.map((_, k) => k))) }; }
function quizCard(L) {
  const data = QUIZ[L.id]; if (!data) return null;
  const card = E('div', { class: 'card quiz' });
  card.addEventListener('keydown', (e) => e.stopPropagation());
  const draw = () => {
    card.replaceChildren();
    const S = QZ[L.id], best = qBest[L.id] || [];
    card.append(E('div', { class: 'qhead' }, E('h4', {}, 'Quick check'), E('span', { class: 'qsub' }, 'Pass a round (60%) to unlock the next')));
    card.append(E('div', { class: 'qrounds' }, QR.map((R, r) => {
      const un = qUnlocked(L.id, r), b = best[r];
      return E('button', { class: 'qr' + (S && S.r === r ? ' on' : '') + (un ? '' : ' lock'), disabled: !un, onclick: () => { qStart(L.id, r); draw(); } },
        E('span', {}, R.name), E('small', {}, R.n + ' questions'), E('em', {}, un ? (b != null ? 'best ' + b + '/' + R.n : 'not tried') : 'locked'));
    })));
    if (!S) { card.append(E('p', { class: 'qintro' }, 'Five easy questions first, then seven, then nine harder ones.'), E('button', { class: 'nbtn go qgo', onclick: () => { qStart(L.id, 0); draw(); } }, E('span', {}, 'Start round 1'), E('span', {}, '→'))); return; }
    const R = QR[S.r], qs = data[S.r];
    card.append(E('div', { class: 'qbar' }, qs.map((_, k) => E('i', { class: k < S.res.length ? (S.res[k] ? 'ok' : 'no') : (k === S.i && !S.fin ? 'cur' : '') }))));
    if (S.fin) {
      const pass = S.score >= qPass(R.n), last = S.r === QR.length - 1;
      card.append(E('div', { class: 'qres' }, E('b', {}, S.score + ' / ' + R.n),
        E('p', {}, pass ? (last ? 'Hard round cleared. You know this lesson well.' : 'Round passed. The next one is harder.') : 'You need ' + qPass(R.n) + ' correct to unlock the next round. Review the steps and try again.')));
      const row = E('div', { class: 'nav' });
      if (pass && !last) row.append(E('button', { class: 'nbtn go', onclick: () => { qStart(L.id, S.r + 1); draw(); } }, E('span', {}, 'Start ' + QR[S.r + 1].name + ' round (' + QR[S.r + 1].n + ')'), E('span', {}, '→')));
      row.append(E('button', { class: 'nbtn', onclick: () => { qStart(L.id, S.r); draw(); } }, 'Try again'));
      if (!pass) row.append(E('button', { class: 'nbtn', onclick: () => go(0) }, 'Review steps'));
      card.append(row); return;
    }
    const q = qs[S.i], ord = S.ord[S.i];
    card.append(E('div', { class: 'qmeta' }, E('span', { class: 'qlv l' + S.r }, R.name), E('span', {}, 'Question ' + (S.i + 1) + ' of ' + R.n)));
    card.append(E('p', { class: 'qq' }, qRich(q.q)));
    if (q.code) card.append(E('pre', { class: 'cd' }, q.code));
    ord.forEach((k, p) => {
      const cls = 'qo' + (S.pick >= 0 ? (k === q.a ? ' ok' : (k === S.pick ? ' bad' : '')) : '');
      card.append(E('button', { class: cls, disabled: S.pick >= 0, onclick: () => {
        S.pick = k; const right = k === q.a; if (right) S.score++; S.res.push(right); draw();
      } }, E('b', {}, String.fromCharCode(65 + p)), E('span', {}, qRich(q.o[k]))));
    });
    if (S.pick >= 0) {
      const right = S.pick === q.a, lastQ = S.i === qs.length - 1;
      card.append(E('div', { class: 'kc ' + (right ? 'know' : 'warn') }, E('small', {}, right ? 'Correct' : 'Not quite'), qRich(q.w)));
      card.append(E('button', { class: 'nbtn go qgo', onclick: () => {
        if (lastQ) {
          S.fin = true; const bb = qBest[L.id] || (qBest[L.id] = []);
          if (bb[S.r] == null || S.score > bb[S.r]) bb[S.r] = S.score; qSave();
        } else { S.i++; S.pick = -1; }
        draw();
      } }, E('span', {}, lastQ ? 'See result' : 'Next question'), E('span', {}, '→')));
    }
  };
  draw(); return card;
}

    { id: 'c6', cat: 'Core', lvl: 'Must know', q: "== versus ===, and how does coercion work?",

      pts: ["'5' == 5 is true, but '5' === 5 is false.", "null == undefined is true, but null === undefined is false.", "NaN is not equal to itself. Use Number.isNaN.", "+ with a string joins text. - * / turn values into numbers."],
      code: "'5' + 3;   // '53'\n'5' - 3;   // 2\n[] + {};   // '[object Object]'",
      trap: "Reciting the rules from memory. Better: say you avoid == except x == null to test null or undefined together." },
    { id: 'c7', cat: 'OOP', lvl: 'Common', q: "How does prototypal inheritance work? Is class real inheritance?",
      say: "Every object links to a prototype, and a missing property is looked up along that chain. class is cleaner syntax over the same mechanism.",
      pts: ["Methods live once on Class.prototype and are shared by all instances.", "extends links the two prototypes. super calls the parent.", "Object.create(proto) makes an object with a prototype you choose.", "instanceof walks the chain. Object.hasOwn checks own keys only."],
      code: "class Animal { eat() {} }\nclass Dog extends Animal { bark() {} }\nconst d = new Dog();\nd instanceof Animal;  // true",
      trap: "Defining methods inside the constructor. Every instance then gets its own copy." },
    { id: 'c8', cat: 'Browser', lvl: 'Common', q: "Explain bubbling, capturing and event delegation.",
      say: "Events travel down to the target (capture), then back up (bubble). Delegation puts one listener on a parent and reads event.target.",
      pts: ["Delegation means fewer listeners and it works for items added later.", "stopPropagation stops the bubble. preventDefault cancels the default action.", "Pass { capture: true } to listen during the downward phase."],
      code: "list.addEventListener('click', (e) => {\n  const li = e.target.closest('li');\n  if (li && list.contains(li)) select(li);\n});",
      trap: "Forgetting that focus and blur do not bubble. Use focusin and focusout instead." },
    { id: 'c9', cat: 'Browser', lvl: 'Must know', q: "Debounce versus throttle?",
      say: "Debounce waits until the activity stops. Throttle lets a call through at most once per interval.",
      pts: ["Debounce: search box, auto-save, resize end.", "Throttle: scroll, mousemove, dragging.", "Both are closures around a timer. Cancel them on unmount in React."],
      code: "const onType = debounce(search, 300);\nconst onScroll = throttle(update, 100);",
      trap: "Creating the debounced function inside a React render, so it is rebuilt every time. Keep it in useMemo or useRef." },
    { id: 'c10', cat: 'Core', lvl: 'Must know', q: "Shallow copy versus deep copy?",
      say: "A shallow copy duplicates the top level and shares nested objects. A deep copy duplicates everything.",
      pts: ["Spread, Object.assign and slice are shallow.", "structuredClone is a deep copy but cannot copy functions.", "JSON.parse(JSON.stringify(x)) drops Dates, undefined and Maps.", "In React state, never mutate nested objects. Copy each level you change."],
      code: "const a = { u: { n: 1 } };\nconst b = { ...a };\nb.u.n = 9;\na.u.n;  // 9  (shared!)",
      trap: "Believing spread makes a deep copy." },
    { id: 'c11', cat: 'Core', lvl: 'Common', q: "What is hoisting?",
      say: "JavaScript registers declarations before running the code. Functions are fully ready, var is undefined, let and const sit in the dead zone.",
      pts: ["Function declarations can be called before they appear.", "Function expressions and arrow functions follow the variable rule.", "Code is not moved. The engine creates the scope first, then runs."],
      code: "hi();                // works\nfunction hi() {}\nbye();               // TypeError: bye is not a function\nvar bye = () => {};",
      trap: "Describing hoisting as moving code to the top. Say declarations are created first." },
    { id: 'c12', cat: 'Core', lvl: 'Common', q: "call, apply and bind?",
      say: "All three set this. call and apply run now (arguments as a list or an array). bind returns a new function to run later.",
      pts: ["fn.call(obj, a, b)", "fn.apply(obj, [a, b])", "const g = fn.bind(obj, a)", "A bound function cannot be re-bound. The first bind wins."],
      code: "function hi(g) { return g + ', ' + this.name; }\nhi.call({ name: 'Asha' }, 'Hello');  // 'Hello, Asha'",
      trap: "Using an arrow function and then trying to bind it. Arrows ignore bind for this." },
    { id: 'c13', cat: 'Core', lvl: 'Common', q: "map vs forEach vs reduce. Which methods mutate the array?",
      say: "map returns a new array of the same length, forEach returns nothing, reduce folds to one value. push, pop, splice, sort and reverse mutate.",
      pts: ["Transform with map, select with filter, find one with find.", "forEach cannot be stopped and does not wait for async callbacks.", "toSorted and toReversed are non-mutating versions in modern engines."],
      code: "const nums = [3, 1, 2];\nnums.map(n => n * 2);\nnums.sort();  // mutates nums!",
      trap: "await inside forEach does not wait. Use for...of, or Promise.all with map." },
    { id: 'c14', cat: 'Browser', lvl: 'Senior-ish', q: "What causes memory leaks and how do you find them?",
      say: "Anything still referenced stays in memory: forgotten timers, listeners, globals, detached DOM nodes and caches that only grow.",
      pts: ["Fix: clearInterval, removeEventListener, AbortController, cleanup in useEffect.", "Use WeakMap or WeakRef for caches tied to an object's life.", "Find: Chrome DevTools, Memory tab. Take heap snapshots and compare them.", "Symptom: memory climbs after repeating an action, and never drops."],
      code: "useEffect(() => {\n  const id = setInterval(tick, 1000);\n  return () => clearInterval(id);  // cleanup\n}, []);",
      trap: "Only saying garbage collection handles it. It cannot free what is still reachable." },
    { id: 'c15', cat: 'Core', lvl: 'Common', q: "What are pure functions and why does immutability matter?",
      say: "A pure function gives the same output for the same input and changes nothing outside itself. Immutability makes changes easy to detect.",
      pts: ["Pure code is predictable and easy to test.", "React compares references. A mutated object keeps its reference, so React may not re-render.", "Copy instead of change: spread, map, filter, slice."],
      code: "// impure\nfunction add(list, x) { list.push(x); return list; }\n// pure\nconst add2 = (list, x) => [...list, x];",
      trap: "Mutating state in place and then wondering why the screen does not update." },
    { id: 'c16', cat: 'Core', lvl: 'Common', q: "ES modules versus CommonJS?",
      say: "ESM uses import and export, is analysed before running, and supports tree shaking. CommonJS uses require and module.exports and loads at run time.",
      pts: ["ESM exports are live bindings. CommonJS exports are copies.", "ESM supports top-level await and import().", "Node picks ESM with .mjs or type: module."],
      code: "import { add } from './math.js';   // ESM\nconst { add } = require('./math');  // CommonJS",
      trap: "Mixing the two styles in one file." }
  ],

  puzzles: [
    { id: 'p1', lvl: 'Easy', code: "console.log(typeof null);\nconsole.log(typeof undefined);\nconsole.log(typeof NaN);", out: ["object", "undefined", "number"], why: "typeof null is a 1995 bug that stayed. NaN is a number value that means not a valid number." },
    { id: 'p2', lvl: 'Easy', code: "console.log(0.1 + 0.2 === 0.3);\nconsole.log(0.1 + 0.2);", out: ["false", "0.30000000000000004"], why: "Numbers are binary floating point, so 0.1 and 0.2 cannot be stored exactly. Compare with a small tolerance or work in whole cents." },
    { id: 'p3', lvl: 'Tricky', code: "for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}", out: ["3", "3", "3"], why: "var makes one shared i. The callbacks run after the loop, when i is 3. With let you get 0 1 2, because each turn has its own i." },
    { id: 'p4', lvl: 'Tricky', code: "console.log(1);\nsetTimeout(() => console.log(2), 0);\nPromise.resolve().then(() => console.log(3));\nconsole.log(4);", out: ["1", "4", "3", "2"], why: "Synchronous lines first (1, 4). Then microtasks (3). Then the timer task (2)." },
    { id: 'p5', lvl: 'Tricky', code: "console.log('A');\nsetTimeout(() => console.log('B'), 0);\nPromise.resolve().then(() => console.log('C'));\n(async () => {\n  console.log('D');\n  await null;\n  console.log('E');\n})();\nconsole.log('F');", out: ["A", "D", "F", "C", "E", "B"], why: "An async function runs synchronously until its first await, so D prints right away. The code after await becomes a microtask, queued after C. The timer comes last." },
    { id: 'p6', lvl: 'Easy', code: "console.log(a);\nvar a = 5;\nconsole.log(b());\nfunction b() { return 'hi'; }", out: ["undefined", "hi"], why: "var is hoisted and set to undefined. A function declaration is hoisted with its body." },
    { id: 'p7', lvl: 'Tricky', code: "const o = { n: 'o', f() { return this.n; } };\nconst f = o.f;\nconsole.log(o.f());\nconsole.log(f());", out: ["o", "undefined"], why: "o.f() has an object before the dot. The detached f() does not, so this is not o." },
    { id: 'p8', lvl: 'Tricky', code: "console.log([1, 2, 3].map(parseInt));", out: ["[ 1, NaN, NaN ]"], why: "map passes (value, index). So parseInt runs as parseInt(2, 1) and parseInt(3, 2). Radix 1 and digit 3 in base 2 are invalid. Fix: map(n => parseInt(n, 10))." },
    { id: 'p9', lvl: 'Easy', code: "console.log([10, 9, 1].sort());", out: ["[ 1, 10, 9 ]"], why: "Without a compare function, sort converts items to strings. Use sort((a, b) => a - b)." },
    { id: 'p10', lvl: 'Tricky', code: "console.log(1 < 2 < 3);\nconsole.log(3 > 2 > 1);", out: ["true", "false"], why: "Comparisons run left to right. 3 > 2 is true, and true becomes 1, so 1 > 1 is false." },
    { id: 'p11', lvl: 'Tricky', code: "const a = {};\nconst b = { k: 1 };\nconst c = { k: 2 };\na[b] = 123;\na[c] = 456;\nconsole.log(a[b]);", out: ["456"], why: "Object keys become strings. Both b and c turn into the key [object Object], so the second write replaces the first. Use a Map for object keys." },
    { id: 'p12', lvl: 'Easy', code: "function make() {\n  let n = 0;\n  return () => ++n;\n}\nconst x = make();\nconst y = make();\nconsole.log(x(), x(), y());", out: ["1 2 1"], why: "Each call to make creates its own n. x and y are separate closures." },
    { id: 'p13', lvl: 'Easy', code: "console.log(1 + '2');\nconsole.log('3' - 1);\nconsole.log(true + 1);\nconsole.log([] + {});", out: ["12", "2", "2", "[object Object]"], why: "+ with a string joins text. - turns text into numbers. true becomes 1. An empty array becomes an empty string, and an object becomes [object Object]." },
    { id: 'p14', lvl: 'Easy', code: "console.log(!!'0', !!'', !![]);", out: ["true false true"], why: "Only eight values are falsy. The string '0' and an empty array are truthy. An empty string is falsy." }
  ],

  coding: [
    { id: 'k1', lvl: 'Easy', title: "Debounce", tags: ["closure", "timers"], prompt: "Write debounce(fn, ms). It returns a function that only calls fn after ms milliseconds pass with no new calls. Add a cancel method.",
      hints: ["You need one timer shared between calls, so keep it in a closure.", "On every call, clear the old timer and start a new one.", "Use a normal function so this and the arguments pass through."],
      code: "function debounce(fn, ms) {\n  let t;\n  function d(...args) {\n    clearTimeout(t);\n    t = setTimeout(() => fn.apply(this, args), ms);\n  }\n  d.cancel = () => clearTimeout(t);\n  return d;\n}",
      cx: "Time O(1) per call. Space O(1).", follow: ["Add a leading-edge option (call immediately, then ignore).", "How do you use it safely in React?"],
      test: "let n = 0; const d = debounce(() => n++, 20); d(); d(); d(); await new Promise(r => setTimeout(r, 60)); return n === 1;" },
    { id: 'k2', lvl: 'Easy', title: "Throttle", tags: ["closure", "timers"], prompt: "Write throttle(fn, ms). It calls fn at most once every ms milliseconds.",
      hints: ["Remember the time of the last call that went through.", "If enough time has passed, update the time and call fn.", "Date.now() is enough for the basic version."],
      code: "function throttle(fn, ms) {\n  let last = 0;\n  return function (...args) {\n    const now = Date.now();\n    if (now - last >= ms) {\n      last = now;\n      fn.apply(this, args);\n    }\n  };\n}",
      cx: "Time O(1) per call. Space O(1).", follow: ["Add a trailing call so the last event is not lost.", "When would requestAnimationFrame be better?"],
      test: "let n = 0; const t = throttle(() => n++, 50); t(); t(); t(); if (n !== 1) return false; await new Promise(r => setTimeout(r, 70)); t(); return n === 2;" },
    { id: 'k3', lvl: 'Medium', title: "Deep clone", tags: ["recursion", "objects"], prompt: "Write deepClone(value) for objects, arrays and dates. It must also survive circular references.",
      hints: ["Primitives and null can be returned as they are.", "Handle Date first. Then create an empty array or object and copy each key recursively.", "Keep a WeakMap from original to clone, so a circular reference reuses the clone."],
      code: "function deepClone(v, seen = new WeakMap()) {\n  if (v === null || typeof v !== 'object') return v;\n  if (v instanceof Date) return new Date(v);\n  if (seen.has(v)) return seen.get(v);\n  const out = Array.isArray(v) ? [] : {};\n  seen.set(v, out);\n  for (const k of Object.keys(v)) out[k] = deepClone(v[k], seen);\n  return out;\n}",
      cx: "Time O(n) in the number of values. Space O(n).", follow: ["Why not use JSON.parse(JSON.stringify())?", "What about Map, Set and RegExp?"],
      test: "const o = { a: [1, { b: 2 }], d: new Date(0) }; o.self = o; const c = deepClone(o); return c !== o && c.a !== o.a && c.a[1].b === 2 && c.self === c && c.d.getTime() === 0 && c.d !== o.d;" },
    { id: 'k4', lvl: 'Easy', title: "Flatten an array", tags: ["recursion", "arrays"], prompt: "Write flatten(arr, depth = Infinity) that flattens nested arrays up to the given depth, without using Array.prototype.flat.",
      hints: ["Walk the array. If an item is an array, flatten it one level less.", "Stop recursing when depth reaches 0.", "reduce with concat keeps it short."],
      code: "function flatten(arr, depth = Infinity) {\n  if (depth < 1) return arr.slice();\n  return arr.reduce(\n    (acc, x) => acc.concat(Array.isArray(x) ? flatten(x, depth - 1) : x),\n    []\n  );\n}",
      cx: "Time O(n). Space O(d) for the recursion depth.", follow: ["Write an iterative version using a stack.", "What happens with very deep nesting?"],
      test: "return JSON.stringify(flatten([1,[2,[3,[4]]]])) === '[1,2,3,4]' && JSON.stringify(flatten([1,[2,[3]]], 1)) === '[1,2,[3]]';" },
    { id: 'k5', lvl: 'Medium', title: "Implement Promise.all", tags: ["promises"], prompt: "Write promiseAll(items). It resolves with an array of results in the original order, and rejects as soon as any item rejects.",
      hints: ["Return a new Promise and count how many are still pending.", "Store each result at its own index, not with push.", "Wrap each item in Promise.resolve so plain values also work, and handle an empty list."],
      code: "function promiseAll(items) {\n  return new Promise((resolve, reject) => {\n    const out = [];\n    let left = 0, i = 0;\n    for (const p of items) {\n      const idx = i++;\n      left++;\n      Promise.resolve(p).then((v) => {\n        out[idx] = v;\n        if (--left === 0) resolve(out);\n      }, reject);\n    }\n    if (left === 0) resolve(out);\n  });\n}",
      cx: "Time O(n). Space O(n).", follow: ["Now write allSettled.", "Write a version with a concurrency limit."],
      test: "const r = await promiseAll([1, Promise.resolve(2), new Promise(x => setTimeout(() => x(3), 10))]); let bad = false; try { await promiseAll([1, Promise.reject(new Error('x'))]); } catch (e) { bad = true; } return JSON.stringify(r) === '[1,2,3]' && bad && (await promiseAll([])).length === 0;" },
    { id: 'k6', lvl: 'Easy', title: "Memoize", tags: ["closure", "cache"], prompt: "Write memoize(fn) that caches results by arguments so the same call is not computed twice.",
      hints: ["Keep a Map in the closure.", "Build a key from the arguments. JSON.stringify works for simple values.", "Return the cached value if the key exists."],
      code: "function memoize(fn) {\n  const cache = new Map();\n  return function (...args) {\n    const key = JSON.stringify(args);\n    if (cache.has(key)) return cache.get(key);\n    const result = fn.apply(this, args);\n    cache.set(key, result);\n    return result;\n  };\n}",
      cx: "Time O(1) per cached call. Space grows with distinct inputs.", follow: ["How do you stop the cache growing forever?", "What breaks when arguments are objects?"],
      test: "let n = 0; const sq = memoize((x) => { n++; return x * x; }); sq(4); sq(4); sq(5); return n === 2 && sq(4) === 16;" },
    { id: 'k7', lvl: 'Medium', title: "Curry", tags: ["functions"], prompt: "Write curry(fn) so curry(add3)(1)(2)(3) and curry(add3)(1, 2)(3) both work.",
      hints: ["fn.length tells you how many arguments fn expects.", "If you have enough arguments, call fn. Otherwise return a function that collects more.", "Concatenate the old and new arguments each time."],
      code: "function curry(fn) {\n  return function c(...args) {\n    if (args.length >= fn.length) return fn.apply(this, args);\n    return (...more) => c.apply(this, args.concat(more));\n  };\n}",
      cx: "Time O(k) for k calls. Space O(k).", follow: ["Why does fn.length fail with default or rest parameters?", "Add placeholder support."],
      test: "const add3 = (a, b, c) => a + b + c; return curry(add3)(1)(2)(3) === 6 && curry(add3)(1, 2)(3) === 6 && curry(add3)(1)(2, 3) === 6;" },
    { id: 'k8', lvl: 'Easy', title: "Group by", tags: ["reduce", "objects"], prompt: "Write groupBy(items, key) that returns an object of arrays, grouped by a property name or by a function result.",
      hints: ["reduce into an empty object.", "Work out the group key for each item.", "Create the array if it does not exist, then push."],
      code: "const groupBy = (items, key) =>\n  items.reduce((acc, x) => {\n    const k = typeof key === 'function' ? key(x) : x[key];\n    (acc[k] ||= []).push(x);\n    return acc;\n  }, {});",
      cx: "Time O(n). Space O(n).", follow: ["Return a Map instead.", "Count items per group instead of listing them."],
      test: "const g = groupBy([{t:'a',n:1},{t:'b',n:2},{t:'a',n:3}], 't'); const h = groupBy([1,2,3,4], (x) => x % 2 ? 'odd' : 'even'); return g.a.length === 2 && g.b.length === 1 && h.odd.length === 2;" },
    { id: 'k9', lvl: 'Medium', title: "Event emitter", tags: ["classes", "patterns"], prompt: "Build an Emitter class with on, off, once and emit. on should return an unsubscribe function.",
      hints: ["Store listeners in a Map from event name to a Set.", "once wraps the listener so it removes itself before running.", "Copy the listeners before looping in emit, so removing during emit is safe."],
      code: "class Emitter {\n  constructor() { this.m = new Map(); }\n  on(e, f) {\n    if (!this.m.has(e)) this.m.set(e, new Set());\n    this.m.get(e).add(f);\n    return () => this.off(e, f);\n  }\n  off(e, f) { this.m.get(e)?.delete(f); }\n  once(e, f) {\n    const w = (...a) => { this.off(e, w); f(...a); };\n    this.on(e, w);\n  }\n  emit(e, ...a) {\n    [...(this.m.get(e) || [])].forEach((f) => f(...a));\n  }\n}",
      cx: "on, off O(1). emit O(listeners).", follow: ["How would you add async listeners?", "Where is this pattern used in real apps?"],
      test: "let n = 0; const em = new Emitter(); const off = em.on('x', (v) => { n += v; }); em.once('x', (v) => { n += 10; }); em.emit('x', 1); em.emit('x', 1); off(); em.emit('x', 1); return n === 12;" },
    { id: 'k10', lvl: 'Easy', title: "Two sum", tags: ["map", "arrays"], prompt: "Given an array of numbers and a target, return the indexes of the two numbers that add up to the target.",
      hints: ["The brute force checks every pair, which is O(n squared).", "For each number, the partner you need is target minus it.", "Remember numbers you have seen in a Map from value to index."],
      code: "function twoSum(nums, target) {\n  const seen = new Map();\n  for (let i = 0; i < nums.length; i++) {\n    const need = target - nums[i];\n    if (seen.has(need)) return [seen.get(need), i];\n    seen.set(nums[i], i);\n  }\n  return [];\n}",
      cx: "Time O(n). Space O(n).", follow: ["What if the array is sorted? (two pointers, O(1) space)", "What if there are duplicates?"],
      test: "const r = twoSum([2, 7, 11, 15], 9); const s = twoSum([3, 3], 6); return r[0] === 0 && r[1] === 1 && s[0] === 0 && s[1] === 1 && twoSum([1, 2], 9).length === 0;" },
    { id: 'k11', lvl: 'Medium', title: "LRU cache", tags: ["map", "design"], prompt: "Build an LRU cache with get(key) and put(key, value) that evicts the least recently used entry when full.",
      hints: ["A Map remembers insertion order.", "On get or put, delete the key and set it again so it becomes the newest.", "When size passes the limit, delete the first key: map.keys().next().value."],
      code: "class LRU {\n  constructor(n) { this.n = n; this.m = new Map(); }\n  get(k) {\n    if (!this.m.has(k)) return -1;\n    const v = this.m.get(k);\n    this.m.delete(k);\n    this.m.set(k, v);\n    return v;\n  }\n  put(k, v) {\n    this.m.delete(k);\n    this.m.set(k, v);\n    if (this.m.size > this.n) this.m.delete(this.m.keys().next().value);\n  }\n}",
      cx: "get and put O(1).", follow: ["Build it with a doubly linked list and a hash map, without relying on Map order.", "Add expiry times."],
      test: "const c = new LRU(2); c.put(1, 1); c.put(2, 2); c.get(1); c.put(3, 3); return c.get(2) === -1 && c.get(1) === 1 && c.get(3) === 3;" },
    { id: 'k12', lvl: 'Medium', title: "Retry with backoff", tags: ["async", "errors"], prompt: "Write retry(fn, tries, delay). It calls the async function fn, and on failure waits and tries again, doubling the wait each time, then throws the last error.",
      hints: ["A loop with try and catch is simpler than recursion.", "If this was the last try, rethrow the error.", "Wait delay * 2 ** attempt using a promise around setTimeout."],
      code: "async function retry(fn, tries = 3, delay = 100) {\n  for (let i = 0; ; i++) {\n    try {\n      return await fn();\n    } catch (e) {\n      if (i >= tries - 1) throw e;\n      await new Promise((r) => setTimeout(r, delay * 2 ** i));\n    }\n  }\n}",
      cx: "Time grows with the number of tries and the waits.", follow: ["Add jitter. Why does it help?", "Which errors should not be retried?"],
      test: "let n = 0; const ok = await retry(async () => { if (++n < 3) throw new Error('x'); return 'ok'; }, 3, 5); let failed = false; try { await retry(async () => { throw new Error('no'); }, 2, 5); } catch (e) { failed = e.message === 'no'; } return ok === 'ok' && n === 3 && failed;" },
    { id: 'k13', lvl: 'Easy', title: "Valid parentheses", tags: ["stack", "strings"], prompt: "Given a string of brackets ()[]{}, return true if every bracket is closed in the correct order.",
      hints: ["The most recent opening bracket must be closed first. That is a stack.", "Push openers. On a closer, pop and compare.", "At the end the stack must be empty."],
      code: "function isValid(s) {\n  const pair = { ')': '(', ']': '[', '}': '{' };\n  const stack = [];\n  for (const ch of s) {\n    if (ch in pair) {\n      if (stack.pop() !== pair[ch]) return false;\n    } else stack.push(ch);\n  }\n  return stack.length === 0;\n}",
      cx: "Time O(n). Space O(n).", follow: ["Return the index of the first error.", "Allow other characters in the string."],
      test: "return isValid('()[]{}') && isValid('{[]}') && !isValid('(]') && !isValid('(()') && !isValid(')(') && isValid('');" },
    { id: 'k14', lvl: 'Medium', title: "Polyfill bind", tags: ["this", "functions"], prompt: "Add Function.prototype.myBind(ctx, ...preset) that behaves like bind for normal calls.",
      hints: ["Inside the method, this is the function being bound. Save it.", "Return a new function that calls the original with apply.", "Join the preset arguments with the new ones."],
      code: "Function.prototype.myBind = function (ctx, ...preset) {\n  const fn = this;\n  return function (...args) {\n    return fn.apply(ctx, [...preset, ...args]);\n  };\n};",
      cx: "Time O(1) to bind.", follow: ["Make it work with new.", "Why can an arrow function not be rebound?"],
      test: "function g(a, b) { return this.x + a + b; } return g.myBind({ x: 1 }, 2)(3) === 6 && g.myBind({ x: 10 })(1, 1) === 12;" }
  ],

  scenarios: [
    { id: 's1', title: "You do not know the answer", sit: "The interviewer asks about something you have never used.",

<title>React Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fira+Code:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* React Orbit: night-sky theme, glowing floating tiles, lesson map, segmented progress. */
:root {
  --bg: #080c1d; --panel: #111936; --panel2: #1a2450; --ink: #eef1ff; --muted: #9aa6d8; --line: #28346a; --dot: #34417e;
  --a1: #2de2c4; --a2: #9b7bff; --a3: #ffb62e; --a4: #ff5d8f; --shadow: rgba(0, 0, 0, .5); --glow: rgba(45, 226, 196, .8); --pillbg: #0b1230;
  --idea: #2d2470; --tip: #0f4440; --warn: #5a3a0c; --catch: #5c1c3c; --wrap: #1d2c70;
  --disp: "Sora", system-ui, sans-serif; --body: "DM Sans", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
    --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
    --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
  --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
  --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: clip; }
body { margin: 0; background: radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--a2) 22%, transparent), transparent), radial-gradient(700px 380px at 5% 0%, color-mix(in srgb, var(--a1) 14%, transparent), transparent), var(--bg); color: var(--ink); font: 14px/1.6 var(--body); padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; position: relative; z-index: 20; }
.brand { font: 700 18px var(--disp); display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; }
.ring { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, var(--a1), var(--a2), var(--a4), var(--a3), var(--a1)); position: relative; }
.ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.menu { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font: 600 12.5px var(--disp); display: flex; gap: 8px; align-items: center; }
.menu:hover { border-color: var(--a1); }
.spacer { flex: 1; }
.pg { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.bar { width: 110px; height: 6px; border-radius: 6px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); }
.map { display: none; position: absolute; left: 0; right: 0; top: 100%; max-height: min(70vh, 640px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 24px 60px var(--shadow); }
.map.show { display: block; }
.map h3 { margin: 12px 0 8px; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.map h3:first-child { margin-top: 0; }
.map h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.lc { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: flex; gap: 9px; align-items: center; }
.lc:hover { border-color: var(--a1); }
.lc.on { border-color: var(--a1); box-shadow: 0 0 0 1px var(--a1) inset; }
.lc b { font: 600 12px var(--mono); color: var(--muted); width: 22px; flex: none; }
.lc span { font: 600 13px var(--disp); line-height: 1.25; flex: 1; }
.lc em { font-style: normal; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 10px; }
.lc.done em { background: var(--a1); border-color: var(--a1); color: #04201c; }
.lc.done em::after { content: "\2713"; font-weight: 700; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.center { min-width: 0; display: grid; gap: 10px; }
.crumb { font: 500 11.5px var(--mono); color: var(--a1); margin: 0; letter-spacing: .04em; }
.head h1 { font: 700 clamp(22px, 3.4vw, 32px)/1.1 var(--disp); margin: 4px 0 4px; letter-spacing: -.02em; background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--a2) 60%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font: 500 11px var(--mono); border-radius: 999px; padding: 2px 10px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.chip:nth-child(1) { color: var(--a1); border-color: color-mix(in srgb, var(--a1) 50%, var(--line)); }
.chip:nth-child(2) { color: var(--a3); border-color: color-mix(in srgb, var(--a3) 50%, var(--line)); }
.chip:nth-child(3) { color: var(--a4); border-color: color-mix(in srgb, var(--a4) 50%, var(--line)); }
.stagebox { position: relative; background: radial-gradient(640px 300px at 50% 42%, color-mix(in srgb, var(--a2) 20%, var(--panel)), var(--panel)); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.read { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; max-width: calc(100% - 200px); }
.rd { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-left: 3px solid var(--a1); border-radius: 8px; padding: 3px 10px; min-width: 80px; backdrop-filter: blur(6px); }
.rd:nth-child(2) { border-left-color: var(--a3); } .rd:nth-child(3) { border-left-color: var(--a4); } .rd:nth-child(4) { border-left-color: var(--a2); }
.rd small { display: block; font: 500 9.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.rd b { font: 600 13px var(--mono); color: var(--ink); }
.tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 2; }
.sbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font: 600 12px var(--disp); }
.sbtn:hover { border-color: var(--a1); }
.scrollx { overflow: hidden; }
svg.scene { display: block; width: 100%; height: auto; max-height: calc(100vh - 290px); }
.gdot { fill: var(--dot); }
.face { stroke: color-mix(in srgb, #fff 30%, transparent); stroke-width: 1; stroke-linejoin: round; }
.shadow { fill: var(--shadow); stroke: none; filter: blur(5px); }
.glyph { font: 600 12px var(--mono); fill: #060c1c; text-anchor: middle; pointer-events: none; }
.pillbox { fill: var(--pillbg); stroke: color-mix(in srgb, var(--a1) 55%, var(--line)); stroke-width: 1.2; }
.pt { font: 600 12.5px var(--mono); fill: var(--ink); text-anchor: middle; }
.ps { font: 400 10.5px var(--mono); fill: var(--muted); text-anchor: middle; }
.n { transition: transform .75s cubic-bezier(.3, .8, .3, 1); }
.in { transition: opacity .45s, transform .6s cubic-bezier(.3, 1.4, .5, 1); }
.in.off { opacity: 0; transform: translateY(-22px) scale(.92); }
.n.dim .in { opacity: .28; }
.n.hi .in { filter: drop-shadow(0 0 10px var(--glow)); animation: bob 1.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.eg { fill: none; stroke-width: 2.4; stroke-linecap: round; animation: draw .5s ease backwards; }
.eg circle { filter: drop-shadow(0 0 5px var(--glow)); }
@keyframes draw { from { opacity: 0; } to { opacity: 1; } }
.legend { display: flex; gap: 12px 16px; padding: 4px 14px 10px; font: 400 11px var(--mono); color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stepper { overflow-x: hidden; position: sticky; bottom: 8px; z-index: 6; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 12px; box-shadow: 0 -8px 24px var(--shadow); }
.stepper h5 { margin: 0 0 8px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; background: none; border: 0; padding: 0; text-align: left; }
.dot span.c { display: block; width: 100%; height: 7px; border-radius: 99px; background: var(--line); font-size: 0; transition: background .3s; }
.dot.past span.c { background: var(--a1); opacity: .7; }
.dot.cur span.c { background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); box-shadow: 0 0 12px var(--glow); }
.dot span.l { font: 500 10.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot.cur span.l { color: var(--ink); font-weight: 600; }
.panel { position: sticky; top: 8px; display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 15px; position: relative; overflow: hidden; }
.card:first-child::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--a1), var(--a2), var(--a4)); }
.stephead { display: flex; justify-content: space-between; align-items: center; font: 500 11px var(--mono); color: var(--muted); }
.tag { border-radius: 999px; padding: 2px 10px; font: 600 10px var(--mono); letter-spacing: .08em; color: var(--ink); }
.tag.PROBLEM { background: var(--catch); } .tag.CONCEPT { background: var(--idea); } .tag.TECHNIQUE { background: var(--tip); } .tag.WATCH { background: var(--warn); } .tag.RECAP { background: var(--wrap); }
.card h2 { font: 700 19px/1.25 var(--disp); margin: 9px 0 8px; letter-spacing: -.01em; }
.card p { margin: 0 0 8px; }
.card code, .kc code { font: 500 12px var(--mono); background: var(--panel2); border-radius: 5px; padding: 1px 5px; color: var(--a1); }
pre.cd { background: #060a17; color: #dbe4ff; font: 400 12px/1.65 var(--mono); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.kc { border-radius: 12px; padding: 9px 12px; margin-top: 10px; border-left: 3px solid var(--a2); }
.kc small { display: block; font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; color: var(--muted); }
.kc.idea { background: var(--idea); border-color: var(--a2); } .kc.know { background: var(--tip); border-color: var(--a1); } .kc.warn { background: var(--warn); border-color: var(--a3); }
.chg { margin-top: 10px; font-size: 12.5px; }
.chg small { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chg ul { margin: 4px 0 0; padding-left: 16px; }
.nav { display: flex; gap: 8px; margin-top: 12px; }
.nbtn { border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); background: var(--panel2); }
.nbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; flex: 1; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.nbtn:disabled { opacity: .35; cursor: default; }
.hint { font: 400 10.5px var(--mono); color: var(--muted); margin-top: 8px; }
.learn h4 { margin: 0 0 6px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.learn label { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 2px 0; color: var(--muted); }
.learn label.on { color: var(--ink); }
.learn .bx { width: 14px; height: 14px; border: 1.5px solid var(--dot); border-radius: 50%; flex: none; margin-top: 3px; display: grid; place-items: center; font-size: 9px; }
.learn label.on .bx { background: var(--a1); border-color: var(--a1); color: #04201c; }
.learn label.on .bx::after { content: "\2713"; font-weight: 700; }
@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
  .read { max-width: 100%; position: static; padding: 8px 10px 0; }
  .tools { position: static; padding: 8px 10px 0; }
  .pg .bar { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 13.5px; }
  .dot span.l { display: none; }
  .sbtn { padding: 3px 10px; }
  .rd { min-width: 0; }
  .card h2 { font-size: 17px; }
  svg.scene { max-height: 56vh; }
  .stepper { padding: 8px 10px; }
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style>
[hidden] { display: none !important; }
.mode { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode a { font: 600 12.5px var(--disp); color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 999px; }
.mode a.on { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; }
#iv { display: grid; gap: 12px; max-width: 980px; margin: 0 auto; }
.ivhero { display: flex; gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.ivhero h1 { font: 700 clamp(24px, 4vw, 34px)/1.1 var(--disp); margin: 4px 0; letter-spacing: -.02em; }
.ivprog { min-width: 150px; display: grid; gap: 4px; font: 500 12px var(--mono); color: var(--muted); }
.ivprog b { font: 700 22px var(--disp); color: var(--ink); }
.ivprog .bar { width: 100%; }
.how { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font: 600 12px var(--disp); }
.how .chip { color: var(--a1); }
.ivtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.ivtab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); display: flex; gap: 8px; align-items: center; }
.ivtab em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.ivtab:hover { border-color: var(--a1); }
.ivtab.on { background: linear-gradient(90deg, color-mix(in srgb, var(--a1) 28%, var(--panel)), color-mix(in srgb, var(--a2) 28%, var(--panel))); border-color: var(--a1); }
.tabdesc { margin: 0; }
.ivbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ivbar input { flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 8px 12px; font: 14px var(--body); }
.ivbar input:focus { outline: 2px solid var(--a1); outline-offset: 1px; }
.chip.fb { cursor: pointer; }
.chip.fb.on { background: var(--a1); color: #04201c; border-color: var(--a1); }
.ivlist { display: grid; gap: 8px; }
.ivc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ivc[open] { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.ivc summary { list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 11px 14px; }
.ivc summary::-webkit-details-marker { display: none; }
.ivc .num { font: 600 12px var(--mono); color: var(--a2); }
.ivc .tt { flex: 1; font: 600 14.5px/1.35 var(--disp); }
.ivc .tt small { display: block; font: 400 11px var(--mono); color: var(--muted); margin-top: 2px; }
.lvl { font: 600 10px var(--mono); border-radius: 999px; padding: 2px 9px; background: var(--panel2); color: var(--muted); letter-spacing: .04em; }
.lvl.l-mustknow, .lvl.l-tricky { color: var(--a4); } .lvl.l-easy { color: var(--a1); } .lvl.l-medium, .lvl.l-common { color: var(--a3); } .lvl.l-seniorish { color: var(--a2); }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 11px; font-style: normal; }
.ivc.done .tick { background: var(--a1); border-color: var(--a1); color: #04201c; }
.ivc.done .tick::after { content: "\2713"; font-weight: 700; }
.ivb { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.ivb .ask { margin: 8px 0 0; font-size: 14.5px; }
.ivb .lab { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 4px; }
.ivb .kc { margin: 0; }
.ivb pre.cd { margin: 0; }
.ivl { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.ivbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font: 600 12.5px var(--disp); justify-self: start; }
.ivbtn:hover:not(:disabled) { border-color: var(--a1); }
.ivbtn:disabled { opacity: .45; cursor: default; }
.ivbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; }
.ivbtn.mark { margin-top: 4px; }
.ivb .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ans { display: grid; gap: 8px; }
.hint-i { background: var(--panel2); border-left: 3px solid var(--a3); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; margin-top: 6px; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
@media (max-width: 640px) { .ivc summary { padding: 10px; gap: 8px; } .lvl { display: none; } .mode a { padding: 5px 10px; } }
</style>

<style>
#rv { display: grid; gap: 12px; max-width: 1100px; margin: 0 auto; }
.cs { columns: 300px; column-gap: 12px; }
.csc { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tone, var(--a1)); border-radius: 14px; padding: 4px 12px 8px; margin: 0 0 12px; }
.csc h3 { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px; font: 700 14px var(--disp); }
.csc h3 em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.csdef, .csidea { margin: 4px 0 0; font-size: 12.5px; }
.csdef b, .csidea b { font: 700 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--tone, var(--a1)); margin-right: 4px; }
.csidea { background: var(--panel2); border-left: 3px solid var(--tone, var(--a1)); border-radius: 8px; padding: 6px 10px; margin: 8px 0 6px; }
.csr { padding: 7px 0; border-top: 1px dashed var(--line); }
.csr:first-of-type { border-top: 0; }
.csr pre { margin: 0; font: 500 12px/1.5 var(--mono); color: var(--tone, var(--a1)); white-space: pre-wrap; overflow-wrap: anywhere; }
.csr p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.rvlist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.rvlist.day { grid-template-columns: 1fr; }
.rvb { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.rvb.done { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.rvh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rvh h3 { margin: 0; font: 700 16px var(--disp); }
.rvh small { display: block; font: 500 11px var(--mono); color: var(--muted); }
.rvn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--disp); background: linear-gradient(135deg, var(--a1), var(--a2)); color: #06121f; flex: none; }
.rvt { font: 600 11.5px var(--mono); color: var(--a3); background: var(--panel2); border-radius: 999px; padding: 3px 11px; flex: none; }
.rvcks { display: grid; gap: 4px; }

      if (ed.pk) { const pk = sv('circle', { r: 7, class: 'face', style: 'fill:#2de2c4;stroke:#fff;stroke-width:1.5' }, sv('animateMotion', { dur: (ed.dur || 1.8) + 's', repeatCount: 'indefinite', path: dpath })); eg.append(pk); }
      eLayer.append(eg);
      if (ed.t) lbls.push({ t: ed.t, cx: (P0[0] + 2 * M[0] + P1[0]) / 4 + (ed.lo ? ed.lo[0] : 0), cy: (P0[1] + 2 * M[1] + P1[1]) / 4 + (ed.lo ? ed.lo[1] : -18), w: Math.max(String(ed.t).length * 7.5, 0) + 20 });
    }
    layoutLabels(items, lbls);
  }
  const refresh = () => { for (const id in els) els[id].key = ''; };
  return { init, load, apply, refresh };
})();

lesson({

  steps: [
    st('PROBLEM', 'Two siblings, two copies', ['TodoList and CountBadge both need the todos. If each keeps its own useState, adding a todo in one never reaches the other.', 'The screen shows two different truths.'], { add: ['list', 'badge'], set: { list: { s: 'own state: 3 todos' }, badge: { s: 'own state: 2 todos' } }, hi: ['list', 'badge'], read: [['List', '3'], ['Badge', '2']], code: 'function TodoList() {\n  const [todos, setTodos] = useState([]);\n}\nfunction CountBadge() {\n  const [todos, setTodos] = useState([]);  // a different copy\n}', key: ['warn', 'Duplicated state always drifts. There must be one source of truth.'], short: 'Two copies' }),
    st('CONCEPT', 'Lift state to the closest common parent', ['Move the state up to the nearest component that contains both children. It passes the data down as props.', 'Now both read the same value, so they cannot disagree.'], { add: ['app'], set: { list: { s: 'props.todos' }, badge: { s: 'props.todos' } }, e: ['p1', 'p2'], hi: ['app'], read: [['Source', 'App']], code: 'function App() {\n  const [todos, setTodos] = useState([]);\n  return (\n    <>\n      <TodoList todos={todos} />\n      <CountBadge count={todos.length} />\n    </>\n  );\n}', key: ['idea', 'Data flows down as props. One owner, many readers.'], short: 'Lift up' }),

/* ===== Recap quiz: 3 rounds (5, 7, 9 questions), each unlocks after 60% ===== */
const QUIZ = {};

let qBest = {}; try { qBest = JSON.parse(store.get('orbit-quiz') || '{}'); } catch (e) { }
const qSave = () => store.set('orbit-quiz', JSON.stringify(qBest));
const QZ = {};

    card.append(E('div', { class: 'qhead' }, E('h4', {}, 'Quick check'), E('span', { class: 'qsub' }, 'Pass a round (60%) to unlock the next')));
    card.append(E('div', { class: 'qrounds' }, QR.map((R, r) => {

      return E('button', { class: 'qr' + (S && S.r === r ? ' on' : '') + (un ? '' : ' lock'), disabled: !un, onclick: () => { qStart(L.id, r); draw(); } },

    })));

const ref = useRef(null);
<input defaultValue="Ann" ref={ref} />   // read ref.current.value on submit`,
      trap: 'Passing value without onChange. The input becomes read-only and React warns.' },
    { id: 'r-c5', cat: 'Hooks', lvl: 'Must know', q: 'How does useEffect work? Explain the dependency array and cleanup.',
      say: "useEffect runs after the screen is painted to synchronise with something outside React. The dependency array says when to re-run it, and the cleanup function runs before the next run and on unmount.",
      pts: ['No array: runs after every render. Empty array: runs once after mount. With values: runs when any of them changes.', 'Dependencies are compared with Object.is, so a new object or function each render re-runs the effect.', 'Cleanup removes subscriptions, timers and listeners, and cancels requests.', 'Every value from the component that the effect reads belongs in the array. Let the lint rule enforce it.', 'Do not use an effect for things you can calculate during render or do in an event handler.'],
      code: `useEffect(() => {
  const id = setInterval(tick, 1000);
  return () => clearInterval(id);   // cleanup
}, [tick]);`,
      trap: 'Adding an effect to compute derived state. Compute it in render. Effects are for syncing with the outside world.' },
    { id: 'r-c6', cat: 'Hooks', lvl: 'Must know', q: 'What is a stale closure in React and how do you fix it?',
      say: "Each render has its own copy of props and state. A callback created in an earlier render, like one inside setInterval or an effect with empty deps, keeps seeing the old values.",
      pts: ['Every render is a snapshot: the values inside it never change.', 'Typical case: an effect with [] that reads state inside a timer or listener.', 'Fix 1: use the functional update, setCount((c) => c + 1).', 'Fix 2: list the value in the dependency array and clean up properly.', 'Fix 3: keep the latest callback in a ref and call ref.current from the long-lived function.'],
      code: `useEffect(() => {
  const id = setInterval(() => setN((n) => n + 1), 1000);  // no stale n
  return () => clearInterval(id);
}, []);`,
      trap: 'Silencing the exhaustive-deps lint warning with a comment instead of fixing the closure.' },
    { id: 'r-c7', cat: 'Core', lvl: 'Must know', q: 'Why must you not mutate state directly?',
      say: "React decides whether to re-render by comparing the new state to the old with Object.is. A mutated object or array keeps the same reference, so React sees no change and skips the update.",
      pts: ['Mutation also breaks memo, useMemo and effect dependencies, which rely on reference changes.', 'It makes time-travel debugging and predictable renders impossible.', 'Create new copies: spread, map, filter, slice. Nested data needs nested copies.', 'Immer lets you write mutating-looking code that produces immutable updates.'],
      code: `setItems(items.push(4));                 // wrong: push returns a number
items.push(4); setItems(items);          // wrong: same reference
setItems([...items, 4]);                 // right
setUser({ ...user, address: { ...user.address, city: 'Pune' } });`,
      trap: 'Copying only the top level. Spreading a user object still shares the nested address object.' },
    { id: 'r-c8', cat: 'Hooks', lvl: 'Common', q: 'What is batching and when do you need the functional form of setState?',
      say: "React groups several state updates in the same event or callback into one re-render. Because state in a render is a snapshot, updates based on the previous value must use the functional form.",
      pts: ['Since React 18, batching happens everywhere: events, timeouts, promises.', 'setN(n + 1) three times in one handler results in n + 1, because n is the same snapshot each time.', 'setN((p) => p + 1) three times results in n + 3, because each call gets the latest queued value.', 'flushSync forces a synchronous update and is rarely needed.'],
      code: `function add() {
  setN(n + 1);
  setN(n + 1);          // still n + 1
  setN((p) => p + 1);   // functional: uses the queued value
}`,
      trap: 'Reading state right after calling setState and expecting the new value. It is still the old snapshot.' },
    { id: 'r-c9', cat: 'Hooks', lvl: 'Common', q: 'What is useRef and when would you use it?',
      say: "useRef gives you a mutable box whose .current survives re-renders, and changing it does not trigger a re-render. Use it for DOM nodes and for values that are not part of the UI.",
      pts: ['DOM access: focus an input, measure an element, scroll.', 'Storing timer ids, previous values, or the latest callback.', 'Do not read or write ref.current during render, except for lazy initialisation.', 'In React 19 a ref can be passed as a normal prop to a function component, so forwardRef is no longer needed.'],
      code: `const inputRef = useRef(null);
useEffect(() => inputRef.current.focus(), []);
return <input ref={inputRef} />;`,
      trap: 'Using a ref for data that should appear on screen. Nothing re-renders when it changes.' },
    { id: 'r-c10', cat: 'Performance', lvl: 'Common', q: 'React.memo, useMemo and useCallback: what is each for?',
      say: "React.memo skips re-rendering a component when its props are unchanged. useMemo caches a calculated value and useCallback caches a function, so references stay stable between renders.",
      pts: ['memo compares props shallowly. A new object, array or function prop each render defeats it.', 'useCallback(fn, deps) is just useMemo(() => fn, deps).', 'They only help when passed to a memoised child or used as an effect dependency, or when the calculation is genuinely expensive.', 'Measure first with the Profiler. Memoisation has its own cost and adds noise.', 'The React Compiler can add much of this memoisation automatically.'],
      code: `const Row = memo(function Row({ item, onPick }) { /* ... */ });
const onPick = useCallback((id) => select(id), []);
const sorted = useMemo(() => sortBy(items, key), [items, key]);`,
      trap: 'Wrapping everything in useMemo and useCallback by habit. Without a memoised consumer it does nothing but cost.' },
    { id: 'r-c11', cat: 'Patterns', lvl: 'Common', q: 'What are the pitfalls of Context?',
      say: "Every component that reads a context re-renders whenever the provider value changes, and context has no built-in selector, so it suits slow-changing data like theme or the current user.",
      pts: ['A new object in value={{ a, b }} re-renders all consumers on every provider render.', 'Memoise the value, or split state and dispatch into two contexts.', 'Split contexts by concern so a change in one does not wake every consumer.', 'Not a replacement for a state library for frequently changing data.', 'Put the provider as low in the tree as it can go.'],
      code: `const value = useMemo(() => ({ user, logout }), [user, logout]);
return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;`,
      trap: 'Putting rapidly changing state, such as mouse position or input text, into one big global context.' },
    { id: 'r-c12', cat: 'Patterns', lvl: 'Common', q: 'How do you avoid prop drilling?',
      say: "First restructure with composition by passing children or elements as props. If many distant components need the data, use context or a state library.",
      pts: ['Composition: pass a ready-made element down as a prop so intermediate components never see the data.', 'Move state closer to where it is used. Lift only as far as needed.', 'Context for app-wide, slow-changing values.', 'Zustand, Redux Toolkit or Jotai for shared, frequently changing state.', 'Drilling two or three levels is fine. Fix it when it hurts.'],
      code: `// before: Page -> Layout -> Sidebar -> Avatar(user)
<Layout sidebar={<Avatar user={user} />} />   // Layout never sees user`,
      trap: 'Reaching for global state at the first sign of drilling when composition would solve it.' },
    { id: 'r-c13', cat: 'Hooks', lvl: 'Common', q: 'When would you use useReducer instead of useState?',
      say: "Use useReducer when state has several related fields or many ways to change it, because all the update logic lives in one pure function that is easy to test.",
      pts: ['reducer(state, action) returns the next state and must be pure.', 'dispatch has a stable identity, so it is safe to pass down or use in deps.', 'Good for forms, wizards, todo lists, and anything modelled as events.', 'Combine with context to share state and dispatch without prop drilling.'],
      code: `function reducer(state, action) {
  switch (action.type) {
    case 'add': return [...state, action.todo];
    case 'remove': return state.filter((t) => t.id !== action.id);
    default: return state;
  }
}
const [todos, dispatch] = useReducer(reducer, []);`,
      trap: 'Mutating state inside the reducer. It must return a new value.' },
    { id: 'r-c14', cat: 'Patterns', lvl: 'Common', q: 'What is a custom hook, and what are the rules of hooks?',
      say: "A custom hook is a function whose name starts with use and that calls other hooks, so you can share stateful logic between components. The rules: call hooks only at the top level and only from components or other hooks.",
      pts: ['Each call to a custom hook gets its own state. Hooks share logic, not state.', 'Never call hooks in loops, conditions, nested functions or after an early return.', 'React tracks hooks by call order, so the order must be identical every render.', 'The eslint-plugin-react-hooks rules catch both problems.', 'Return what the caller needs: a value, a tuple or an object.'],
      code: `function useToggle(initial = false) {
  const [on, setOn] = useState(initial);
  const toggle = useCallback(() => setOn((v) => !v), []);
  return [on, toggle];
}`,
      trap: 'Thinking two components using the same custom hook share its state. Each gets a separate copy.' },
    { id: 'r-c15', cat: 'Core', lvl: 'Common', q: 'Why does React StrictMode render components twice?',
      say: "In development StrictMode renders twice and runs effects twice (mount, cleanup, mount) to expose impure renders and missing cleanups. It does nothing in production.",
      pts: ['A render must be pure: same inputs, same output, no side effects.', 'The extra mount, cleanup, mount cycle proves your effect cleans up properly.', 'If a double effect breaks your app, the effect needs a cleanup or an abort, not a StrictMode removal.', 'Do not fix it with a ref flag to run once. That hides the bug.'],
      code: `useEffect(() => {
  const ctrl = new AbortController();
  fetch(url, { signal: ctrl.signal });
  return () => ctrl.abort();      // survives StrictMode
}, [url]);`,
      trap: 'Removing StrictMode because a request fires twice in dev instead of adding cleanup.' },
    { id: 'r-c16', cat: 'Modern', lvl: 'Senior-ish', q: 'What is SSR and hydration, and what can go wrong?',
      say: "With server-side rendering the server sends ready HTML so the page shows fast. Hydration then attaches React to that HTML in the browser so it becomes interactive, and the client render must match the server HTML.",
      pts: ['CSR sends an empty shell plus JS. SSR sends HTML first, so it is faster to first paint and better for SEO.', 'A hydration mismatch happens when the first client render differs from the server HTML: Date.now(), Math.random(), window checks, locale formats.', 'Fix by rendering the same thing first and updating in an effect, or by suppressing the warning only for a known harmless node.', 'Frameworks such as Next.js handle routing, streaming and data loading for SSR.'],
      code: `const [mounted, setMounted] = useState(false);
useEffect(() => setMounted(true), []);
return mounted ? <ClientOnlyClock /> : null;   // same on server and first client render`,
      trap: 'Reading window, localStorage or the current time during render in a server-rendered component.' },
    { id: 'r-c17', cat: 'Modern', lvl: 'Senior-ish', q: 'What is new in React 19?',
      say: "React 19 adds Actions for async form handling, new hooks such as use, useOptimistic, useActionState and useFormStatus, ref as a plain prop, and stable Server Components.",
      pts: ['Actions: pass an async function to a form action and React tracks pending state and errors.', 'use(promise) and use(context) read a value during render, and work inside conditions.', 'useOptimistic shows the expected result immediately and reverts if the action fails.', 'ref is a prop in function components, so forwardRef is rarely needed.', 'Document metadata tags like title can be rendered from components, and Context can be used directly as a provider.'],
      code: `function Form() {
  const [error, submit, pending] = useActionState(async (_prev, formData) => {
    const res = await save(formData.get('name'));
    return res.ok ? null : 'Could not save';
  }, null);
  return <form action={submit}><input name="name" /><button disabled={pending}>Save</button>{error}</form>;
}`,
      trap: 'Claiming useEffect is dead. Effects are still the tool for syncing with external systems.' },
    { id: 'r-c18', cat: 'Core', lvl: 'Common', q: 'What is an error boundary and what does it not catch?',
      say: "An error boundary is a class component that catches errors thrown while rendering its children and shows a fallback UI instead of crashing the whole tree.",
      pts: ['It uses static getDerivedStateFromError and componentDidCatch.', 'It does not catch errors in event handlers, async code, timeouts or server rendering.', 'Event handler errors need try/catch. Async errors need catch or an error state.', 'The react-error-boundary library gives a hook-friendly version with reset support.', 'Place boundaries around independent sections so one widget failing does not blank the page.'],
      code: `class Boundary extends React.Component {
  state = { failed: false };
  static getDerivedStateFromError() { return { failed: true }; }
  componentDidCatch(err, info) { report(err, info); }
  render() { return this.state.failed ? <p>Something broke</p> : this.props.children; }
}`,
      trap: 'Expecting a boundary to catch a failed fetch inside useEffect. It will not.' }
  ],

  puzzles: [
    { id: 'r-p1', lvl: 'Easy', code: `// render(el) mounts a component, click(node) clicks it

      out: ['render 0', 'inside handler: 0', 'render 1', 'shows 1'],
      why: 'State is a snapshot. All three calls use n = 0, so each one asks for 1. React batches them into one re-render. The functional form setN((p) => p + 1) would give 3.' },
    { id: 'r-p2', lvl: 'Tricky', code: `function Child() {

      why: 'Render goes parent first, then children. Effects run children first, then the parent. On an update, all old cleanups run before any new effect, and they use the values of the render that created them (parent cleanup 0).' },
    { id: 'r-p3', lvl: 'Tricky', code: `// advance(n) fires the interval n times

advance(3);

    { id: 'r-p5', lvl: 'Tricky', code: `function App() {

    { id: 'r-p7', lvl: 'Tricky', code: `function Items() {

    { id: 'r-p8', lvl: 'Tricky', code: `const Child = memo(function Child({ label, style }) {

    { id: 'r-p9', lvl: 'Tricky', code: `function App() {

<title>JS in Motion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: lesson tree | isometric stage with stepper | explanation panel. Warm paper, thick ink outlines, chunky 3D blocks. */
:root {
  --paper: #f3eee2; --panel: #fbf8f0; --ink: #1d1b15; --muted: #6a6454; --line: #d9d0bb; --shadow: rgba(40, 30, 10, .16);
  --glow: rgba(255, 190, 40, .85); --btn: #bfe3a0; --idea: #e7defb; --know: #dcf0d2; --warn: #fbe0c4; --problem: #f9d2cf;

    --glow: rgba(255, 200, 70, .7); --btn: #3f5a2e; --idea: #2f2845; --know: #263a22; --warn: #4a3320; --problem: #4a2724; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15130e; --panel: #1e1b15; --ink: #f2ecda; --muted: #a79d86; --line: #3b3629; --shadow: rgba(0, 0, 0, .35);
  --glow: rgba(255, 200, 70, .7); --btn: #3f5a2e; --idea: #2f2845; --know: #263a22; --warn: #4a3320; --problem: #4a2724; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: clip; }
body { background: var(--paper); color: var(--ink); font: 14px/1.55 var(--body); padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 28px; }

:focus-visible { outline: 3px solid #6c8cff; outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 14px; padding: 12px 0; flex-wrap: wrap; }
.brand { font: 700 19px var(--disp); display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; }

.lv { margin-bottom: 4px; }

.dot:first-child::before { display: none; }
.dot.past::before, .dot.cur::before { background: var(--ink); }

.dot.past span.c { background: var(--btn); }
.dot.cur span.c { background: var(--btn); box-shadow: 0 0 0 4px color-mix(in srgb, var(--btn) 55%, transparent); }

.panel { position: sticky; top: 8px; display: grid; gap: 10px; }

.learn .bx { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; flex: none; margin-top: 2px; display: grid; place-items: center; font-size: 10px; }
.learn label.on .bx { background: var(--btn); border-color: var(--ink); }

.sidep { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; font: 500 11px var(--mono); }

@media (max-width: 1100px) {

  .panel { position: static; }
  .read { max-width: 100%; position: static; padding: 8px 10px 0; }
  .tools { position: static; padding: 8px 10px 0; }
  .pg .bar { display: none; }
}

  .sbtn { padding: 3px 8px; }
  .rd { min-width: 0; }
  .top { gap: 8px; }
  .brand { font-size: 17px; }
  .card h2 { font-size: 18px; }
  svg.scene { max-height: 56vh; }
  .stepper { padding: 8px 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
/* ===== 3D scene engine: isometric blocks in SVG ===== */
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === 'style') e.style.cssText = v; else e.setAttribute(k, v); }
  for (const c of kids.flat()) { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const OX = 450, OY = 262, TW = 44, TH = 22;
const rp = (x, y, z) => [(x - y) * TW, (x + y) * TH - z];
const slotXY = (p) => ({ x: p[0] + p[1], y: -p[0] + p[1] });
const PAL = { amber: [41, 92], orange: [22, 90], red: [4, 74], pink: [334, 70], purple: [262, 58], blue: [212, 78], teal: [176, 56], green: [140, 50], gray: [38, 10] };
let DARK = false;
const face = (c, w) => { const [h, s] = PAL[c] || PAL.gray; const L = DARK ? { t: 50, l: 40, r: 31 } : { t: 87, l: 77, r: 65 }; return `hsl(${h} ${DARK ? Math.round(s * .8) : s}% ${L[w]}%)`; };
const strokeOf = (c) => { const [h, s] = PAL[c] || PAL.gray; return `hsl(${h} ${s}% ${DARK ? 66 : 36}%)`; };
const poly = (pts, fill, cls) => sv('polygon', { points: pts.map(p => p.join(',')).join(' '), class: cls || 'face', style: fill ? `fill:${fill}` : '' });
function pill(t, s, y) {
  const w = Math.max(String(t).length * 7.5, s ? String(s).length * 6.2 : 0) + 20, h = s ? 38 : 25;
  const g = sv('g');
  g.append(sv('rect', { x: -w / 2, y: y - h / 2, width: w, height: h, rx: 9, class: 'pillbox' }));
  g.append(sv('text', { x: 0, y: y + (s ? -3 : 4.5), class: 'pt' }, t));
  if (s) g.append(sv('text', { x: 0, y: y + 11, class: 'ps' }, s));

}
function drawNode(n) {
  const g = sv('g'), lab = sv('g'), c = n.c || 'gray', k = n.k || 'cube';
  if (k === 'cube') {
    const w = n.w ?? 1, d = n.d ?? 1, h = n.h ?? 34, a = w / 2, b = d / 2;
    g.append(poly([rp(-a, -b, 0), rp(a, -b, 0), rp(a, b, 0), rp(-a, b, 0)].map(([x, y]) => [x + 8, y + 5]), null, 'shadow'));
    g.append(poly([rp(-a, b, h), rp(a, b, h), rp(a, b, 0), rp(-a, b, 0)], face(c, 'l')));
    g.append(poly([rp(a, -b, h), rp(a, b, h), rp(a, b, 0), rp(a, -b, 0)], face(c, 'r')));
    g.append(poly([rp(-a, -b, h), rp(a, -b, h), rp(a, b, h), rp(-a, b, h)], face(c, 't')));
    if (n.g) { const [gx, gy] = rp(0, 0, h); g.append(sv('text', { x: gx, y: gy + 4, class: 'glyph' }, n.g)); }
    if (n.t) lab.append(pill(n.t, n.s, rp(-a, -b, h)[1] - 22));
  } else if (k === 'hex') {
    const r = n.r ?? 40, h = n.h ?? 40, V = [], B = [];
    for (let i = 0; i < 6; i++) { const x = r * Math.cos(i * Math.PI / 3), y = r * .5 * Math.sin(i * Math.PI / 3); V.push([x, y - h]); B.push([x, y]); }
    g.append(poly(B.map(([x, y]) => [x + 8, y + 5]), null, 'shadow'));
    [['r', 0], ['l', 1], ['l', 2]].forEach(([w, i]) => g.append(poly([V[i], V[i + 1], B[i + 1], B[i]], face(c, w))));
    g.append(poly(V, face(c, 't')));
    if (n.g) g.append(sv('text', { x: 0, y: -h + 4, class: 'glyph' }, n.g));
    if (n.t) lab.append(pill(n.t, n.s, -h - r * .5 - 22));

    const r = n.r ?? 13;
    g.append(sv('ellipse', { cx: 5, cy: 3, rx: r, ry: r * .5, class: 'shadow' }));
    g.append(sv('circle', { cx: 0, cy: -r, r, class: 'face', style: `fill:${face(c, 'l')}` }));
    g.append(sv('circle', { cx: -r * .35, cy: -r * 1.35, r: r * .28, style: 'fill:#fff;opacity:.55' }));
    if (n.g) g.append(sv('text', { x: 0, y: -r + 4, class: 'glyph' }, n.g));
    if (n.t) lab.append(pill(n.t, n.s, -2 * r - 20));

    const w = n.w ?? 160, h = n.h ?? 30;
    g.append(sv('rect', { x: -w / 2 + 4, y: -h / 2 + 4, width: w, height: h, rx: 9, class: 'shadow' }));
    g.append(sv('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 9, class: 'face', style: `fill:${face(c, 't')}` }));
    g.append(sv('text', { x: 0, y: n.s ? -2 : 4.5, class: 'pt' }, n.t || ''));
    if (n.s) g.append(sv('text', { x: 0, y: 12, class: 'ps' }, n.s));

const anchorOf = (n) => { const k = n.k || 'cube'; if (k === 'cube') return (n.h ?? 34) / 2; if (k === 'hex') return (n.h ?? 40) / 2; if (k === 'orb') return n.r ?? 13; return 0; };
const semi = (n) => { const k = n.k || 'cube'; if (k === 'hex') return [n.r ?? 40, (n.r ?? 40) * .25 + (n.h ?? 40) / 2]; if (k === 'orb') return [(n.r ?? 13), (n.r ?? 13)]; if (k === 'bar') return [(n.w ?? 160) / 2, (n.h ?? 30) / 2]; if (k === 'tag') return [46, 16]; const w = n.w ?? 1, d = n.d ?? 1; return [(w + d) * 22, (w + d) * 11 + (n.h ?? 34) / 2]; };

const nodeXY = (n) => { const s = slotXY(n.p); const z = n.z || 0; return [OX + (s.x - s.y) * TW, OY + (s.x + s.y) * TH - z]; };

const Scene = (() => {
  let svg, eLayer, nLayer, lLayer, pLayer, L = null, els = {};
  function init(host) {
    svg = sv('svg', { viewBox: '-60 0 1020 520', class: 'scene', role: 'img', 'aria-label': 'Isometric 3D illustration of the lesson' });
    svg.append(sv('defs', {}, sv('pattern', { id: 'floor', width: 88, height: 44, patternUnits: 'userSpaceOnUse', x: OX - 44, y: OY - 22 }, sv('path', { d: 'M0 22L44 0L88 22L44 44Z', class: 'gridline' }))));
    svg.append(sv('rect', { x: -60, y: 0, width: 1020, height: 520, style: 'fill:url(#floor)' }));
    eLayer = sv('g'); nLayer = sv('g'); lLayer = sv('g');
    pLayer = sv('g'); svg.append(eLayer, nLayer, lLayer, pLayer); host.replaceChildren(svg);
  }
  function load(lesson) {
    L = lesson; els = {}; pLayer.replaceChildren(); nLayer.replaceChildren(); eLayer.replaceChildren(); lLayer.replaceChildren();
    const ids = Object.keys(L.nodes).sort((a, b) => { const A = L.nodes[a], B = L.nodes[b]; return (A.p[1] - B.p[1]) || ((A.z || 0) - (B.z || 0)) || (A.p[0] - B.p[0]); });
    ids.forEach(id => {
      const inner = sv('g', { class: 'in off' }), outer = sv('g', { class: 'n' }, inner);
      outer.style.transform = 'translate(450px,262px)';
      const linner = sv('g', { class: 'in off' }), louter = sv('g', { class: 'n' }, linner);
      louter.style.transform = 'translate(450px,262px)';
      nLayer.append(outer); pLayer.append(louter); els[id] = { outer, inner, louter, linner, key: '' };
    });
  }
  function layoutLabels(items, lbls) {
    const R = [];

  steps: [

/* ===== app runtime ===== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const rich = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
let done = new Set(); try { done = new Set(JSON.parse(store.get('jsm-done') || '[]')); } catch (e) { }
let cur = 0, stepI = 0, timer = null, playing = false, openLv = new Set([0]);

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
}
function stateAt(L, i) {
  const on = new Set(), over = {};
  for (let k = 0; k <= i; k++) {
    const s = L.steps[k];
    (s.add || []).forEach(n => on.add(n));
    (s.rm || []).forEach(n => on.delete(n));
    for (const n in (s.set || {})) over[n] = { ...(over[n] || {}), ...s.set[n] };
  }
  const s = L.steps[i];
  return { on, over, hi: s.hi || [], edges: s.e || [] };
}
function buildSide() {
  const side = $('side'); side.replaceChildren();
  LEVELS.forEach((lv, li) => {
    const items = LESSONS.map((l, idx) => [l, idx]).filter(([l]) => l.lvl === li);
    if (!items.length) return;
    const box = document.createElement('div'); box.className = 'lv' + (openLv.has(li) ? ' open' : '');
    const hd = document.createElement('button'); hd.className = 'lvh';
    const nd = items.filter(([l]) => done.has(l.id)).length;
    hd.innerHTML = `<span class="sq" style="background:${face(lv.c, 't')}"></span><span>${esc(lv.name)}</span><span class="n">${nd}/${items.length}</span>`;
    hd.onclick = () => { openLv.has(li) ? openLv.delete(li) : openLv.add(li); buildSide(); };
    const ls = document.createElement('div'); ls.className = 'ls';
    items.forEach(([l, idx]) => {
      const b = document.createElement('button'); b.className = 'li' + (idx === cur ? ' on' : '') + (done.has(l.id) ? ' done' : '');
      b.innerHTML = `<span class="ck"></span><span>${esc(l.title)}</span>`;
      b.onclick = () => { location.hash = l.id; $('side').classList.remove('show'); $('menuBtn').setAttribute('aria-expanded', 'false'); };
      ls.append(b);
    });
    box.append(hd, ls); side.append(box);
  });
  const p = document.createElement('div'); p.className = 'sidep';
  p.innerHTML = `<div class="row"><span>Lessons done</span><span>${done.size}/${LESSONS.length}</span></div>`;
  side.append(p);
  $('pg').innerHTML = `<span>${done.size}/${LESSONS.length} done</span><span class="bar"><i style="width:${Math.round(done.size / LESSONS.length * 100)}%"></i></span>`;
}
function renderHead() {
  const L = LESSONS[cur];
  $('crumb').textContent = `${LEVELS[L.lvl].name}  ·  Lesson ${cur + 1} of ${LESSONS.length}`;
  $('title').textContent = L.title; $('sub').textContent = L.sub;
  $('chips').innerHTML = `<span class="chip">${L.steps.length} steps</span><span class="chip">${L.min} min</span><span class="chip">${esc(L.diff)}</span>`;
  document.title = L.title + ' · JS in Motion';
}
function renderStepper() {
  const L = LESSONS[cur], n = L.steps.length;
  const h = document.createElement('h5'); h.innerHTML = `<span>Steps</span><span>${stepI + 1} / ${n}</span>`;
  const dots = document.createElement('div'); dots.className = 'dots';
  L.steps.forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'dot' + (i < stepI ? ' past' : '') + (i === stepI ? ' cur' : '');
    b.innerHTML = `<span class="c">${i + 1}</span><span class="l">${esc(s.short || '')}</span>`;
    b.onclick = () => go(i); dots.append(b);
  });
  $('stepper').replaceChildren(h, dots);
}
function renderPanel() {
  const L = LESSONS[cur], s = L.steps[stepI], n = L.steps.length, p = $('panel');
  const prevOn = stepI ? stateAt(L, stepI - 1).on : new Set(), now = stateAt(L, stepI).on;
  const label = (id) => { const nd = L.nodes[id]; return nd.t || nd.g || id; };
  const added = [...now].filter(x => !prevOn.has(x) && L.nodes[x].k !== 'tag' || false).map(x => '+ ' + label(x));
  const gone = [...prevOn].filter(x => !now.has(x) && L.nodes[x].k !== 'tag').map(x => '− ' + label(x));
  const chg = [...added, ...gone].slice(0, 5);
  const tagCls = s.tag.split(' ')[0];
  const learnN = L.learn.length, upto = Math.floor(((stepI + 1) / n) * learnN + (stepI === n - 1 ? 1 : 0));
  let html = `<div class="card"><div class="stephead"><span class="tag ${tagCls}">${esc(s.tag)}</span><span>Step ${stepI + 1} of ${n}</span></div><h2>${esc(s.title)}</h2>`;
  s.body.forEach(t => html += `<p>${rich(t)}</p>`);
  if (s.code) html += `<pre class="cd">${esc(s.code)}</pre>`;
  if (s.key) html += `<div class="kc ${s.key[0]}"><small>${{ idea: 'Key idea', know: 'Good to know', warn: 'Watch out' }[s.key[0]]}</small>${rich(s.key[1])}</div>`;
  if (chg.length) html += `<div class="chg"><small>What changed</small><ul>${chg.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`;
  html += `<div class="nav"><button class="nbtn" id="bk" ${stepI === 0 ? 'disabled' : ''}>Back</button><button class="nbtn go" id="nx"><span>${stepI === n - 1 ? (cur < LESSONS.length - 1 ? 'Next lesson' : 'Finish') : 'Next'}</span><span>&rarr;</span></button></div>`;
  html += `<div class="hint">Keys: &larr; &rarr; step, space plays, R replays</div></div>`;
  html += `<div class="card learn"><h4>You will learn</h4>${L.learn.map((t, i) => `<label class="${i < upto ? 'on' : ''}"><span class="bx"></span><span>${esc(t)}</span></label>`).join('')}</div>`;
  p.innerHTML = html;
  $('bk').onclick = () => go(stepI - 1); $('nx').onclick = next;
  const rd = $('read'); rd.replaceChildren();
  (s.read || []).forEach(([k, v]) => { const d = document.createElement('div'); d.className = 'rd'; d.innerHTML = `<small>${esc(k)}</small><b>${esc(v)}</b>`; rd.append(d); });
}
function paint() {
  const L = LESSONS[cur]; DARK = isDark();
  Scene.apply(stateAt(L, stepI));
  const st0 = stateAt(L, stepI);
  Scene.apply({ ...st0, over: st0.over, hi: st0.hi, edges: st0.edges });
  renderStepper(); renderPanel();
  if (stepI === L.steps.length - 1 && !done.has(L.id)) { done.add(L.id); store.set('jsm-done', JSON.stringify([...done])); buildSide(); }
}
function go(i) {
  const n = LESSONS[cur].steps.length;
  stepI = Math.max(0, Math.min(n - 1, i)); paint();
}
function next() {
  const n = LESSONS[cur].steps.length;
  if (stepI < n - 1) go(stepI + 1);
  else if (cur < LESSONS.length - 1) location.hash = LESSONS[cur + 1].id;
  else stop();
}
function stop() { playing = false; clearInterval(timer); $('play').textContent = 'Play'; }
function play() {
  if (playing) return stop();
  playing = true; $('play').textContent = 'Pause';
  timer = setInterval(() => { const n = LESSONS[cur].steps.length; if (stepI < n - 1) go(stepI + 1); else stop(); }, 3800);
}
function open(idx) {
  stop(); cur = idx; stepI = 0; openLv.add(LESSONS[idx].lvl);
  Scene.load(LESSONS[idx]); renderHead(); buildSide();
  DARK = isDark(); Scene.refresh(); paint();
  window.scrollTo(0, 0);
}
function route() {
  const id = (location.hash || '').slice(1);
  const idx = LESSONS.findIndex(l => l.id === id);
  open(idx < 0 ? 0 : idx);
}
$('replay').onclick = () => { stop(); go(0); play(); };
$('play').onclick = play;
$('menuBtn').onclick = () => { const s = $('side'); const sh = s.classList.toggle('show'); $('menuBtn').setAttribute('aria-expanded', String(sh)); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(stepI - 1); }
  else if (e.key === ' ' && !(e.target.tagName === 'BUTTON')) { e.preventDefault(); play(); }
  else if (e.key === 'r' || e.key === 'R') { stop(); go(0); play(); }
});
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { Scene.refresh(); paint(); });
Scene.init($('stageHost'));
window.addEventListener('hashchange', route);
route();
</script>

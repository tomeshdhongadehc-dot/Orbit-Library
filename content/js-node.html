    g3: { a: 'gw', b: 'pay', t: '/payments', pk: true }
  },
  steps: [
    st('PROBLEM', 'Should we split the app?', ['A monolith is one app with one deploy and one database. It is simple and fast to start. At very large scale or many teams it gets hard to change.', 'Microservices let teams ship separately, but every call between them is now a network call that can fail.'], { add: ['mono'], hi: ['mono'], read: [['calls between parts', 'in-process']], key: ['warn', 'Splitting too early is a classic mistake. Start with a well-structured monolith and split only when it hurts.'], short: 'The catch' }),
    st('CONCEPT', 'The price of splitting', ['Each service owns its own data and talks to others over the network. You gain independent deploys and scaling, and you pay with latency, partial failures, harder debugging and data that is no longer in one transaction.', 'Tracing, correlation ids and good logging stop being optional.'], { rm: ['mono'], add: ['orders', 'pay', 'net'], e: ['c1', 'n1'], hi: ['net'], key: ['idea', 'A distributed system trades one big failure mode for many small ones. Design for the failures.'], short: 'Trade-offs' }),
    st('TECHNIQUE', 'Always set a timeout', ['A call with no timeout can wait forever, tying up memory and connections until your service also falls over.', 'fetch supports AbortSignal.timeout(ms). On timeout it throws a TimeoutError you can handle.'], { rm: ['net'], add: ['slow', 'to'], e: ['c1', 's1', 't1'], hi: ['to'], code: N3("import http from 'node:http';", "", "const slow = http.createServer((req, res) => setTimeout(() => res.end('late'), 500));", "await new Promise((r) => slow.listen(0, r));", "const url = 'http://localhost:' + slow.address().port;", "", "try {", "  await fetch(url, { signal: AbortSignal.timeout(100) });", "} catch (err) {", "  console.log(err.name);", "}", "slow.close();"), key: ['warn', 'Pick a timeout shorter than your own caller\'s timeout. Otherwise they give up first.'], short: 'Timeouts' }),
    st('TECHNIQUE', 'A circuit breaker stops the pile-up', ['After several failures in a row, the breaker opens and fails fast without calling the broken service. After a cool-down it lets one trial call through.', 'That gives the failing service room to recover, and your callers get a fast error instead of a long wait.'], { rm: ['slow', 'to'], add: ['br'], e: ['b1', 'b2'], hi: ['br'], code: N3("export class Breaker {", "  constructor(fn, { failures = 3, coolMs = 1000, now = Date.now } = {}) {", "    Object.assign(this, { fn, failures, coolMs, now, count: 0, openedAt: 0 });", "  }", "  async call(...args) {", "    if (this.count >= this.failures && this.now() - this.openedAt < this.coolMs)", "      throw new Error('circuit open');", "    try { const r = await this.fn(...args); this.count = 0; return r; }", "    catch (e) { if (++this.count >= this.failures) this.openedAt = this.now(); throw e; }", "  }", "}", "", "let t = 0, up = false;", "const b = new Breaker(async () => { if (!up) throw new Error('down'); return 'ok'; }, { now: () => t });", "for (let i = 0; i < 4; i++) await b.call().catch((e) => console.log(e.message));", "t = 1000; up = true;", "console.log(await b.call());"), key: ['know', 'Retries and breakers work together. Retry a few times with backoff, and let the breaker stop the retries when a service is clearly down.'], short: 'Circuit breaker' }),
    st('TECHNIQUE', 'Events instead of direct calls', ['Not every step needs an answer right now. The orders service publishes order.created to a broker, and email and stock services each react in their own time.', 'The publisher does not know who listens, so a slow listener cannot hold it up. The cost is eventual consistency.'], { rm: ['br', 'pay'], add: ['bus', 'mail', 'stock'], e: ['e1', 'e2', 'e3'], hi: ['bus'], code: N3("import { EventEmitter } from 'node:events';", "", "const bus = new EventEmitter();   // stands in for RabbitMQ, Kafka or SQS", "bus.on('order.created', (o) => console.log('email service: receipt for', o.id));", "bus.on('order.created', (o) => console.log('stock service: reserve', o.id));", "bus.emit('order.created', { id: 7 });"), key: ['warn', 'Brokers deliver at least once. Listeners must be idempotent, as in the queues lesson.'], short: 'Events' }),
    st('TECHNIQUE', 'An API gateway is the front door', ['Clients call one URL. The gateway routes each path to the right service and can handle login, rate limiting and logging in one place.', 'Do not put business logic in it, or it becomes a new monolith.'], { rm: ['bus', 'mail', 'stock'], add: ['cl', 'gw', 'orders', 'pay'], e: ['g1', 'g2', 'g3'], hi: ['gw'], code: N3("const routes = { '/orders': 'http://orders:3001', '/users': 'http://users:3002' };", "const upstream = (path) =>", "  Object.entries(routes).find(([p]) => path.startsWith(p))?.[1];", "", "console.log(upstream('/orders/5'), upstream('/nope'));"), key: ['tip', 'A backend-for-frontend is a gateway built per client type, such as one for mobile and one for web.'], short: 'Gateway' }),
    st('RECAP', 'What to remember', ['Start with a monolith. Split when the cost of one deploy is greater than the cost of the network.', 'Time out every call, add a circuit breaker, prefer events where an instant answer is not needed, and keep a thin gateway in front.'], { hi: [], short: 'Recap' })
  ]
});

const TAGN = { PROBLEM: 'THE CATCH', CONCEPT: 'IDEA', TECHNIQUE: 'HOW IT WORKS', WATCH: 'CAREFUL', RECAP: 'WRAP-UP' };

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
}
function stateAt(L, i) {
  const on = new Set(), over = {};
  for (let k = 0; k <= i; k++) {
    const s = L.steps[k];
    (s.add || []).forEach(n => on.add(n));
    (s.rm || []).forEach(n => on.delete(n));
    for (const n in (s.set || {})) over[n] = { ...(over[n] || {}), ...s.set[n] };
  }
  const s = L.steps[i];
  return { on, over, hi: s.hi || [], edges: s.e || [] };
}
function buildSide() {
  const side = $('side'), keep = side.scrollTop; side.replaceChildren();

    const mb = document.createElement('span'); mb.className = 'mb'; mb.innerHTML = `<i style="width:${Math.round(nd / items.length * 100)}%;background:${col}"></i>`;
    g.append(h, mb);

        const bt = document.createElement('button'); bt.className = 'si' + (idx === cur ? ' on' : '') + (done.has(l.id) ? ' done' : '');
        if (idx === cur) bt.setAttribute('aria-current', 'page');
        bt.innerHTML = `<span>${esc(l.title)}</span><em></em>`;
        bt.onclick = () => { location.hash = l.id; closeMap(); };
        ls.append(bt);

      g.append(ls);

  });
  side.scrollTop = keep;
  const on = side.querySelector('.si.on');
  if (on && (on.offsetTop < side.scrollTop || on.offsetTop + on.offsetHeight > side.scrollTop + side.clientHeight)) side.scrollTop = Math.max(0, on.offsetTop - side.clientHeight / 2);
  $('pg').innerHTML = `<span>${done.size}/${LESSONS.length} done</span><span class="bar"><i style="width:${Math.round(done.size / LESSONS.length * 100)}%"></i></span>`;
}
function closeMap() { $('side').classList.remove('show'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
function renderHead() {
  const L = LESSONS[cur];
  $('crumb').textContent = `${LEVELS[L.lvl].name}  ·  Lesson ${cur + 1} of ${LESSONS.length}`;
  $('title').textContent = L.title; $('sub').textContent = L.sub;
  $('chips').innerHTML = `<span class="chip">${L.steps.length} steps</span><span class="chip">${L.min} min</span><span class="chip">${esc(L.diff)}</span>`;

}
function renderStepper() {
  const L = LESSONS[cur], n = L.steps.length;
  const h = document.createElement('h5'); h.innerHTML = `<span>Steps</span><span>${stepI + 1} / ${n}</span>`;
  const dots = document.createElement('div'); dots.className = 'dots';
  L.steps.forEach((s, i) => {

function renderPanel() {
  const L = LESSONS[cur], s = L.steps[stepI], n = L.steps.length, p = $('panel');
  const prevOn = stepI ? stateAt(L, stepI - 1).on : new Set(), now = stateAt(L, stepI).on;
  const label = (id) => { const nd = L.nodes[id]; return nd.t || nd.g || id; };
  const added = [...now].filter(x => !prevOn.has(x) && L.nodes[x].k !== 'tag' || false).map(x => '+ ' + label(x));
  const gone = [...prevOn].filter(x => !now.has(x) && L.nodes[x].k !== 'tag').map(x => '− ' + label(x));
  const chg = [...added, ...gone].slice(0, 5);
  const tagCls = s.tag.split(' ')[0];
  const learnN = L.learn.length, upto = Math.floor(((stepI + 1) / n) * learnN + (stepI === n - 1 ? 1 : 0));

function paint() {
  const L = LESSONS[cur]; DARK = isDark();

  const st0 = stateAt(L, stepI);
  Scene.apply({ ...st0, over: st0.over, hi: st0.hi, edges: st0.edges });
  renderStepper(); renderPanel();
  if (stepI === L.steps.length - 1 && !done.has(L.id)) { done.add(L.id); store.set('jsm-done', JSON.stringify([...done])); buildSide(); }
}
function go(i) {
  const n = LESSONS[cur].steps.length;
  stepI = Math.max(0, Math.min(n - 1, i)); paint();
}
function next() {
  const n = LESSONS[cur].steps.length;
  if (stepI < n - 1) go(stepI + 1);
  else if (cur < LESSONS.length - 1) location.hash = LESSONS[cur + 1].id;

}
function stop() { playing = false; clearInterval(timer); $('play').textContent = 'Play'; }
function play() {
  if (playing) return stop();
  playing = true; $('play').textContent = 'Pause';
  timer = setInterval(() => { const n = LESSONS[cur].steps.length; if (stepI < n - 1) go(stepI + 1); else stop(); }, 3800);
}
function open(idx) {
  stop(); cur = idx; stepI = 0; openLv.add(LESSONS[idx].lvl);
  Scene.load(LESSONS[idx]); renderHead(); buildSide();
  DARK = isDark(); Scene.refresh(); paint();
  window.scrollTo(0, 0);
}
function route() {
  const hsh = (location.hash || '').slice(1);
  const isIv = hsh.startsWith('interview'), isRv = hsh.startsWith('revise');
  document.querySelector('.app').hidden = isIv || isRv; $('iv').hidden = !isIv; $('rv').hidden = !isRv;
  $('mLess').classList.toggle('on', !isIv && !isRv); $('mIv').classList.toggle('on', isIv); $('mRv').classList.toggle('on', isRv);
  $('menuBtn').hidden = isIv || isRv; closeMap();
  if (isIv) { stop(); document.title = 'Interview Lab · Node Orbit'; renderIv(hsh.split('/')[1] || ivState.tab); window.scrollTo(0, 0); return; }
  if (isRv) { stop(); document.title = 'Revise · Node Orbit'; renderRv(hsh.split('/')[1] || rvState.tab); window.scrollTo(0, 0); return; }
  const idx = LESSONS.findIndex(l => l.id === hsh);
  open(idx < 0 ? 0 : idx);
}
$('replay').onclick = () => { stop(); go(0); play(); };
$('play').onclick = play;
$('menuBtn').onclick = () => { const s = $('side'); const sh = s.classList.toggle('show'); $('menuBtn').setAttribute('aria-expanded', String(sh)); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMap(); });
document.addEventListener('keydown', (e) => {
  if (!$('iv').hidden || !$('rv').hidden) return;

/* ===== Recap quiz: 3 rounds (5, 7, 9 questions), each unlocks after 60% ===== */
const QUIZ = {};
const QR = [{ n: 5, name: 'Easy' }, { n: 7, name: 'Medium' }, { n: 9, name: 'Hard' }];
const qPass = (n) => Math.ceil(n * 0.6);
let qBest = {}; try { qBest = JSON.parse(store.get('orbit-quiz') || '{}'); } catch (e) { }
const qSave = () => store.set('orbit-quiz', JSON.stringify(qBest));
const QZ = {};
function qShuf(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function qRich(s) { return String(s).split('`').map((t, i) => i % 2 ? E('code', {}, t) : t); }
function qUnlocked(id, r) { if (r === 0) return true; const b = qBest[id] || []; return (b[r - 1] || 0) >= qPass(QR[r - 1].n); }
function qStart(id, r) { const qs = QUIZ[id][r]; QZ[id] = { r, i: 0, pick: -1, score: 0, fin: false, res: [], ord: qs.map(q => qShuf(q.o.map((_, k) => k))) }; }
function quizCard(L) {
  const data = QUIZ[L.id]; if (!data) return null;
  const card = E('div', { class: 'card quiz' });
  card.addEventListener('keydown', (e) => e.stopPropagation());
  const draw = () => {
    card.replaceChildren();
    const S = QZ[L.id], best = qBest[L.id] || [];
    card.append(E('div', { class: 'qhead' }, E('h4', {}, 'Quick check'), E('span', { class: 'qsub' }, 'Pass a round (60%) to unlock the next')));
    card.append(E('div', { class: 'qrounds' }, QR.map((R, r) => {
      const un = qUnlocked(L.id, r), b = best[r];
      return E('button', { class: 'qr' + (S && S.r === r ? ' on' : '') + (un ? '' : ' lock'), disabled: !un, onclick: () => { qStart(L.id, r); draw(); } },
        E('span', {}, R.name), E('small', {}, R.n + ' questions'), E('em', {}, un ? (b != null ? 'best ' + b + '/' + R.n : 'not tried') : 'locked'));
    })));
    if (!S) { card.append(E('p', { class: 'qintro' }, 'Five easy questions first, then seven, then nine harder ones.'), E('button', { class: 'nbtn go qgo', onclick: () => { qStart(L.id, 0); draw(); } }, E('span', {}, 'Start round 1'), E('span', {}, '→'))); return; }
    const R = QR[S.r], qs = data[S.r];
    card.append(E('div', { class: 'qbar' }, qs.map((_, k) => E('i', { class: k < S.res.length ? (S.res[k] ? 'ok' : 'no') : (k === S.i && !S.fin ? 'cur' : '') }))));
    if (S.fin) {
      const pass = S.score >= qPass(R.n), last = S.r === QR.length - 1;
      card.append(E('div', { class: 'qres' }, E('b', {}, S.score + ' / ' + R.n),
        E('p', {}, pass ? (last ? 'Hard round cleared. You know this lesson well.' : 'Round passed. The next one is harder.') : 'You need ' + qPass(R.n) + ' correct to unlock the next round. Review the steps and try again.')));
      const row = E('div', { class: 'nav' });
      if (pass && !last) row.append(E('button', { class: 'nbtn go', onclick: () => { qStart(L.id, S.r + 1); draw(); } }, E('span', {}, 'Start ' + QR[S.r + 1].name + ' round (' + QR[S.r + 1].n + ')'), E('span', {}, '→')));
      row.append(E('button', { class: 'nbtn', onclick: () => { qStart(L.id, S.r); draw(); } }, 'Try again'));
      if (!pass) row.append(E('button', { class: 'nbtn', onclick: () => go(0) }, 'Review steps'));
      card.append(row); return;
    }
    const q = qs[S.i], ord = S.ord[S.i];
    card.append(E('div', { class: 'qmeta' }, E('span', { class: 'qlv l' + S.r }, R.name), E('span', {}, 'Question ' + (S.i + 1) + ' of ' + R.n)));
    card.append(E('p', { class: 'qq' }, qRich(q.q)));
    if (q.code) card.append(E('pre', { class: 'cd' }, q.code));
    ord.forEach((k, p) => {
      const cls = 'qo' + (S.pick >= 0 ? (k === q.a ? ' ok' : (k === S.pick ? ' bad' : '')) : '');
      card.append(E('button', { class: cls, disabled: S.pick >= 0, onclick: () => {
        S.pick = k; const right = k === q.a; if (right) S.score++; S.res.push(right); draw();
      } }, E('b', {}, String.fromCharCode(65 + p)), E('span', {}, qRich(q.o[k]))));
    });
    if (S.pick >= 0) {
      const right = S.pick === q.a, lastQ = S.i === qs.length - 1;
      card.append(E('div', { class: 'kc ' + (right ? 'know' : 'warn') }, E('small', {}, right ? 'Correct' : 'Not quite'), qRich(q.w)));
      card.append(E('button', { class: 'nbtn go qgo', onclick: () => {
        if (lastQ) {
          S.fin = true; const bb = qBest[L.id] || (qBest[L.id] = []);
          if (bb[S.r] == null || S.score > bb[S.r]) bb[S.r] = S.score; qSave();
        } else { S.i++; S.pick = -1; }
        draw();
      } }, E('span', {}, lastQ ? 'See result' : 'Next question'), E('span', {}, '→')));
    }
  };
  draw(); return card;
}

const IV = {
  concepts: [
    {"id":"n-c1","cat":"Runtime","lvl":"Must know","q":"Explain the Node.js event loop and its phases.","say":"Node runs your JavaScript on one thread. The event loop picks up finished work in a fixed cycle of phases, so slow I/O never blocks other requests.","pts":["Phases in order: timers, pending callbacks, idle/prepare, poll (I/O), check (setImmediate), close callbacks.","Timers run setTimeout and setInterval callbacks that are due.","Poll waits for and runs I/O callbacks. If nothing is queued it may wait here.","Check runs setImmediate callbacks right after poll.","Between callbacks Node drains the nextTick queue and then promise microtasks.","File system, DNS lookup, crypto and zlib work runs on libuv's thread pool, not on your JS thread."],"code":"const fs = require('fs');\nfs.readFile(__filename, () => {\n  setTimeout(() => console.log('timeout'), 0);\n  setImmediate(() => console.log('immediate'));\n});\n// inside an I/O callback, immediate always prints first","trap":"Saying Node is multi-threaded because of the thread pool. Your JavaScript runs on one thread. The pool only does the native I/O work."},
    {"id":"n-c2","cat":"Runtime","lvl":"Must know","q":"What is the difference between process.nextTick, promise microtasks and setImmediate?","say":"nextTick runs first, right after the current operation. Promise callbacks run next. setImmediate waits for the check phase of the loop.","pts":["process.nextTick: its own queue, drained before promise microtasks.","Promise .then and await continuations: the microtask queue.","setImmediate: runs in the check phase, after the poll phase.","setTimeout(fn, 0): runs in a later timers phase, never earlier than the delay.","Calling nextTick recursively can starve the event loop, because the loop never gets to move on."],"code":"setImmediate(() => console.log('immediate'));\nPromise.resolve().then(() => console.log('promise'));\nprocess.nextTick(() => console.log('tick'));\nconsole.log('sync');\n// sync, tick, promise, immediate","trap":"Believing setImmediate is the fastest way to defer work. nextTick and microtasks always run before it."},
    {"id":"n-c3","cat":"Runtime","lvl":"Must know","q":"What does blocking the event loop mean, and how do you avoid it?","say":"While one piece of JavaScript is running, nothing else on that thread can run. A slow synchronous task freezes every request.","pts":["Typical blockers: readFileSync in a request, a huge JSON.parse, a heavy loop, pbkdf2Sync, a badly written regex.","Symptom: all requests slow down together, and the event loop lag goes up.","Use the async version of each API so the work goes to the OS or the thread pool.","Move CPU work to worker_threads or a separate service.","Split a long loop into chunks and yield with setImmediate."],"code":"// blocks every other request for the whole loop\napp.get('/slow', (req, res) => {\n  let n = 0;\n  for (let i = 0; i < 1e9; i++) n += i;\n  res.json({ n });\n});","trap":"Wrapping CPU work in an async function or a promise. It still runs on the same thread and still blocks."},
    {"id":"n-c4","cat":"Modules","lvl":"Must know","q":"CommonJS versus ES modules in Node: what are the differences?","say":"CommonJS uses require and loads files synchronously. ES modules use import, load asynchronously and have static structure, which allows top-level await.","pts":["CommonJS: require, module.exports, __dirname and __filename exist.","ESM: import and export, enabled by .mjs files or \"type\": \"module\" in package.json.","ESM imports are static and hoisted, and give live bindings. require copies whatever was on module.exports.","ESM has top-level await, and no __dirname. Use import.meta.url or import.meta.dirname in newer versions.","ESM can import CommonJS easily. Using require on an ES module only works in recent Node versions.","ESM is always in strict mode."],"code":"// ESM\nimport { readFile } from 'node:fs/promises';\nimport { fileURLToPath } from 'node:url';\nconst here = fileURLToPath(import.meta.url);\nconst text = await readFile(here, 'utf8');","trap":"Mixing the two and expecting require to work inside an .mjs file. In ESM there is no require unless you create it with createRequire."},
    {"id":"n-c5","cat":"Modules","lvl":"Common","q":"What is the require cache? What happens with circular dependencies?","say":"The first require of a file runs it and stores module.exports under its resolved path. Later requires return the same object without running the file again.","pts":["The cache is require.cache, keyed by the resolved filename.","That is why a module works as a singleton: a shared database client or config object.","Deleting an entry from require.cache forces a reload. Rarely needed outside tests.","Circular dependencies: the second file gets the partial exports of the first, as they stand at that moment.","Fix cycles by moving shared code to a third module, or by requiring inside the function."],"code":"const a = require('os');\nconst b = require('node:os');\nconsole.log(a === b);   // true, same cached object\nconsole.log(require.cache[__filename] === module);  // true","trap":"Assigning to exports after replacing module.exports. exports is only a shortcut to the original object."},
    {"id":"n-c6","cat":"Streams","lvl":"Must know","q":"What are streams, and what is backpressure?","say":"A stream moves data in small chunks instead of loading it all in memory. Backpressure is the signal that the destination is slower than the source and the source should pause.","pts":["Four kinds: Readable, Writable, Duplex and Transform.","writable.write() returns false when its internal buffer is above the highWaterMark.","When that happens, stop writing and wait for the 'drain' event.","readable.pipe and stream.pipeline do this for you.","pipeline also forwards errors and destroys every stream on failure. pipe does not.","Use streams for large files, uploads, downloads and compression."],"code":"const { pipeline } = require('stream/promises');\nconst fs = require('fs');\nconst zlib = require('zlib');\nawait pipeline(\n  fs.createReadStream('big.log'),\n  zlib.createGzip(),\n  fs.createWriteStream('big.log.gz')\n);","trap":"Using readable.pipe(writable) in production and forgetting that errors are not forwarded. Streams stay open and leak."},
    {"id":"n-c7","cat":"Streams","lvl":"Common","q":"What is a Buffer, and what is the difference between alloc and allocUnsafe?","say":"A Buffer is a fixed-size block of raw bytes, stored outside the normal JavaScript heap. It is how Node handles binary data such as files, sockets and images.","pts":["Buffer is a subclass of Uint8Array.","Buffer.from(string, encoding) and buf.toString(encoding) convert text, for example utf8, hex and base64.","Buffer.alloc(n) returns zero-filled memory. Buffer.allocUnsafe(n) is faster but may contain old data.","Always fill allocUnsafe memory before sending it, to avoid leaking old data.","Multi-byte characters can be split across chunks. Use StringDecoder or set an encoding on the stream."],"code":"const buf = Buffer.from('héllo', 'utf8');\nconsole.log(buf.length);          // 6, not 5\nconsole.log(buf.toString('hex'));\nconst safe = Buffer.alloc(4);       // zero-filled","trap":"Treating buf.length as the number of characters. It is the number of bytes."},
    {"id":"n-c8","cat":"Runtime","lvl":"Common","q":"How does EventEmitter work? What happens if you emit 'error' with no listener?","say":"An EventEmitter keeps a list of listener functions for each event name. emit calls them synchronously, in the order they were added.","pts":["on adds a listener, once removes it after the first call, off removes it.","emit is synchronous. Listeners finish before emit returns.","If you emit 'error' and nobody listens, Node throws the error and the process can crash.","More than 10 listeners for one event prints a possible memory leak warning.","Forgetting to remove listeners on long-lived emitters is a classic leak."],"code":"const EventEmitter = require('events');\nconst bus = new EventEmitter();\nbus.on('job', (id) => console.log('start', id));\nbus.once('job', (id) => console.log('first only', id));\nbus.emit('job', 1);\nbus.emit('job', 2);","trap":"Assuming emit is asynchronous. It runs every listener before the next line of your code."},
    {"id":"n-c9","cat":"Scale","lvl":"Must know","q":"cluster, worker_threads and child_process: when do you use each?","say":"cluster runs copies of the same server on many CPU cores. worker_threads runs CPU-heavy JavaScript in the background. child_process starts a separate program.","pts":["cluster: forks several processes that share one server port. Good for using all cores for HTTP.","worker_threads: threads inside one process with their own event loop. Good for CPU-bound work. Can share memory with SharedArrayBuffer.","child_process: spawn, exec or fork another process, such as ffmpeg or a shell script.","Processes have separate memory, so in-memory state is not shared between cluster workers.","In containers, many teams run one process per container and scale with the orchestrator instead of cluster."],"code":"const { Worker, isMainThread, parentPort } = require('worker_threads');\nif (isMainThread) {\n  const w = new Worker(__filename);\n  w.on('message', (m) => console.log('result', m));\n} else {\n  let sum = 0; for (let i = 0; i < 1e7; i++) sum += i;\n  parentPort.postMessage(sum);\n}","trap":"Using worker_threads to scale I/O-bound work. Async I/O already runs concurrently without extra threads."},
    {"id":"n-c10","cat":"Web","lvl":"Must know","q":"How does Express middleware work? Why does order matter, and how does error middleware work?","say":"Middleware are functions that run in the order you register them. Each one can end the response or call next() to pass on to the following one.","pts":["A middleware has (req, res, next). Skipping next() and not responding makes the request hang.","app.use(fn) runs for every request. Routes run only when the path and method match.","Register body parsers, auth and logging before the routes that need them.","Error middleware has four arguments (err, req, res, next) and is registered after the routes.","next(err) skips ordinary middleware and jumps to the next error handler.","Express 5 forwards a rejected promise from an async handler to the error handler. Express 4 does not, so wrap handlers or catch yourself."],"code":"app.use(express.json());\napp.get('/user/:id', async (req, res, next) => {\n  try {\n    res.json(await db.find(req.params.id));\n  } catch (err) { next(err); }\n});\napp.use((err, req, res, next) => {\n  res.status(500).json({ error: 'Server error' });\n});","trap":"Putting the error handler before the routes. It never receives their errors."},
    {"id":"n-c11","cat":"Security","lvl":"Must know","q":"JWT versus server-side sessions: how do you choose?","say":"A session keeps the login state on the server and gives the browser an id. A JWT puts signed claims in the token, so the server does not need to store anything.","pts":["Sessions: easy to revoke, small cookie, needs a shared store such as Redis when you run many servers.","JWT: stateless and easy across services, but hard to revoke before it expires.","A JWT is signed, not encrypted. Anyone can read the payload, so never put secrets in it.","Keep access tokens short-lived and use a refresh token.","Always verify with a fixed algorithm list, and check expiry and audience.","In a browser, an httpOnly secure cookie is safer than localStorage for tokens."],"code":"const jwt = require('jsonwebtoken');\nconst token = jwt.sign({ sub: 'u1' }, process.env.JWT_SECRET, { expiresIn: '15m' });\nconst claims = jwt.verify(token, process.env.JWT_SECRET, { algorithms: ['HS256'] });","trap":"Saying JWTs are always better because they scale. Logout and revocation become your problem."},
    {"id":"n-c12","cat":"Security","lvl":"Common","q":"What is CORS, and what is a preflight request?","say":"CORS is a browser rule that blocks a page from reading responses from another origin unless that server allows it with headers.","pts":["An origin is scheme, host and port. A different port is a different origin.","The server allows an origin with Access-Control-Allow-Origin.","For non-simple requests, such as PUT, DELETE or custom headers, the browser first sends an OPTIONS preflight.","With cookies, you must name the exact origin, not *, and send Allow-Credentials.","CORS protects users in browsers. It does not protect your API from curl or other servers."],"code":"const cors = require('cors');\napp.use(cors({\n  origin: 'https://app.example.com',\n  credentials: true,\n  methods: ['GET', 'POST', 'PUT', 'DELETE']\n}));","trap":"Setting origin to * everywhere to make the error go away, and calling that security."},
    {"id":"n-c13","cat":"Security","lvl":"Must know","q":"How should you store passwords?","say":"Never store the password. Store a slow, salted hash made with bcrypt, scrypt or argon2, and compare hashes on login.","pts":["A fast hash like SHA-256 lets attackers guess billions of passwords per second.","bcrypt, scrypt and argon2 are slow on purpose and have a cost setting you can raise over time.","A salt is random data stored with each hash, so equal passwords get different hashes.","Node has crypto.scrypt built in. bcrypt and argon2 are packages.","Compare secrets with crypto.timingSafeEqual, or the library's compare function.","Run hashing asynchronously, so it does not block the event loop."],"code":"const bcrypt = require('bcryptjs');\nconst hash = await bcrypt.hash(password, 12);\nconst ok = await bcrypt.compare(password, hash);","trap":"Encrypting passwords instead of hashing them. Encryption can be reversed with the key."},
    {"id":"n-c14","cat":"Data","lvl":"Common","q":"What is connection pooling, and what goes wrong without it?","say":"A pool keeps a limited set of open database connections and lends them out. It saves the cost of connecting for every request and protects the database from too many connections.","pts":["Opening a connection is slow. A pool reuses connections.","Always release the connection, in a finally block.","A pool has a maximum size. Extra requests wait in a queue.","A bigger pool is not always faster. It can overload the database.","Leaked connections lead to timeouts and a pool that looks full while traffic is low."],"code":"const { Pool } = require('pg');\nconst pool = new Pool({ max: 10 });\nconst client = await pool.connect();\ntry {\n  await client.query('BEGIN');\n  // ... queries\n  await client.query('COMMIT');\n} finally {\n  client.release();\n}","trap":"Creating a new client inside every request handler. That leaks connections under load."},
    {"id":"n-c15","cat":"Runtime","lvl":"Must know","q":"Unhandled rejections versus uncaught exceptions: what happens and what should you do?","say":"Both mean an error nobody handled. In current Node versions both end the process by default. After one, your program's state cannot be trusted.","pts":["uncaughtException: a thrown error that no try/catch caught.","unhandledRejection: a rejected promise with no catch. Since Node 15 the default is to throw.","You can listen for both to log the error and flush logs.","Then exit and let a supervisor such as systemd, Docker or Kubernetes restart the process.","Do not carry on running as if nothing happened."],"code":"process.on('unhandledRejection', (reason) => {\n  console.error('unhandled', reason);\n  process.exit(1);\n});\nprocess.on('uncaughtException', (err) => {\n  console.error('uncaught', err);\n  process.exit(1);\n});","trap":"Using uncaughtException as a global try/catch to keep the server alive."},
    {"id":"n-c16","cat":"Ops","lvl":"Common","q":"How do you shut down a Node server gracefully?","say":"On SIGTERM, stop accepting new connections, let current requests finish, close the database, then exit. Add a timer so a stuck request cannot keep it alive forever.","pts":["Orchestrators send SIGTERM first and SIGKILL after a grace period.","server.close() stops new connections and waits for the open ones.","Idle keep-alive connections can hold close() open. Use server.closeIdleConnections() in newer versions.","Close pools and queues after the server is drained.","Fail the readiness check first so the load balancer stops sending traffic."],"code":"process.on('SIGTERM', () => {\n  server.close(async () => {\n    await pool.end();\n    process.exit(0);\n  });\n  setTimeout(() => process.exit(1), 10000).unref();\n});","trap":"Calling process.exit() immediately on SIGTERM. In-flight requests are cut off."},
    {"id":"n-c17","cat":"Ops","lvl":"Senior-ish","q":"How do you find and fix a memory leak in a Node service?","say":"Watch heap usage over time. If it keeps climbing after garbage collection, take heap snapshots at two moments and compare what grew.","pts":["Common causes: unbounded in-memory caches or arrays, listeners never removed, timers never cleared, closures holding large objects.","Check process.memoryUsage().heapUsed and the trend in your metrics.","Run with --inspect and take heap snapshots in Chrome DevTools. Compare two snapshots.","Fix with limits: an LRU cache, WeakMap, removing listeners, clearing timers.","--max-old-space-size raises the limit. It only delays a leak, it does not fix it."],"code":"// run with: node --inspect server.js, then open chrome://inspect\nsetInterval(() => {\n  const m = process.memoryUsage();\n  console.log('heapUsed MB', Math.round(m.heapUsed / 1048576));\n}, 5000).unref();","trap":"Restarting the service on a schedule and calling the leak solved."},
    {"id":"n-c18","cat":"Ops","lvl":"Common","q":"How should you handle configuration and secrets (the twelve-factor approach)?","say":"Keep config in environment variables, separate from the code. The same build runs in every environment, and only the variables change.","pts":["Never commit secrets. Use a secret manager or the platform's secret store.","Read process.env once at startup and validate it. Fail fast if something is missing.","Environment variables are strings. Convert numbers and booleans yourself.","A .env file is for local development only. Node 20.6+ can load one with --env-file.","Give each environment its own values, not different code branches."],"code":"function loadConfig(env = process.env) {\n  const port = Number(env.PORT ?? 3000);\n  if (!env.DATABASE_URL) throw new Error('DATABASE_URL is required');\n  return { port, dbUrl: env.DATABASE_URL, debug: env.DEBUG === 'true' };\n}","trap":"Treating process.env.DEBUG as a boolean. The string 'false' is truthy."}

  puzzles: [
    {"id":"n-p1","lvl":"Easy","code":"Promise.resolve().then(() => console.log('promise'));\nprocess.nextTick(() => console.log('tick'));\nconsole.log('sync');","out":["sync","tick","promise"],"why":"Synchronous code first. Then the nextTick queue, which Node drains before promise microtasks. Then the promise callback."},
    {"id":"n-p2","lvl":"Easy","code":"const fs = require('fs');\nfs.readFile(__filename, () => {\n  setTimeout(() => console.log('timeout'), 0);\n  setImmediate(() => console.log('immediate'));\n});","out":["immediate","timeout"],"why":"This runs inside an I/O callback, which is the poll phase. The check phase (setImmediate) comes next, and the timers phase only comes round on the next loop turn. Inside I/O callbacks the order is always fixed."},
    {"id":"n-p3","lvl":"Easy","code":"setTimeout(() => console.log('B'), 10);\nsetTimeout(() => console.log('A'), 5);\nsetTimeout(() => console.log('C'), 5);","out":["A","C","B"],"why":"Timers run in order of their due time. A and C have the same delay, so they run in the order they were created. B waits longest."},
    {"id":"n-p4","lvl":"Tricky","code":"Promise.resolve()\n  .then(() => {\n    console.log('p1');\n    process.nextTick(() => console.log('tick inside promise'));\n  })\n  .then(() => console.log('p2'));\nprocess.nextTick(() => console.log('tick'));","out":["tick","p1","p2","tick inside promise"],"why":"The first tick runs before any promise callback. Once the promise queue starts draining, V8 keeps going until it is empty, so p2 runs before the tick that was queued from inside p1."},
    {"id":"n-p5","lvl":"Tricky","code":"async function f() {\n  console.log('f1');\n  await null;\n  console.log('f2');\n}\nprocess.nextTick(() => console.log('tick'));\nf();\nconsole.log('main');","out":["f1","main","tick","f2"],"why":"f runs synchronously up to its first await, so f1 prints, then main. When the main script ends, the nextTick queue runs first, and the code after await is a promise microtask that runs after it."},
    {"id":"n-p6","lvl":"Easy","code":"const EventEmitter = require('events');\nconst e = new EventEmitter();\ne.on('x', () => console.log('a'));\nconsole.log('before');\ne.emit('x');\ne.on('x', () => console.log('b'));\ne.emit('x');\nconsole.log('after');","out":["before","a","a","b","after"],"why":"emit is synchronous and only calls the listeners that exist at that moment. The first emit only reaches a. The second reaches a and b."},
    {"id":"n-p7","lvl":"Tricky","code":"const EventEmitter = require('events');\nconst e = new EventEmitter();\ne.on('x', () => console.log('A'));\ne.prependListener('x', () => console.log('B'));\ne.once('x', () => console.log('C'));\ne.emit('x');\ne.emit('x');","out":["B","A","C","B","A"],"why":"prependListener puts B first, so the order is B, A, C. The once listener removes itself after the first emit, so the second emit prints only B and A."},
    {"id":"n-p8","lvl":"Easy","code":"exports.a = 1;\nmodule.exports = { b: 2 };\nexports.c = 3;\nconsole.log(module.exports);\nconsole.log(exports);","out":["{ b: 2 }","{ a: 1, c: 3 }"],"why":"exports starts as a shortcut to module.exports. Assigning a new object to module.exports breaks that link. Later changes to exports go to the old object, which require never sees."},
    {"id":"n-p9","lvl":"Tricky","code":"console.log(require.cache[__filename] === module);\nconsole.log(module.loaded);\nsetImmediate(() => console.log(module.loaded));","out":["true","false","true"],"why":"A module is put in the require cache before its code runs, so the first line is true. module.loaded only becomes true after the file finishes running, so it is false now and true in a later callback."},
    {"id":"n-p10","lvl":"Tricky","code":"process.on('unhandledRejection', (r) => console.log('unhandled', r.message));\nPromise.reject(new Error('boom'));\nsetTimeout(() => console.log('timer'), 0);\nconsole.log('sync');","out":["sync","unhandled boom","timer"],"why":"Sync code first. After the microtasks drain, Node checks for rejections that nobody handled and calls the handler. That happens before the loop reaches the timers phase."},
    {"id":"n-p11","lvl":"Tricky","code":"process.on('unhandledRejection', () => console.log('unhandled'));\nasync function risky() { throw new Error('x'); }\ntry {\n  risky();\n  console.log('after call');\n} catch (e) {\n  console.log('caught by try');\n}\nrisky().catch((e) => console.log('caught by catch', e.message));","out":["after call","caught by catch x","unhandled"],"why":"An async function never throws synchronously. It returns a rejected promise, so try/catch around the call catches nothing. The first promise has no handler, so it is reported as unhandled. The second one is handled by its catch."},
    {"id":"n-p12","lvl":"Tricky","code":"const { Readable } = require('stream');\nconst r = Readable.from(['a', 'b']);\nr.on('data', (c) => console.log('data', c));\nr.on('end', () => console.log('end'));\nconsole.log('sync');","out":["sync","data a","data b","end"],"why":"A stream does not start flowing until the current synchronous code is finished. So sync prints first, then each chunk, then end."}
  ],
  coding: [
    {"id":"n-k1","lvl":"Easy","title":"promisify","tags":["callbacks","promises"],"prompt":"Write promisify(fn). fn takes its arguments followed by a Node-style callback (err, value). Return a function that gives back a promise instead.","hints":["Return a new function that returns new Promise.","Call fn with the original arguments plus your own callback at the end.","In the callback, reject if err is set, otherwise resolve with the value."],"code":"function promisify(fn) {\n  return function (...args) {\n    return new Promise((resolve, reject) => {\n      fn.call(this, ...args, (err, value) => (err ? reject(err) : resolve(value)));\n    });\n  };\n}","cx":"Time O(1) added. Space O(1).","follow":["How does util.promisify handle functions that return several values?","Why is it better to keep this as the caller's this?"],"test":"const add = (a, b, cb) => setTimeout(() => cb(null, a + b), 5);\nconst fail = (cb) => setTimeout(() => cb(new Error('no')), 5);\nconst r = await promisify(add)(2, 3);\nlet msg = '';\ntry { await promisify(fail)(); } catch (e) { msg = e.message; }\nconst obj = { k: 7, get(cb) { cb(null, this.k); } };\nconst viaThis = await promisify(obj.get).call(obj);\nreturn r === 5 && msg === 'no' && viaThis === 7;"},
    {"id":"n-k2","lvl":"Easy","title":"Debounce","tags":["closure","timers"],"prompt":"Write debounce(fn, ms). It returns a function that calls fn only after ms milliseconds with no new calls. It passes along the latest arguments, and has a cancel method.","hints":["Keep one timer id in a closure.","On every call, clear the old timer and start a new one.","Store the latest arguments, and call fn with them when the timer fires."],"code":"function debounce(fn, ms) {\n  let timer;\n  function debounced(...args) {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn.apply(this, args), ms);\n  }\n  debounced.cancel = () => clearTimeout(timer);\n  return debounced;\n}","cx":"Time O(1) per call. Space O(1).","follow":["Add a leading-edge option.","Where would you use it in a Node service?"],"test":"const seen = [];\nconst d = debounce((x) => seen.push(x), 20);\nd(1); d(2); d(3);\nawait new Promise((r) => setTimeout(r, 60));\nconst c = debounce((x) => seen.push(x), 20);\nc(9); c.cancel();\nawait new Promise((r) => setTimeout(r, 50));\nreturn seen.length === 1 && seen[0] === 3;"},
    {"id":"n-k3","lvl":"Medium","title":"Async pool with a concurrency limit","tags":["promises","concurrency"],"prompt":"Write asyncPool(limit, items, worker). It runs worker(item) for every item, with at most limit running at once, and resolves to the results in the same order as the items.","hints":["Start limit runners. Each one repeatedly takes the next unused index.","Write each result into results[index] so the order is kept.","Wait for every runner with Promise.all."],"code":"async function asyncPool(limit, items, worker) {\n  const results = new Array(items.length);\n  let next = 0;\n  async function run() {\n    while (next < items.length) {\n      const i = next++;\n      results[i] = await worker(items[i], i);\n    }\n  }\n  const runners = Array.from({ length: Math.min(limit, items.length) }, run);\n  await Promise.all(runners);\n  return results;\n}","cx":"Time depends on the slowest tasks. Space O(n) for results.","follow":["What should happen if one worker throws?","How would you add a retry for failed items?"],"test":"let active = 0, peak = 0;\nconst out = await asyncPool(3, [5, 1, 4, 2, 3, 6, 1], async (n) => {\n  active++; peak = Math.max(peak, active);\n  await new Promise((r) => setTimeout(r, n * 4));\n  active--;\n  return n * 10;\n});\nconst empty = await asyncPool(2, [], async (x) => x);\nreturn peak === 3 && JSON.stringify(out) === JSON.stringify([50, 10, 40, 20, 30, 60, 10]) && empty.length === 0;"},
    {"id":"n-k4","lvl":"Medium","title":"Retry with exponential backoff","tags":["async","resilience"],"prompt":"Write retry(fn, { retries, baseMs, sleep }). Call the async function fn. If it throws, wait baseMs, then 2x baseMs, then 4x, and so on, and try again, up to retries extra attempts. Use the injected sleep(ms) so the delay can be tested. Throw the last error when attempts run out.","hints":["Loop from attempt 0 up to retries, inclusive.","Delay for attempt n is baseMs * 2 ** n.","Do not sleep after the last failure. Rethrow instead."],"code":"async function retry(fn, { retries = 3, baseMs = 100, sleep = (ms) => new Promise((r) => setTimeout(r, ms)) } = {}) {\n  let lastError;\n  for (let attempt = 0; attempt <= retries; attempt++) {\n    try {\n      return await fn(attempt);\n    } catch (err) {\n      lastError = err;\n      if (attempt === retries) break;\n      await sleep(baseMs * 2 ** attempt);\n    }\n  }\n  throw lastError;\n}","cx":"At most retries + 1 calls. Space O(1).","follow":["Add random jitter, and say why it helps.","Which errors should not be retried?"],"test":"const delays = [];\nconst sleep = async (ms) => { delays.push(ms); };\nlet calls = 0;\nconst ok = await retry(async () => { calls++; if (calls < 3) throw new Error('flaky'); return 'done'; }, { retries: 5, baseMs: 100, sleep });\nconst d1 = delays.slice();\ndelays.length = 0;\nlet msg = '';\ntry { await retry(async () => { throw new Error('always'); }, { retries: 2, baseMs: 10, sleep }); } catch (e) { msg = e.message; }\nreturn ok === 'done' && JSON.stringify(d1) === '[100,200]' && msg === 'always' && JSON.stringify(delays) === '[10,20]';"},
    {"id":"n-k5","lvl":"Medium","title":"LRU cache","tags":["Map","cache"],"prompt":"Write a class LRU with a capacity. get(key) returns the value or undefined and marks it as recently used. set(key, value) adds or updates a value and removes the least recently used key when the size passes the capacity.","hints":["A Map remembers insertion order.","To mark a key as recent, delete it and set it again.","The first key in map.keys() is the oldest."],"code":"class LRU {\n  constructor(capacity) {\n    this.capacity = capacity;\n    this.map = new Map();\n  }\n  get(key) {\n    if (!this.map.has(key)) return undefined;\n    const value = this.map.get(key);\n    this.map.delete(key);\n    this.map.set(key, value);\n    return value;\n  }\n  set(key, value) {\n    this.map.delete(key);\n    this.map.set(key, value);\n    if (this.map.size > this.capacity) this.map.delete(this.map.keys().next().value);\n  }\n}","cx":"Time O(1) for get and set. Space O(capacity).","follow":["Add a TTL for each entry.","How would you do it without Map, using a linked list?"],"test":"const c = new LRU(2);\nc.set('a', 1); c.set('b', 2);\nc.get('a');\nc.set('c', 3);\nconst evictedB = c.get('b') === undefined;\nc.set('a', 10);\nc.set('d', 4);\nreturn evictedB && c.get('a') === 10 && c.get('c') === undefined && c.get('d') === 4;"},
    {"id":"n-k6","lvl":"Medium","title":"Pub/sub with once and off","tags":["events","classes"],"prompt":"Build a small emitter class: on(name, fn), once(name, fn), off(name, fn) and emit(name, ...args). emit calls listeners in the order they were added and returns true if there was at least one listener. A once listener runs only one time.","hints":["Keep a Map from event name to an array of listeners.","Wrap a once listener so that it removes itself before it calls the real function.","Copy the array before looping, so removing a listener during emit does not skip others."],"code":"class Emitter {\n  constructor() { this.map = new Map(); }\n  on(name, fn) {\n    if (!this.map.has(name)) this.map.set(name, []);\n    this.map.get(name).push(fn);\n    return this;\n  }\n  once(name, fn) {\n    const wrapper = (...args) => { this.off(name, wrapper); fn(...args); };\n    wrapper.original = fn;\n    return this.on(name, wrapper);\n  }\n  off(name, fn) {\n    const list = this.map.get(name) || [];\n    this.map.set(name, list.filter((f) => f !== fn && f.original !== fn));\n    return this;\n  }\n  emit(name, ...args) {\n    const list = (this.map.get(name) || []).slice();\n    list.forEach((f) => f(...args));\n    return list.length > 0;\n  }\n}","cx":"emit is O(listeners). Space O(listeners).","follow":["What should emit('error') do when nobody listens?","How would you add prependListener?"],"test":"const e = new Emitter();\nconst log = [];\nconst a = (x) => log.push('a' + x);\ne.on('t', a);\ne.once('t', (x) => log.push('once' + x));\ne.on('t', (x) => log.push('c' + x));\nconst r1 = e.emit('t', 1);\ne.emit('t', 2);\ne.off('t', a);\ne.emit('t', 3);\nconst r2 = e.emit('none');\nreturn r1 === true && r2 === false && JSON.stringify(log) === JSON.stringify(['a1', 'once1', 'c1', 'a2', 'c2', 'c3']);"},
    {"id":"n-k7","lvl":"Hard","title":"Express-style middleware runner","tags":["express","middleware"],"prompt":"Write createApp() with use(fn) and handle(req, res, done). Middleware with 3 arguments (req, res, next) run in order. Calling next(err) skips to the next middleware with 4 arguments (err, req, res, next). When the chain ends, call done(err). A thrown error counts as next(err).","hints":["Use an index and a next function that moves to the following layer.","Check fn.length to tell normal middleware (3) from error middleware (4).","Wrap each call in try/catch and forward errors to next."],"code":"function createApp() {\n  const stack = [];\n  return {\n    use(fn) { stack.push(fn); return this; },\n    handle(req, res, done) {\n      let i = 0;\n      function next(err) {\n        const fn = stack[i++];\n        if (!fn) return done(err);\n        const isErrorHandler = fn.length === 4;\n        try {\n          if (err && isErrorHandler) fn(err, req, res, next);\n          else if (!err && !isErrorHandler) fn(req, res, next);\n          else next(err);\n        } catch (e) { next(e); }\n      }\n      next();\n    }\n  };\n}","cx":"Time O(layers) per request. Space O(1) extra.","follow":["How would you add path matching to use()?","What changes if a middleware is async?"],"test":"const order = [];\nconst app = createApp();\napp.use((req, res, next) => { order.push('a'); next(); });\napp.use((req, res, next) => { order.push('b'); next(new Error('bad')); });\napp.use((req, res, next) => { order.push('skipped'); next(); });\napp.use((err, req, res, next) => { order.push('err:' + err.message); next(); });\napp.use((req, res, next) => { order.push('c'); next(); });\nconst done1 = await new Promise((r) => app.handle({}, {}, (e) => r(e || 'ok')));\nconst app2 = createApp();\napp2.use(() => { throw new Error('boom'); });\napp2.use((err, req, res, next) => { order.push('caught:' + err.message); next(); });\nconst done2 = await new Promise((r) => app2.handle({}, {}, (e) => r(e || 'ok')));\nconst app3 = createApp();\napp3.use(() => { throw new Error('final'); });\nconst done3 = await new Promise((r) => app3.handle({}, {}, (e) => r(e ? e.message : 'ok')));\nreturn JSON.stringify(order) === JSON.stringify(['a', 'b', 'err:bad', 'c', 'caught:boom']) && done1 === 'ok' && done2 === 'ok' && done3 === 'final';"},
    {"id":"n-k8","lvl":"Medium","title":"Token bucket rate limiter","tags":["rate limiting","time"],"prompt":"Write class TokenBucket(capacity, refillPerSec, now = Date.now). tryRemove() returns true and uses one token if one is available, otherwise false. Tokens refill continuously with time but never go above capacity. The now function is injected so tests can control the clock.","hints":["Store the token count and the time of the last refill.","On each call, add elapsed seconds * refillPerSec, capped at capacity.","Then try to take one token."],"code":"class TokenBucket {\n  constructor(capacity, refillPerSec, now = Date.now) {\n    this.capacity = capacity;\n    this.rate = refillPerSec;\n    this.now = now;\n    this.tokens = capacity;\n    this.last = now();\n  }\n  tryRemove() {\n    const t = this.now();\n    this.tokens = Math.min(this.capacity, this.tokens + ((t - this.last) / 1000) * this.rate);\n    this.last = t;\n    if (this.tokens >= 1) { this.tokens -= 1; return true; }\n    return false;\n  }\n}","cx":"Time O(1) per call. Space O(1) per key.","follow":["How would you keep one bucket per user without leaking memory?","How do you share limits across several servers?"],"test":"let t = 0;\nconst b = new TokenBucket(2, 1, () => t);\nconst first = [b.tryRemove(), b.tryRemove(), b.tryRemove()];\nt = 500;\nconst half = b.tryRemove();\nt = 1000;\nconst one = b.tryRemove();\nt = 100000;\nconst afterLong = [b.tryRemove(), b.tryRemove(), b.tryRemove()];\nreturn JSON.stringify(first) === '[true,true,false]' && half === false && one === true && JSON.stringify(afterLong) === '[true,true,false]';"},
    {"id":"n-k9","lvl":"Medium","title":"Route matcher and query parser","tags":["routing","strings"],"prompt":"Write two functions. matchRoute(pattern, path) returns an object of params, for example matchRoute('/users/:id/posts/:pid', '/users/42/posts/7') gives { id: '42', pid: '7' }, or null if it does not match. parseQuery('a=1&b=2&a=3') returns { a: ['1', '3'], b: '2' }: a repeated key becomes an array, and values are decoded.","hints":["Split both the pattern and the path on '/'. The lengths must match.","A segment that starts with ':' captures the path segment, using decodeURIComponent.","For the query, use decodeURIComponent on keys and values, and turn a repeated key into an array."],"code":"function matchRoute(pattern, path) {\n  const p = pattern.split('/').filter(Boolean);\n  const s = path.split('?')[0].split('/').filter(Boolean);\n  if (p.length !== s.length) return null;\n  const params = {};\n  for (let i = 0; i < p.length; i++) {\n    if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);\n    else if (p[i] !== s[i]) return null;\n  }\n  return params;\n}\nfunction parseQuery(qs) {\n  const out = {};\n  for (const part of qs.replace(/^[?]/, '').split('&')) {\n    if (!part) continue;\n    const [k, v = ''] = part.split('=');\n    const key = decodeURIComponent(k), val = decodeURIComponent(v.replace(/[+]/g, ' '));\n    if (key in out) out[key] = [].concat(out[key], val);\n    else out[key] = val;\n  }\n  return out;\n}","cx":"Time O(length of the input). Space O(segments).","follow":["How would you support a wildcard segment?","Why should you not use a plain object for user-supplied keys?"],"test":"const a = matchRoute('/users/:id/posts/:pid', '/users/42/posts/7');\nconst b = matchRoute('/users/:id', '/posts/42');\nconst c = matchRoute('/users/:id', '/users/42/extra');\nconst d = matchRoute('/files/:name', '/files/a%20b.txt');\nconst q = parseQuery('a=1&b=2&a=3&c=hello%20world&d=x+y&e');\nreturn JSON.stringify(a) === '{\"id\":\"42\",\"pid\":\"7\"}' && b === null && c === null && d.name === 'a b.txt' && JSON.stringify(q) === '{\"a\":[\"1\",\"3\"],\"b\":\"2\",\"c\":\"hello world\",\"d\":\"x y\",\"e\":\"\"}';"},
    {"id":"n-k10","lvl":"Medium","title":"Config loader with env overrides","tags":["config","objects"],"prompt":"Write loadConfig(defaults, env, prefix). Environment variables that start with prefix override the defaults. A double underscore means nesting: APP_DB__HOST sets db.host. Keys are lower-cased. Convert 'true' and 'false' to booleans and numeric strings to numbers. Do not change the defaults object.","hints":["Start from a deep copy of defaults.","For each env key with the prefix, remove the prefix, lower-case it and split on '__'.","Walk down the path creating objects, then set the converted value."],"code":"function coerce(v) {\n  if (v === 'true') return true;\n  if (v === 'false') return false;\n  if (v.trim() !== '' && !Number.isNaN(Number(v))) return Number(v);\n  return v;\n}\nfunction loadConfig(defaults, env, prefix) {\n  const cfg = JSON.parse(JSON.stringify(defaults));\n  for (const [name, raw] of Object.entries(env)) {\n    if (!name.startsWith(prefix)) continue;\n    const path = name.slice(prefix.length).toLowerCase().split('__');\n    let node = cfg;\n    for (const key of path.slice(0, -1)) {\n      if (typeof node[key] !== 'object' || node[key] === null) node[key] = {};\n      node = node[key];\n    }\n    node[path[path.length - 1]] = coerce(raw);\n  }\n  return cfg;\n}","cx":"Time O(env size + config size). Space O(config size).","follow":["How would you validate the result against a schema?","How should secrets be handled in this loader?"],"test":"const defaults = { port: 3000, debug: false, db: { host: 'localhost', port: 5432 } };\nconst env = { APP_PORT: '8080', APP_DEBUG: 'true', APP_DB__HOST: 'db.internal', APP_NEW__DEEP__KEY: 'x', OTHER: '1' };\nconst cfg = loadConfig(defaults, env, 'APP_');\nreturn cfg.port === 8080 && cfg.debug === true && cfg.db.host === 'db.internal' && cfg.db.port === 5432 && cfg.new.deep.key === 'x' && !('other' in cfg) && defaults.port === 3000 && defaults.db.host === 'localhost';"}

  scenarios: [
    {"id":"n-s1","title":"The API suddenly got slow","sit":"Response times for a Node API tripled this morning. Nothing was deployed.","steps":["Check the metrics first: which endpoints, since when, and is it all traffic or some.","Look at event loop lag and CPU. High lag means something is blocking the loop.","Check downstream: database query times, pool waiting, third-party calls and timeouts.","Look for a recent change in data or traffic: a bigger table, a new client, a retry storm.","Profile with --inspect or a flame graph on one instance if CPU is high.","Mitigate first (scale out, roll back, add a timeout), then fix the root cause."],"miss":["Guessing and changing code before looking at data.","Only looking at the Node process and ignoring the database.","Forgetting to add timeouts to outgoing calls."],"say":"I would start with metrics to see which endpoints and since when. Then I check event loop lag, CPU and the database pool. That tells me whether the problem is in my process or downstream. I stabilise first, then find the cause."},
    {"id":"n-s2","title":"Memory keeps growing until the process crashes","sit":"A service is restarted by the platform every few hours with out-of-memory errors.","steps":["Confirm the trend: heapUsed climbing after garbage collection, not just a busy period.","Check whether it is heap (JS objects) or outside the heap (Buffers, native memory).","Take two heap snapshots a while apart with --inspect and compare what grew.","Look for the usual causes: unbounded caches or maps, listeners added per request, timers never cleared.","Fix with limits: LRU cache with a max size, remove listeners, clear timers, stream instead of buffering.","Watch the graph after the fix. Keep a memory alert."],"miss":["Only raising --max-old-space-size.","Scheduling restarts and calling it fixed.","Taking one snapshot and not comparing."],"say":"I would confirm the leak on a graph, take two heap snapshots and compare them to see which object type grows. Most leaks are unbounded caches or listeners, so I would add a limit or remove the listener, then confirm the graph goes flat."},
    {"id":"n-s3","title":"One CPU core is at 100%","sit":"A server is slow. Monitoring shows one core at 100% and the others idle.","steps":["This means the single JavaScript thread is the bottleneck. Node uses one core for your code.","Find the hot code: take a CPU profile or flame graph.","If the work is CPU-heavy (image, crypto, big JSON), move it to worker_threads or a queue and worker service.","To use all cores for HTTP, run several processes: cluster, PM2, or more containers.","Remember that state in memory is not shared between processes. Move it to Redis or a database."],"miss":["Adding async/await around the heavy code.","Running a bigger machine without using more processes.","Forgetting that sessions or caches in memory break with many processes."],"say":"One core at 100% means the JavaScript thread is saturated. I would profile to find the hot code, move heavy work to worker threads or a queue, and run one process per core for the HTTP side."},
    {"id":"n-s4","title":"An unhandled rejection crashes production","sit":"The process exits at night with 'UnhandledPromiseRejection'. Users saw errors for a minute.","steps":["Read the stack trace in the logs. Find the promise that nobody awaited or caught.","Fix the cause: add await, add catch, or forward errors to the error handler.","In Express 4, wrap async handlers so errors reach next(). Express 5 does this for you.","Add a process-level handler for unhandledRejection and uncaughtException that logs and exits.","Make sure a supervisor restarts the process, and that health checks keep traffic away while it restarts.","Add a lint rule such as no-floating-promises."],"miss":["Swallowing the error with an empty global handler and continuing.","Treating the crash as the bug instead of the missing catch.","No restart policy."],"say":"The crash is Node correctly refusing to run in an unknown state. I would find the unhandled promise from the stack trace, fix the missing catch, add a logging exit handler and make sure the platform restarts the service quickly."},
    {"id":"n-s5","title":"Slow database queries","sit":"A few endpoints take seconds. The Node CPU is low, but the database is busy.","steps":["Log or trace query times to find the slow ones.","Run EXPLAIN on them and look for full table scans and missing indexes.","Look for the N+1 pattern: one query per item in a loop. Replace with a join or a batched query.","Check pool settings: connections waiting for a free slot look like slow queries.","Fetch only the columns and rows you need. Add pagination.","Cache results that rarely change."],"miss":["Blaming Node when the CPU is low.","Raising the pool size until the database falls over.","Adding an index without checking the query plan."],"say":"Low Node CPU and a busy database points at queries. I would find the slow ones, read the plan, add the right index, remove N+1 loops and make sure the pool is sized sensibly."},
    {"id":"n-s6","title":"Design authentication for an API","sit":"You are asked to design login for a new REST API used by a web app and a mobile app.","steps":["Clarify who the clients are, and whether there are third parties.","Hash passwords with bcrypt, scrypt or argon2. Never store plain text.","Issue short-lived access tokens and a longer refresh token that can be revoked.","For the web, keep tokens in httpOnly secure cookies, and think about CSRF.","Verify tokens in middleware with a fixed algorithm list. Check expiry and audience.","Add rate limiting on login, and consider MFA and account lockout."],"miss":["Putting secrets inside the JWT payload.","A long-lived token with no way to revoke it.","Storing tokens in localStorage without discussing XSS."],"say":"I would use hashed passwords, short-lived access tokens and revocable refresh tokens, cookies for the web, strict verification middleware, and rate limiting on login."},
    {"id":"n-s7","title":"Uploading huge files","sit":"Users upload videos of several gigabytes. The server runs out of memory.","steps":["The cause is usually buffering the whole file in memory.","Stream the upload straight to disk or object storage using pipeline.","Better: give the client a presigned URL and let it upload directly to storage.","Set size limits and validate type and content, not just the file extension.","Handle aborted uploads and clean up partial files.","Process the file later in a background job, not in the request."],"miss":["Using a body parser that reads the full body into memory.","Trusting the file name or the Content-Type from the client.","Doing slow processing inside the request."],"say":"I would never buffer the file. I would stream it to storage or use a presigned URL, enforce size and type limits, and do the processing in a background job."},
    {"id":"n-s8","title":"Zero-downtime deploys","sit":"Each deploy drops a few requests. You are asked to fix it.","steps":["Run at least two instances behind a load balancer and roll them one at a time.","Add readiness and liveness checks so traffic only goes to healthy instances.","Handle SIGTERM: stop accepting new connections, finish in-flight requests, close the pool, then exit.","Set a grace period longer than your slowest normal request.","Make database migrations backward compatible: add first, switch code, remove later.","Keep the ability to roll back quickly."],"miss":["Calling process.exit immediately on SIGTERM.","A migration that drops a column the old code still reads.","No readiness check, so new instances get traffic before they are ready."],"say":"Rolling deploys, readiness checks, graceful shutdown on SIGTERM and backward-compatible migrations. That way old and new versions can run side by side and no request is cut off."}
  ],
  special: [
    {"id":"n-x1","name":"AsyncLocalStorage","what":"Keeps data tied to one request or async chain without passing it through every function. Often used for request ids in logs.","why":"Interviewers ask how you add a request id to every log line without changing every function signature.","code":"const { AsyncLocalStorage } = require('node:async_hooks');\nconst als = new AsyncLocalStorage();\nfunction log(msg) { console.log(als.getStore()?.id, msg); }\nals.run({ id: 'req-1' }, async () => {\n  await null;\n  log('hello');\n});"},
    {"id":"n-x2","name":"worker_threads and SharedArrayBuffer","what":"Worker threads can share memory using a SharedArrayBuffer. Atomics makes reads and writes on it safe.","why":"Shows that you know how to share state between threads without copying messages.","code":"const { Worker, isMainThread, workerData } = require('worker_threads');\nif (isMainThread) {\n  const shared = new SharedArrayBuffer(4);\n  const counter = new Int32Array(shared);\n  const w = new Worker(__filename, { workerData: shared });\n  w.on('exit', () => console.log(Atomics.load(counter, 0)));\n} else {\n  const counter = new Int32Array(workerData);\n  Atomics.add(counter, 0, 5);\n}"},
    {"id":"n-x3","name":"stream.pipeline","what":"Connects streams and handles errors and clean-up for all of them. It has a promise version in stream/promises.","why":"The right answer to 'how do you copy or transform a large file safely'.","code":"const { pipeline } = require('node:stream/promises');\nconst fs = require('node:fs');\nconst zlib = require('node:zlib');\nawait pipeline(\n  fs.createReadStream('in.txt'),\n  zlib.createGzip(),\n  fs.createWriteStream('in.txt.gz')\n);"},
    {"id":"n-x4","name":"Diagnostics: --inspect and clinic","what":"--inspect lets Chrome DevTools attach to a running process for CPU profiles and heap snapshots. Tools such as clinic and 0x produce flame graphs.","why":"Shows you have a method for performance and memory problems, not just guesses.","code":"// node --inspect server.js     then open chrome://inspect\n// npx clinic doctor -- node server.js\nconst { monitorEventLoopDelay } = require('node:perf_hooks');\nconst h = monitorEventLoopDelay();\nh.enable();\nsetInterval(() => console.log('p99 lag ms', h.percentile(99) / 1e6), 5000).unref();"},
    {"id":"n-x5","name":"N-API (native addons)","what":"A stable C API for writing native add-ons. An add-on built against N-API keeps working across Node versions without a rebuild.","why":"Explains how libraries such as bcrypt and sharp call C or C++ code, and why they have install steps.","code":"// addon built with node-gyp from C or C++ using N-API\nconst addon = require('./build/Release/addon.node');\nconsole.log(addon.hello());"},
    {"id":"n-x6","name":"Permission model","what":"A Node option that restricts what a process may do, such as which paths it can read or write. It started as an experimental flag and is being stabilised in newer versions.","why":"Shows security awareness when running untrusted or third-party code.","code":"// node --permission --allow-fs-read=/app/data app.js\nconst fs = require('node:fs');\n// with the flag, reading outside /app/data throws ERR_ACCESS_DENIED"},
    {"id":"n-x7","name":"node:test runner","what":"Node includes a built-in test runner and assertion module, so small projects need no extra test library.","why":"Modern answer to 'how would you test this' without installing Jest.","code":"const test = require('node:test');\nconst assert = require('node:assert/strict');\ntest('adds numbers', () => {\n  assert.equal(1 + 2, 3);\n});\n// run with: node --test"},

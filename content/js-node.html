    st('PROBLEM', 'Routes map a request to code', ['app.get(path, handler) runs the handler for GET requests that match the path. Colon parts like :id land in req.params.', 'In Express 5 and 4 alike, the handler calls res.json or res.send to finish the request.'], { add: ['req', 'route', 'res'], e: ['r1', 'r2'], hi: ['route'], read: [['Param', 'req.params.id']], code: "const express = require('express');\nconst app = express();\n\napp.get('/users/:id', (req, res) => {\n  res.json({ id: req.params.id });\n});\n\napp.listen(3000);", key: ['idea', 'Params come back as strings. Convert them yourself when you need a number.'], short: 'Routes' }),
    st('CONCEPT', 'Middleware is a chain', ['A middleware is a function (req, res, next). It can change req or res, reply itself, or call next() to pass the request on.', 'They run in the order you register them. The request visits each one until something replies.'], { add: ['log', 'json', 'auth'], e: ['c1', 'c2', 'c3', 'c4', 'r2'], hi: ['log', 'json', 'auth'], read: [['Order', 'A, B, handler']], code: "const express = require('express');\nconst app = express();\n\napp.use((req, res, next) => { req.trail = ['A']; next(); });\napp.use((req, res, next) => { req.trail.push('B'); next(); });\n\napp.get('/', (req, res) => {\n  req.trail.push('handler');\n  res.json(req.trail);\n});\n\napp.listen(3000);", key: ['know', 'If a middleware neither replies nor calls next(), the request hangs.'], short: 'Chain' }),
    st('TECHNIQUE', 'Order matters: parse before you read', ['express.json() fills req.body. A route registered before it sees no body at all.', 'Put shared middleware such as parsers, logging and auth first, and routes after.'], { e: ['c1', 'c2', 'c3', 'c4', 'r2'], hi: ['json'], read: [['Before parser', 'no body'], ['After parser', 'parsed']], code: "const express = require('express');\nconst app = express();\n\napp.post('/early', (req, res) => res.json({ body: req.body ?? null }));\n\napp.use(express.json());\n\napp.post('/late', (req, res) => res.json({ body: req.body }));\n\napp.listen(3000);", key: ['warn', 'req.body undefined is the classic symptom of a parser registered too late.'], short: 'Order' }),
    st('TECHNIQUE', 'A Router groups related routes', ['express.Router() is a mini app. Mount it under a prefix with app.use, and its routes sit below that prefix.', 'It keeps a big app split by feature: users, orders, billing.'], { e: ['c3', 'c4', 'r2'], hi: ['route'], read: [['Mounted at', '/api/users']], code: "const express = require('express');\n\nconst users = express.Router();\nusers.get('/', (req, res) => res.json([]));\nusers.get('/:id', (req, res) => res.json({ id: req.params.id }));\n\nconst app = express();\napp.use('/api/users', users);\n\napp.listen(3000);", key: ['know', 'A router can have its own middleware too, for example auth just for /admin.'], short: 'Router' }),
    st('TECHNIQUE', 'Errors have their own middleware', ['A function with four arguments (err, req, res, next) is an error handler. A thrown error in a route or middleware skips ahead to it.', 'In Express 5 a rejected promise from an async handler is forwarded too. In Express 4 you must catch it and call next(err).'], { add: ['err'], e: ['c3', 'c4', 'c5', 'r2'], hi: ['err'], read: [['Sync throw', '500 JSON'], ['Async throw', 'also caught']], code: "const express = require('express');\nconst app = express();\n\napp.get('/boom', () => {\n  throw new Error('boom');\n});\n\napp.get('/async', async () => {\n  throw new Error('late boom');\n});\n\n// Four arguments: this is how Express knows it is an error handler.\napp.use((err, req, res, next) => {\n  res.status(500).json({ error: err.message });\n});\n\napp.listen(3000);", key: ['idea', 'Keep one error handler that decides the status and the JSON shape for the whole app.'], short: 'Errors' }),
    st('WATCH OUT', 'The error handler goes last', ['An error handler only sees errors from middleware and routes registered before it. Put it first and it never runs.', 'The reply then comes from Express own default handler, which is an HTML page, not your JSON.'], { e: ['c4', 'c5', 'r2'], hi: ['err'], read: [['Too early', 'default HTML 500']], code: "const express = require('express');\nconst app = express();\n\n// Registered too early: nothing has failed yet, so it never runs.\napp.use((err, req, res, next) => {\n  res.status(500).json({ caught: true });\n});\n\napp.get('/boom', () => {\n  throw new Error('x');\n});\n\napp.listen(3000);", key: ['warn', 'Register error handlers after every route. Also never send the stack trace in production.'], short: 'Placement' }),
    st('RECAP', 'Remember', ['Routes match requests. Middleware is a chain of (req, res, next) in registration order, and Routers group routes.', 'Parsers go first, the four-argument error handler goes last, and every request needs exactly one reply.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'rest-api', lvl: 2, title: 'Designing REST APIs', sub: 'Nouns in the URL, verbs in the method, and the same predictable behaviour every time.', min: 10, diff: 'Intermediate',
  learn: ['Resources, verbs and status codes', 'Validating input at the edge', 'Pagination with a cursor', 'Idempotency and one error shape'],
  nodes: {
    resr: { k: 'cube', p: [-3.6, 0], c: 'blue', g: 'URL', t: 'Resource', s: '/orders/42' },
    verb: { k: 'cube', p: [-1.0, -1.8], c: 'purple', g: 'verb', t: 'HTTP verb', s: 'GET POST DELETE' },
    code: { k: 'cube', p: [2.0, -1.8], c: 'green', g: '201', t: 'Status code', s: '201, 404, 422' },
    val: { k: 'cube', p: [-1.0, 1.6], c: 'purple', g: 'check', t: 'Validation', s: 'reject bad input' },
    page: { k: 'cube', p: [2.0, 1.0], c: 'amber', g: 'page', t: 'Pagination', s: 'cursor and limit' },
    idem: { k: 'cube', p: [4.0, -0.4], c: 'pink', g: 'key', t: 'Idempotency key', s: 'safe retries' },
    err: { k: 'cube', p: [-1.0, 3.2], c: 'red', g: 'err', t: 'Error shape', s: 'same JSON always' }
  },
  edges: {
    e1: { a: 'resr', b: 'verb', t: 'method', pk: true },
    e2: { a: 'verb', b: 'code', t: 'result', pk: true },
    e3: { a: 'resr', b: 'val', t: 'body in' },
    e4: { a: 'val', b: 'page', t: 'lists' },
    e5: { a: 'page', b: 'idem', t: 'writes' },
    e6: { a: 'val', b: 'err', t: 'fails', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'An API is a contract', ['A REST API names things with URLs (orders, users) and acts on them with HTTP methods. The status code tells the client what happened.', 'Clients depend on that contract, so keep it boring and predictable.'], { add: ['resr', 'verb', 'code'], e: ['e1', 'e2'], hi: ['resr'], read: [['Create', 'POST 201'], ['Read', 'GET 200 or 404'], ['Delete', 'DELETE 204']], code: "const express = require('express');\nconst app = express();\napp.use(express.json());\n\nconst orders = new Map();\nlet nextId = 1;\n\napp.post('/orders', (req, res) => {\n  const id = String(nextId++);\n  const order = { id, ...req.body };\n  orders.set(id, order);\n  res.status(201).location('/orders/' + id).json(order);\n});\n\napp.get('/orders/:id', (req, res) => {\n  const order = orders.get(req.params.id);\n  if (!order) {\n    return res.status(404).json({ error: { code: 'not_found', message: 'No such order' } });\n  }\n  res.json(order);\n});\n\napp.delete('/orders/:id', (req, res) => {\n  orders.delete(req.params.id);\n  res.status(204).end();\n});\n\napp.listen(3000);", key: ['idea', 'Plural nouns in the path, the verb in the method, the outcome in the status.'], short: 'Contract' }),
    st('CONCEPT', 'Verbs have meaning', ['GET is safe: it changes nothing. GET, PUT and DELETE are idempotent: doing them twice leaves the same result. POST is not idempotent, so a retry can create a second record.', 'PUT replaces the whole resource. PATCH changes only the fields you send. Version a breaking change with /v1 or a header, not by surprising old clients.'], { hi: ['verb'], read: [['GET', 'safe, idempotent'], ['PUT, DELETE', 'idempotent'], ['POST', 'not idempotent']], key: ['know', 'Interviewers love "is DELETE idempotent": yes, a second delete has no extra effect even if the status differs.'], short: 'Verbs' }),
    st('TECHNIQUE', 'Validate at the edge', ['Check every body, query and param before it reaches your logic. Return 400 for a malformed request and 422 for well-formed but invalid data. Both are common, so stay consistent.', 'List every problem in one reply so the client can fix them together.'], { add: ['val'], e: ['e1', 'e2', 'e3'], hi: ['val'], read: [['Bad input', '422 + details']], code: "function validateOrder(body) {\n  const errors = [];\n  if (typeof body.item !== 'string' || !body.item) {\n    errors.push({ field: 'item', message: 'required string' });\n  }\n  if (!Number.isInteger(body.qty) || body.qty < 1) {\n    errors.push({ field: 'qty', message: 'integer, 1 or more' });\n  }\n  return errors;\n}\n\napp.post('/orders', (req, res) => {\n  const errors = validateOrder(req.body);\n  if (errors.length) {\n    return res.status(422).json({ error: { code: 'validation_failed', details: errors } });\n  }\n  res.status(201).json({ id: 1, ...req.body });\n});", key: ['know', 'Libraries like zod, joi or ajv do this for you. Never trust req.body.'], short: 'Validate' }),
    st('TECHNIQUE', 'Page big lists with a cursor', ['Never return a whole table. Take a limit and a cursor, the last id the client saw, and return the next cursor.', 'Cursors stay correct when rows are added in between. Page numbers with offset can skip or repeat rows and get slow on deep pages.'], { add: ['page'], e: ['e3', 'e4'], hi: ['page'], read: [['limit', 'capped'], ['next', 'null at the end']], code: "app.get('/orders', (req, res) => {\n  const limit = Math.min(Number(req.query.limit) || 20, 100);\n  const after = Number(req.query.after) || 0;            // cursor: the last id the client saw\n  const page = ORDERS.filter((o) => o.id > after).slice(0, limit);\n  const next = page.length === limit ? page[page.length - 1].id : null;\n  res.json({ data: page, next });\n});", key: ['idea', 'Always cap the limit on the server, whatever the client asks for.'], short: 'Pagination' }),
    st('TECHNIQUE', 'Make retries safe with idempotency keys', ['Networks fail, so clients retry. A POST that charges a card must not charge twice.', 'The client sends an Idempotency-Key. The server saves the result under that key and replays it for the same key.'], { add: ['idem'], e: ['e4', 'e5'], hi: ['idem'], read: [['Same key', 'same result']], code: "const seen = new Map();   // in real life: Redis or a table with a unique key\n\napp.post('/payments', (req, res) => {\n  const key = req.get('Idempotency-Key');\n  if (!key) return res.status(400).json({ error: { code: 'missing_key' } });\n\n  if (seen.has(key)) return res.status(200).json(seen.get(key));   // replay the saved result\n\n  const result = { id: 'pay_' + (seen.size + 1), amount: req.body.amount };\n  seen.set(key, result);\n  res.status(201).json(result);\n});", key: ['know', 'Store the key with a unique constraint so two parallel retries cannot both pass.'], short: 'Idempotency' }),
    st('WATCH OUT', 'One error shape, no leaks', ['Every failure should look the same: a stable code, a human message and optional details. Clients can then handle errors in one place.', 'For unexpected errors, log the details on the server and send a generic message. Internal text can leak secrets.'], { add: ['err'], e: ['e3', 'e6'], hi: ['err'], read: [['Known error', 'its own message'], ['Unknown', 'generic 500']], code: "class ApiError extends Error {\n  constructor(status, code, message) {\n    super(message);\n    this.status = status;\n    this.code = code;\n  }\n}\n\napp.get('/v1/items/:id', (req, res) => {\n  throw new ApiError(404, 'not_found', 'Item ' + req.params.id + ' not found');\n});\n\napp.get('/v1/crash', () => {\n  throw new Error('password for db-admin is wrong');\n});\n\napp.use((err, req, res, next) => {\n  const status = err.status || 500;\n  res.status(status).json({\n    error: {\n      code: err.code || 'internal',\n      message: status === 500 ? 'Something went wrong' : err.message,\n    },\n  });\n});", key: ['warn', 'Never send stack traces, SQL or config text to the client.'], short: 'Errors' }),
    st('RECAP', 'Remember', ['Resources in the URL, meaning in the verb, outcome in the status. Validate input, page with a cursor, and use idempotency keys for writes that must not repeat.', 'Return one error shape and keep internal details in your logs.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'realtime', lvl: 2, title: 'WebSockets and Server-Sent Events', sub: 'Three ways to get fresh data to the browser, from asking again to a live two-way line.', min: 9, diff: 'Intermediate',
  learn: ['Polling, SSE and WebSocket compared', 'Writing an SSE endpoint', 'A WebSocket echo server', 'Heartbeats and scaling across servers'],
  nodes: {
    cli: { k: 'cube', p: [-3.8, 0], c: 'blue', g: 'web', t: 'Browser', s: 'wants live data' },
    poll: { k: 'cube', p: [-0.8, -2.4], c: 'orange', g: 'ask', t: 'Polling', s: 'ask every few seconds' },
    sse: { k: 'cube', p: [-0.8, -0.2], c: 'teal', g: 'SSE', t: 'SSE', s: 'server to client' },
    ws: { k: 'cube', p: [-0.8, 2.0], c: 'purple', g: 'ws', t: 'WebSocket', s: 'two-way channel' },
    hb: { k: 'cube', p: [2.5, 2.6], c: 'pink', g: 'ping', t: 'Heartbeat', s: 'ping and pong' },
    lb: { k: 'cube', p: [2.5, -0.9], c: 'gray', g: 'LB', t: 'Load balancer', s: 'sticky sessions' },
    bus: { k: 'cube', p: [4.2, 0.9], c: 'amber', g: 'bus', t: 'Pub/Sub channel', s: 'shares messages' }
  },
  edges: {
    e1: { a: 'cli', b: 'poll', t: 'ask again', dash: true },
    e2: { a: 'cli', b: 'sse', t: 'one request', pk: true },
    e3: { a: 'cli', b: 'ws', t: 'upgrade', pk: true, bend: 0.2 },
    e4: { a: 'hb', b: 'ws', t: 'checks', dash: true, c: 'teal' },
    e5: { a: 'lb', b: 'ws', t: 'routes' },
    e6: { a: 'bus', b: 'lb', t: 'fan out', pk: true }
  },
  steps: [
    st('PROBLEM', 'The server has news but cannot knock', ['HTTP is request and reply, so the browser has to ask. Polling asks again on a timer. It is simple but wastes requests and adds delay.', 'Live dashboards, chat and notifications need something better.'], { add: ['cli', 'poll'], e: ['e1'], hi: ['poll'], read: [['Polling', 'simple, wasteful']], key: ['idea', 'Start with polling if updates are rare. Move on only when delay or load hurts.'], short: 'Polling' }),
    st('CONCEPT', 'Pick the lightest tool', ['Server-Sent Events keep one HTTP response open and the server pushes text events down it. One direction, automatic reconnect, works through normal proxies.', 'A WebSocket upgrades the connection to a two-way channel. Use it when the client also sends often, such as chat or games.'], { add: ['sse', 'ws'], e: ['e1', 'e2', 'e3'], hi: ['sse', 'ws'], read: [['SSE', 'server to client'], ['WebSocket', 'both ways']], key: ['know', 'Only the server pushes? SSE is usually enough and simpler than a WebSocket.'], short: 'Compare' }),
    st('TECHNIQUE', 'An SSE endpoint is a response that never ends', ['Set Content-Type to text/event-stream, flush the headers, then write lines that start with data: and end with a blank line.', 'Clear your timer when the client disconnects, or the interval keeps running forever.'], { rm: ['poll', 'ws'], e: ['e2'], hi: ['sse'], read: [['Format', 'data: ...'], ['Cleanup', 'on close']], code: "const express = require('express');\nconst app = express();\n\napp.get('/events', (req, res) => {\n  res.set({\n    'Content-Type': 'text/event-stream',\n    'Cache-Control': 'no-cache',\n    Connection: 'keep-alive',\n  });\n  res.flushHeaders();\n\n  let n = 0;\n  const timer = setInterval(() => {\n    n += 1;\n    res.write(`data: ${JSON.stringify({ tick: n })}\\n\\n`);\n    if (n === 3) {            // stop after three events for this demo\n      clearInterval(timer);\n      res.end();\n    }\n  }, 20);\n\n  req.on('close', () => clearInterval(timer));\n});\n\napp.listen(3000);", key: ['warn', 'Always listen for close and stop work for that client.'], short: 'SSE' }),
    st('TECHNIQUE', 'A WebSocket server keeps sockets open', ['The ws library gives you a WebSocketServer. Each client is a socket with message and close events and a send method.', 'The browser opens it with new WebSocket(url). After the upgrade, either side can send at any time.'], { rm: ['sse'], add: ['ws'], e: ['e3'], hi: ['ws'], read: [['Events', 'message, close']], code: "const { WebSocketServer } = require('ws');\nconst wss = new WebSocketServer({ port: 8080 });\n\nwss.on('connection', (socket) => {\n  socket.on('message', (data) => {\n    socket.send('echo: ' + data.toString());\n  });\n});", key: ['know', 'Authenticate during the upgrade request, not after the socket is open.'], short: 'WebSocket' }),
    st('WATCH OUT', 'Dead connections look alive', ['If a phone loses signal, the server may never get a close event. The socket sits there using memory.', 'Send a ping on a timer. If no pong came back since the last ping, terminate the socket.'], { add: ['hb'], e: ['e3', 'e4'], hi: ['hb'], read: [['No pong', 'terminate']], code: "const { WebSocketServer } = require('ws');\nconst wss = new WebSocketServer({ port: 8080 });\n\nwss.on('connection', (socket) => {\n  socket.isAlive = true;\n  socket.on('pong', () => { socket.isAlive = true; });\n});\n\nconst timer = setInterval(() => {\n  for (const socket of wss.clients) {\n    if (!socket.isAlive) {\n      socket.terminate();          // no pong since the last ping: drop it\n      continue;\n    }\n    socket.isAlive = false;\n    socket.ping();\n  }\n}, 30000);\n\nwss.on('close', () => clearInterval(timer));", key: ['warn', 'Without a heartbeat, ghost connections pile up until the process runs out of memory.'], short: 'Heartbeat' }),
    st('TECHNIQUE', 'Many servers need a shared channel', ['A socket lives on one server. A message from a user on server A will not reach a user on server B on its own.', 'Publish messages to a shared channel such as Redis pub/sub. Every server subscribes and forwards to its own sockets. Sticky sessions at the load balancer keep a client on one server.'], { add: ['lb', 'bus'], e: ['e3', 'e5', 'e6'], hi: ['bus', 'lb'], read: [['Fan-out', 'via pub/sub']], code: "const Redis = require('ioredis');\nconst pub = new Redis();\nconst sub = new Redis();\n\nsub.subscribe('chat');\nsub.on('message', (channel, text) => {\n  // every server instance forwards the message to its own sockets\n  for (const socket of wss.clients) socket.send(text);\n});\n\nfunction broadcast(text) {\n  pub.publish('chat', text);\n}", key: ['know', 'This is why chat apps need pub/sub the moment they run on more than one instance.'], short: 'Scaling' }),
    st('RECAP', 'Remember', ['Poll when updates are rare, use SSE for one-way pushes, and WebSocket for two-way traffic.', 'Heartbeat to clear dead sockets, and share messages over pub/sub when you scale past one server.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'auth-security', lvl: 3, title: 'Auth and Security', sub: 'Know who is calling, store secrets safely, and keep input from turning into code.', min: 12, diff: 'Intermediate',
  learn: ['Sessions versus JWTs', 'Hashing passwords with bcrypt', 'Cookie flags, helmet, CORS and rate limits', 'Injection and secrets'],
  nodes: {
    user: { k: 'cube', p: [-3.8, 0], c: 'blue', g: 'user', t: 'User', s: 'logs in' },
    hash: { k: 'cube', p: [-1.4, -2.2], c: 'purple', g: 'hash', t: 'bcrypt hash', s: 'slow on purpose' },
    tok: { k: 'cube', p: [-1.0, 0.6], c: 'amber', g: 'JWT', t: 'JWT', s: 'signed token' },
    ses: { k: 'cube', p: [1.7, -1.6], c: 'amber', g: 'sid', t: 'Session store', s: 'server remembers' },
    ck: { k: 'cube', p: [1.7, 1.2], c: 'green', g: 'flags', t: 'Cookie flags', s: 'httpOnly, secure' },
    wall: { k: 'cube', p: [4.1, -0.2], c: 'pink', g: 'wall', t: 'Helmet and CORS', s: 'plus rate limits' },
    inj: { k: 'cube', p: [-0.2, 3.0], c: 'red', g: 'DROP', t: 'Injection', s: 'input becomes code' }
  },
  edges: {
    e1: { a: 'user', b: 'tok', t: 'login', pk: true },
    e2: { a: 'user', b: 'ses', t: 'or session', dash: true },
    e3: { a: 'user', b: 'hash', t: 'password' },
    e4: { a: 'tok', b: 'ck', t: 'stored in' },
    e5: { a: 'ck', b: 'wall', t: 'guarded', pk: true },
    e6: { a: 'user', b: 'inj', t: 'bad input', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'Sessions or tokens?', ['A session stores who you are on the server and gives the browser an id. A JWT is a signed token that carries the claims itself, so the server needs no lookup.', 'Sessions are easy to revoke. JWTs scale across servers easily but are hard to cancel before they expire.'], { add: ['user', 'tok', 'ses'], e: ['e1', 'e2'], hi: ['tok', 'ses'], read: [['Session', 'server state'], ['JWT', 'signed, stateless']], code: "const jwt = require('jsonwebtoken');\nconst SECRET = 'dev-only-secret';   // load it from the environment in real code\n\nconst token = jwt.sign({ sub: 'user-42', role: 'admin' }, SECRET, { expiresIn: '15m' });\nconst payload = jwt.verify(token, SECRET);\nconsole.log(payload.sub, payload.role);   // user-42 admin\n\ntry {\n  jwt.verify(token, 'other-secret');\n} catch (err) {\n  console.log(err.message);               // invalid signature\n}", key: ['warn', 'A JWT is signed, not encrypted. Anyone can read the payload, so keep secrets out of it.'], short: 'Session or JWT' }),
    st('TECHNIQUE', 'Hash passwords with bcrypt', ['Never store passwords or fast hashes like plain SHA. bcrypt adds a random salt and is slow on purpose, so guessing is expensive.', 'The salt and cost are stored inside the hash string. compare checks a password against it.'], { rm: ['ses'], add: ['hash'], e: ['e1', 'e3'], hi: ['hash'], read: [['Store', 'only the hash']], code: "const bcrypt = require('bcryptjs');\n\nasync function main() {\n  const hash = await bcrypt.hash('s3cret-pass', 10);\n  console.log(hash.startsWith('$2'));                       // true: salt and cost live inside the hash\n  console.log(await bcrypt.compare('s3cret-pass', hash));   // true\n  console.log(await bcrypt.compare('wrong-pass', hash));    // false\n}\n\nmain();", key: ['know', 'Raise the cost over time as hardware gets faster. Argon2 is a modern alternative.'], short: 'Hashing' }),
    st('TECHNIQUE', 'Guard routes with middleware', ['An auth middleware reads the Authorization header, verifies the token, puts the user on req and calls next. Otherwise it replies 401.', 'Verify the signature and the expiry every time. Never trust a decoded token you did not verify.'], { e: ['e1', 'e3'], hi: ['tok'], read: [['No token', '401'], ['Expired', '401']], code: "function requireAuth(req, res, next) {\n  const header = req.get('Authorization') || '';\n  const token = header.startsWith('Bearer ') ? header.slice(7) : null;\n  if (!token) return res.status(401).json({ error: 'missing token' });\n\n  try {\n    req.user = jwt.verify(token, SECRET);\n    next();\n  } catch {\n    res.status(401).json({ error: 'invalid or expired token' });\n  }\n}\n\napp.get('/me', requireAuth, (req, res) => {\n  res.json({ user: req.user.sub });\n});", key: ['idea', '401 means not logged in. 403 means logged in but not allowed.'], short: 'Guard' }),
    st('TECHNIQUE', 'Cookies need flags', ['httpOnly hides the cookie from page scripts, which limits damage from XSS. secure sends it only over HTTPS. sameSite limits cross-site sending, which helps against CSRF.', 'A session id or token in a cookie with all three flags is safer than one kept in localStorage.'], { add: ['ck'], e: ['e1', 'e4'], hi: ['ck'], read: [['httpOnly', 'no JS access'], ['sameSite', 'less CSRF']], code: "app.post('/login', (req, res) => {\n  res.cookie('sid', 'abc123', {\n    httpOnly: true,       // JavaScript in the page cannot read it\n    secure: true,         // only sent over HTTPS\n    sameSite: 'lax',      // not sent on most cross-site requests\n    maxAge: 60 * 60 * 1000,\n  });\n  res.json({ ok: true });\n});", key: ['know', 'Set a maxAge so a stolen cookie does not live forever.'], short: 'Cookies' }),
    st('TECHNIQUE', 'Headers, CORS and rate limits', ['helmet sets safe response headers. CORS is a browser rule: the server names the origins it allows, and the browser stops pages from other origins reading the reply. Rate limiting slows brute force and abuse.', 'CORS does not protect your API from other servers or curl. It only controls browsers. With one fixed origin the header always names it. With a list, the server answers only for matching origins.'], { add: ['wall'], e: ['e4', 'e5'], hi: ['wall'], read: [['CORS', 'browser only'], ['Too many', '429']], code: "const helmet = require('helmet');\nconst cors = require('cors');\nconst rateLimit = require('express-rate-limit');\n\napp.use(helmet());\napp.use(cors({ origin: 'https://app.example.com' }));\napp.use(rateLimit({ windowMs: 60 * 1000, limit: 3 }));\n\napp.get('/', (req, res) => res.send('ok'));", key: ['warn', 'Never use origin * together with credentials. List the exact origins you trust.'], short: 'Hardening' }),
    st('WATCH OUT', 'Never build queries from strings', ['If user input is glued into SQL text, it can change the query. Pass values separately as parameters so the driver treats them as data.', 'NoSQL has its own version: an object like { $ne: null } sent as a field can bypass a check. Convert or validate the type first. Keep secrets in environment variables, not in git.'], { add: ['inj'], e: ['e5', 'e6'], hi: ['inj'], read: [['Fix', 'parameters'], ['Secrets', 'environment']], code: "const name = \"x' OR '1'='1\";\nconst req = { body: { email: { $ne: null } } };\n\nconst bad = \"SELECT * FROM users WHERE name = '\" + name + \"'\";\nconsole.log(bad);          // SELECT * FROM users WHERE name = 'x' OR '1'='1'\n\nconst good = { text: 'SELECT * FROM users WHERE name = $1', values: [name] };\nconsole.log(good.text);    // the value never becomes SQL text\n\nconst query = { email: String(req.body.email) };\nconsole.log(JSON.stringify(query));   // {\"email\":\"[object Object]\"} so no operator gets through", key: ['warn', 'Parameterised queries stop SQL injection. Validate types to stop operator injection.'], short: 'Injection' }),
    st('RECAP', 'Remember', ['Sessions are simple to revoke, JWTs are stateless. Hash with bcrypt, verify tokens on every request, and use httpOnly, secure and sameSite cookies.', 'Add helmet, an exact CORS list and rate limits. Use query parameters and keep secrets out of code.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'databases', lvl: 3, title: 'Databases from Node', sub: 'Choosing a store, talking to it efficiently, and avoiding the classic slowdowns.', min: 11, diff: 'Intermediate',
  learn: ['SQL versus MongoDB', 'Connection pools', 'Transactions', 'N+1 queries, indexes and migrations'],
  nodes: {
    app: { k: 'cube', p: [-3.8, 0], c: 'blue', g: 'app', t: 'Node app', s: 'handles requests' },
    pool: { k: 'cube', p: [-1.4, -1.8], c: 'purple', g: 'pool', t: 'Connection pool', s: 'reuse connections' },
    sql: { k: 'cube', p: [1.5, -2.2], c: 'amber', g: 'SQL', t: 'SQL database', s: 'tables and joins' },
    mongo: { k: 'cube', p: [1.5, 0.2], c: 'amber', g: 'doc', t: 'MongoDB', s: 'documents' },
    tx: { k: 'cube', p: [4.0, -1.0], c: 'green', g: 'tx', t: 'Transaction', s: 'all or nothing' },
    n1: { k: 'cube', p: [-1.4, 2.0], c: 'red', g: 'N+1', t: 'N+1 queries', s: 'one per row' },
    idx: { k: 'cube', p: [1.6, 2.6], c: 'pink', g: 'idx', t: 'Index', s: 'fast lookups' }
  },
  edges: {
    e1: { a: 'app', b: 'pool', t: 'borrows', pk: true },
    e2: { a: 'pool', b: 'sql', t: 'queries', pk: true },
    e3: { a: 'pool', b: 'mongo', t: 'or', dash: true },
    e4: { a: 'sql', b: 'tx', t: 'BEGIN' },
    e5: { a: 'app', b: 'n1', t: 'loop', dash: true, c: 'red' },
    e6: { a: 'idx', b: 'sql', t: 'speeds up', c: 'teal' },
    s1: { a: 'app', b: 'sql', t: 'SQL', pk: true },
    s2: { a: 'app', b: 'mongo', t: 'or documents', dash: true, bend: 0.3 }
  },
  steps: [
    st('PROBLEM', 'Pick the store that fits the data', ['SQL databases keep related tables with a fixed schema, joins and strong transactions. MongoDB keeps flexible documents that you read and write whole.', 'Choose SQL when data is relational and consistency matters. Choose documents when records are self-contained and the shape changes often.'], { add: ['app', 'sql', 'mongo'], e: ['s1', 's2'], hi: ['sql', 'mongo'], read: [['SQL', 'tables, joins'], ['MongoDB', 'documents']], code: "import { MongoClient } from 'mongodb';\n\nconst client = new MongoClient(process.env.MONGO_URL);\nconst orders = client.db('shop').collection('orders');\n\nawait orders.createIndex({ userId: 1, createdAt: -1 });\nconst recent = await orders\n  .find({ userId })\n  .sort({ createdAt: -1 })\n  .limit(10)\n  .toArray();", key: ['know', 'Neither is better. The access pattern decides.'], short: 'SQL or documents' }),
    st('CONCEPT', 'Pool connections instead of opening one per request', ['Opening a database connection is slow, and a database accepts only so many. A pool keeps a few open and lends one to each query.', 'Create one pool at startup and share it. The pool size should stay below what the database can serve across all your instances.'], { add: ['pool'], e: ['e1', 'e2', 'e3'], hi: ['pool'], read: [['Pool', 'one per process']], code: "const { Pool } = require('pg');\n\n// One pool for the whole process, not one connection per request.\nconst pool = new Pool({ connectionString: process.env.DATABASE_URL, max: 10 });\n\nasync function getUser(id) {\n  const { rows } = await pool.query('SELECT id, name FROM users WHERE id = $1', [id]);\n  return rows[0] ?? null;\n}", key: ['warn', 'A new connection inside every request handler is a fast way to take a database down.'], short: 'Pooling' }),
    st('TECHNIQUE', 'Transactions keep changes all or nothing', ['A transaction groups statements. Either every one is saved on COMMIT or none are after ROLLBACK.', 'Check out one client from the pool, run BEGIN, COMMIT or ROLLBACK on that same client, and always release it in finally.'], { add: ['tx'], e: ['e1', 'e2', 'e4'], hi: ['tx'], read: [['Failure', 'ROLLBACK']], code: "async function transfer(from, to, amount) {\n  const client = await pool.connect();\n  try {\n    await client.query('BEGIN');\n    await client.query('UPDATE accounts SET balance = balance - $1 WHERE id = $2', [amount, from]);\n    await client.query('UPDATE accounts SET balance = balance + $1 WHERE id = $2', [amount, to]);\n    await client.query('COMMIT');\n  } catch (err) {\n    await client.query('ROLLBACK');\n    throw err;\n  } finally {\n    client.release();      // always give the connection back to the pool\n  }\n}", key: ['know', 'Use the same client for the whole transaction. Pool.query may use a different connection each time.'], short: 'Transactions' }),
    st('WATCH OUT', 'The N+1 trap', ['A loop that runs one query per row turns one request into dozens. It looks fine with ten rows and crawls with ten thousand.', 'Fetch what you need in one query with a join, or with WHERE id IN (...). ORMs hide this, so watch the query log.'], { rm: ['tx', 'mongo'], add: ['n1'], e: ['e1', 'e2', 'e5'], hi: ['n1'], read: [['Naive', '21 queries'], ['Join', '1 query']], code: "// N+1: one query for the list, then one more query per row\nconst posts = await db.query('SELECT * FROM posts LIMIT 20');\nfor (const post of posts) {\n  post.author = (await db.query('SELECT * FROM users WHERE id = ?', [post.user_id]))[0].name;\n}\n\n// Fix: one query with a join\nconst rows = await db.query(\n  'SELECT posts.*, users.name AS author FROM posts JOIN users ON users.id = posts.user_id LIMIT 20'\n);", key: ['warn', 'If response time grows with the number of rows, suspect N+1 first.'], short: 'N+1' }),
    st('TECHNIQUE', 'Indexes make lookups cheap', ['Without an index the database reads every row. With one it jumps straight to matching rows, like a book index.', 'Index the columns you filter and sort by. A composite index on (user_id, created_at) serves filtering by user and ordering by date.'], { rm: ['n1'], add: ['idx'], e: ['e1', 'e2', 'e6'], hi: ['idx'], read: [['Read', 'much faster'], ['Write', 'slightly slower']], code: "CREATE INDEX idx_orders_user_created ON orders (user_id, created_at DESC);\n\n-- The query this index serves:\nSELECT * FROM orders WHERE user_id = 7 ORDER BY created_at DESC LIMIT 10;", key: ['know', 'Every index costs space and slows writes. Add them for real queries, not for every column.'], short: 'Indexes' }),
    st('TECHNIQUE', 'Migrations and ORMs', ['A migration is a numbered script that changes the schema. Keep them in git and run them in order on every environment.', 'An ORM maps rows to objects and saves boilerplate. A query builder stays closer to SQL. Whichever you pick, learn the SQL it generates.'], { e: ['e1', 'e2', 'e6'], hi: ['sql'], read: [['Rule', 'never edit an old migration']], code: "-- 002_add_email.sql  (committed to git, run once per environment, never edited afterwards)\nALTER TABLE users ADD COLUMN email TEXT;\nCREATE UNIQUE INDEX users_email_idx ON users (email);", key: ['idea', 'Schema changes are code. Review them, version them and make them repeatable.'], short: 'Migrations' }),
    st('RECAP', 'Remember', ['Pick SQL or documents by access pattern, share one pool per process, and wrap related writes in a transaction.', 'Avoid N+1 with joins, index what you filter and sort by, and keep schema changes in migrations.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'caching-redis', lvl: 3, title: 'Caching with Redis', sub: 'Keep answers you already worked out in fast memory, and know when they go stale.', min: 10, diff: 'Intermediate',
  learn: ['Cache-aside reads', 'TTL and invalidation', 'Stampedes and jitter', 'Sessions and pub/sub'],
  nodes: {
    app: { k: 'cube', p: [-3.8, 0], c: 'blue', g: 'app', t: 'Node app', s: 'asks for data' },
    cache: { k: 'cube', p: [-0.6, -1.6], c: 'amber', g: 'RAM', t: 'Redis cache', s: 'in memory' },
    db: { k: 'cube', p: [2.2, 0], c: 'amber', g: 'DB', t: 'Database', s: 'source of truth' },
    ttl: { k: 'cube', p: [2.4, -2.6], c: 'pink', g: 'TTL', t: 'TTL', s: 'expires on its own' },
    stale: { k: 'cube', p: [-0.6, 1.6], c: 'red', g: 'old', t: 'Stale data', s: 'copy is out of date' },
    stamp: { k: 'cube', p: [2.2, 2.6], c: 'red', g: 'herd', t: 'Stampede', s: 'many misses at once' },
    pub: { k: 'cube', p: [4.3, 1.0], c: 'purple', g: 'pub', t: 'Pub/Sub', s: 'broadcast messages' }
  },
  edges: {
    e1: { a: 'app', b: 'cache', t: 'GET key', pk: true },
    e2: { a: 'app', b: 'db', t: 'on a miss', dash: true, bend: 0.3 },
    e3: { a: 'db', b: 'cache', t: 'SET with EX', pk: true },
    e4: { a: 'ttl', b: 'cache', t: 'expires', dash: true, c: 'teal' },
    e5: { a: 'stale', b: 'cache', t: 'DEL key', dash: true, c: 'red' },
    e6: { a: 'stamp', b: 'db', t: 'all at once', dash: true, c: 'red' },
    e7: { a: 'cache', b: 'pub', t: 'channels', pk: true }
  },
  steps: [
    st('PROBLEM', 'The same answer, asked again and again', ['Many requests ask for the same thing: a product page, a profile, a config. Hitting the database every time wastes work and adds delay.', 'A cache keeps recent answers in memory next to your app. Redis is the usual choice.'], { add: ['app', 'cache', 'db'], e: ['e1', 'e2'], hi: ['cache'], read: [['Redis', 'in-memory store']], key: ['idea', 'Cache what is read often and changes rarely.'], short: 'Why cache' }),
    st('CONCEPT', 'Cache-aside: look, then load, then keep', ['The app checks the cache first. On a hit it returns at once. On a miss it reads the database, stores the result with an expiry and returns it.', 'The app owns the logic. The cache never talks to the database by itself.'], { e: ['e1', 'e2', 'e3'], hi: ['cache', 'db'], read: [['Hit', 'from memory'], ['Miss', 'load and save']], code: "async function getUser(id) {\n  const key = 'user:' + id;\n  const cached = await redis.get(key);\n  if (cached) return JSON.parse(cached);                    // hit\n\n  const user = await db.findUser(id);                       // miss: ask the database\n  await redis.set(key, JSON.stringify(user), { EX: 60 });   // keep it for 60 seconds\n  return user;\n}", key: ['know', 'Cache-aside is the most common pattern and the one interviewers expect you to name.'], short: 'Cache-aside' }),
    st('TECHNIQUE', 'A TTL limits staleness; invalidation fixes it now', ['The EX option gives each key a time to live. After it, Redis deletes the key and the next read refills it.', 'When you change the source data, delete the cached key so readers do not see the old copy until the TTL ends.'], { add: ['ttl', 'stale'], e: ['e1', 'e3', 'e4', 'e5'], hi: ['ttl', 'stale'], read: [['After a write', 'DEL the key']], code: "async function updateUser(id, changes) {\n  const user = await db.updateUser(id, changes);\n  await redis.del('user:' + id);      // drop the stale copy; the next read refills it\n  return user;\n}", key: ['warn', 'There are only two hard things in computer science: cache invalidation and naming things. Plan for it early.'], short: 'TTL and DEL' }),
    st('WATCH OUT', 'A stampede hits the database', ['When a popular key expires, many requests miss at once and all hit the database together.', 'Let the first request do the work and share its result with the others. Add random jitter to TTLs so keys do not all expire at the same moment.'], { rm: ['ttl'], add: ['stamp'], e: ['e1', 'e3', 'e6'], hi: ['stamp'], read: [['Fix', 'share one lookup + jitter']], code: "const inflight = new Map();\n\nfunction getUserOnce(id) {\n  if (inflight.has(id)) return inflight.get(id);            // share the lookup already running\n  const promise = getUser(id).finally(() => inflight.delete(id));\n  inflight.set(id, promise);\n  return promise;\n}\n\n// Spread expiry times so hot keys do not all expire together.\nfunction ttlWithJitter(base = 60) {\n  return base + Math.floor(Math.random() * 30);\n}", key: ['warn', 'This in-process version protects one instance. Across many instances use a short Redis lock too.'], short: 'Stampede' }),
    st('TECHNIQUE', 'Keep sessions in Redis', ['If sessions live in each server memory, a user on another instance looks logged out and a restart logs everyone out.', 'A shared Redis session store fixes both. The cookie holds only the session id.'], { rm: ['stale', 'stamp'], e: ['e1'], hi: ['cache'], read: [['Cookie', 'session id only']], code: "const session = require('express-session');\nconst { RedisStore } = require('connect-redis');\n\napp.use(session({\n  store: new RedisStore({ client: redis }),\n  secret: process.env.SESSION_SECRET,\n  resave: false,\n  saveUninitialized: false,\n  cookie: { httpOnly: true, secure: true, sameSite: 'lax' },\n}));", key: ['know', 'Set saveUninitialized to false so bots do not create thousands of empty sessions.'], short: 'Sessions' }),
    st('TECHNIQUE', 'Pub/sub broadcasts messages', ['Redis can also pass messages. A publisher sends to a channel and every subscriber gets it right away.', 'It is fire and forget: if a subscriber is offline it misses the message. Use it for live updates and cache-invalidation signals, not for jobs that must not be lost.'], { add: ['pub'], e: ['e1', 'e7'], hi: ['pub'], read: [['Delivery', 'no replay']], code: "const subscriber = redis.duplicate();\nawait subscriber.connect();\n\nawait subscriber.subscribe('user-updates', (message) => {\n  console.log('received:', message);\n});\n\nawait redis.publish('user-updates', 'user:7 changed');", key: ['warn', 'Need guaranteed delivery? Use a real queue or Redis streams instead of pub/sub.'], short: 'Pub/sub' }),
    st('RECAP', 'Remember', ['Cache-aside: check, load on a miss, store with a TTL. Delete the key when the data changes.', 'Share one lookup and add jitter against stampedes, keep sessions in Redis, and use pub/sub only where lost messages are acceptable.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'testing', lvl: 4, title: 'Testing Node Apps', sub: 'Small fast tests, a few real ones, and how to fake the slow parts.', min: 9, diff: 'Intermediate',
  learn: ['Why manual checking fails', 'Unit tests with node:test', 'Mocks and stubs for slow parts', 'HTTP tests with supertest and async traps'],
  nodes: {
    dev: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'you', t: 'Developer', s: 'clicks around' },
    test: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'T', t: 'Test', s: 'calls the code' },
    app: { k: 'cube', p: [0, 0], c: 'purple', g: 'fn', t: 'Handler', s: 'your logic' },
    res: { k: 'cube', p: [3.4, 1.8], c: 'green', g: 'ok', t: 'Pass', s: 'assert matched' },
    fake: { k: 'cube', p: [3.4, -1.8], c: 'pink', g: 'fake', t: 'Fake database', s: 'canned answers' },
    bad: { k: 'cube', p: [0, 2.8], c: 'red', g: '!', t: 'Test ends early', s: 'assert never counted' },
    p1: { k: 'cube', p: [-3.4, 1.6], c: 'green', g: 'many', t: 'Unit tests', s: 'many, fast' },
    p2: { k: 'cube', p: [0, 0], c: 'blue', g: 'some', t: 'Integration tests', s: 'some, real parts' },
    p3: { k: 'cube', p: [3.4, -1.6], c: 'amber', g: 'few', t: 'End-to-end tests', s: 'few, slow' }
  },
  edges: {
    m1: { a: 'dev', b: 'app', t: 'click and hope', dash: true, c: 'red' },
    u1: { a: 'test', b: 'app', t: 'call', pk: true },
    u2: { a: 'app', b: 'res', t: 'returns', pk: true },
    f1: { a: 'app', b: 'fake', t: 'asks', pk: true },
    s1: { a: 'test', b: 'app', t: 'GET /health', pk: true },
    s2: { a: 'app', b: 'res', t: '200 and JSON', pk: true },
    b1: { a: 'test', b: 'bad', t: 'no await', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'Clicking around does not scale', ['You change one function and have to re-check every feature by hand. You forget a case, and the bug ships.', 'A test is code that checks your code and tells you in seconds.'], { add: ['dev', 'app'], e: ['m1'], hi: ['dev'], read: [['checked by', 'a tired human']], key: ['warn', 'Untested code is code you are afraid to change.'], short: 'The catch' }),
    st('CONCEPT', 'A unit test calls one piece', ['Node has a built-in runner: node:test. No install needed. Run it with node --test.', 'A unit test calls one function with known input and asserts the output. It touches no network or disk, so it runs in milliseconds.'], { rm: ['dev'], add: ['test', 'res'], e: ['u1', 'u2'], hi: ['test'], code: N3("import test from 'node:test';", "import assert from 'node:assert/strict';", "", "export const total = (items) => items.reduce((s, i) => s + i.price * i.qty, 0);", "", "test('total adds price times quantity', () => {", "  assert.equal(total([{ price: 5, qty: 2 }, { price: 1, qty: 3 }]), 13);", "});"), key: ['idea', 'Use node:assert/strict so equal means ===. The loose version coerces types.'], short: 'Unit test' }),
    st('TECHNIQUE', 'Fake the slow parts', ['A real database makes tests slow and flaky. Pass the dependency in, and in the test hand over a fake.', 'A mock records how it was called. A stub just returns canned answers. mock.fn() from node:test gives you both.'], { add: ['fake'], e: ['u1', 'u2', 'f1'], hi: ['fake'], code: N3("import test, { mock } from 'node:test';", "import assert from 'node:assert/strict';", "", "const getUser = async (db, id) => (await db.find(id)) ?? { name: 'guest' };", "", "test('falls back to guest', async () => {", "  const db = { find: mock.fn(async () => null) };", "  assert.deepEqual(await getUser(db, 7), { name: 'guest' });", "  assert.equal(db.find.mock.callCount(), 1);", "});"), key: ['know', 'Passing dependencies as arguments is what makes code easy to test. Hard-wired imports are hard to fake.'], short: 'Mocks' }),
    st('TECHNIQUE', 'Test the HTTP layer with supertest', ['An integration test drives the real Express app: routing, middleware and JSON together.', 'supertest calls the app directly. It does not need a free port, and it works with await.'], { rm: ['fake'], set: { test: { t: 'supertest', s: 'fake HTTP request' }, app: { t: 'Express app', s: 'real routes' } }, e: ['s1', 's2'], hi: ['test', 'app'], code: N3("import test from 'node:test';", "import assert from 'node:assert/strict';", "import request from 'supertest';", "import express from 'express';", "", "const app = express();", "app.get('/health', (req, res) => res.json({ ok: true }));", "", "test('GET /health', async () => {", "  const res = await request(app).get('/health');", "  assert.equal(res.status, 200);", "  assert.deepEqual(res.body, { ok: true });", "});"), key: ['tip', 'Export app from one file and call listen() in another. Then tests can import the app without starting a server.'], short: 'supertest' }),
    st('WATCH OUT', 'Async tests need await', ['If a test starts async work and does not return or await it, the test ends before the assertion runs. node:test marks that test as passed, then reports the late failure as a separate error, so the blame lands in the wrong place.', 'Make the test function async and await everything, or return the promise.'], { add: ['bad'], e: ['b1'], hi: ['bad'], code: N3("import test from 'node:test';", "import assert from 'node:assert/strict';", "", "const later = () => new Promise((r) => setTimeout(() => r(2), 20));", "", "// wrong: nothing is awaited", "test('forgot await', () => {", "  later().then((v) => assert.equal(v, 99));", "});", "", "// right", "test('awaited', async () => {", "  assert.equal(await later(), 2);", "});"), key: ['warn', 'A test that never awaits shows a green tick while its real check fails later, somewhere else. Always await.'], short: 'Async trap' }),
    st('CONCEPT', 'The test pyramid', ['Many unit tests at the bottom: fast and cheap. Some integration tests in the middle. A few end-to-end tests on top: slow, but they prove the whole system works.', 'Put a test script in package.json so everyone and CI run the same command.'], { rm: ['test', 'res', 'app', 'bad'], add: ['p1', 'p2', 'p3'], hi: ['p1'], code: JSON.stringify({ scripts: { test: 'node --test' } }, null, 2), key: ['idea', 'If most of your tests are slow end-to-end ones, the suite gets ignored. Keep the base wide.'], short: 'Pyramid' }),
    st('RECAP', 'What to remember', ['Unit tests: one function, no I/O. Integration tests: real app through supertest. Fake slow dependencies by passing them in.', 'Await every async step in a test, and run the whole suite with one npm test.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'logging-config', lvl: 4, title: 'Logging and Config', sub: 'Logs a machine can search, and settings that never live in your code.', min: 9, diff: 'Intermediate',
  learn: ['Structured logs instead of text', 'Levels and correlation ids', 'Config from environment variables', 'Fail fast and never log secrets'],
  nodes: {
    req: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'req', t: 'Request', s: 'comes in' },
    svc: { k: 'cube', p: [0, 0], c: 'purple', g: 'app', t: 'Service', s: 'your Node app' },

  steps: [
    st('PROBLEM', 'Plain text logs are hard to search', ['console.log("user 42 paid 9.99 in 18ms") is easy to read once and hard to query a million times.', 'To find every slow payment you would be writing regular expressions.'], { add: ['req', 'svc', 'logf'], e: ['c1', 'p1'], hi: ['logf'], read: [['format', 'free text']], key: ['warn', 'If you cannot filter logs by field, you cannot answer questions during an outage.'], short: 'The catch' }),
    st('CONCEPT', 'Log one JSON object per line', ['Write each event as a single JSON line with named fields: level, message, ids and timings.', 'Log tools can then filter by orderId or ms without guessing at text.'], { rm: ['req'], add: ['json'], e: ['p2'], hi: ['json'], code: N3("const log = (level, msg, extra = {}) =>", "  console.log(JSON.stringify({ time: Date.now(), level, msg, ...extra }));", "", "log('info', 'order created', { orderId: 42, ms: 18 });"), key: ['idea', 'In real apps use a library such as pino. It does the same job, but faster.'], short: 'Structured' }),
    st('TECHNIQUE', 'Use levels, and set them from config', ['Levels: debug, info, warn, error. In production you usually show info and above, so noisy debug lines are skipped.', 'Read the minimum level from an environment variable so you can raise detail without a deploy.'], { add: ['lvl'], e: ['l1'], hi: ['lvl'], code: N3("const LEVELS = { debug: 10, info: 20, warn: 30, error: 40 };", "const min = LEVELS[process.env.LOG_LEVEL ?? 'info'];", "const log = (level, msg) => { if (LEVELS[level] >= min) console.log(level, msg); };", "", "log('debug', 'cache miss');", "log('info', 'started');", "log('error', 'db down');"), key: ['know', 'Logging too much costs money and hides the important lines. Choose levels on purpose.'], short: 'Levels' }),
    st('TECHNIQUE', 'Tag every line with a correlation id', ['Many requests run at once, so their log lines interleave. Give each request an id and put it on every line.', 'AsyncLocalStorage keeps that id available across awaits without passing it through every function.'], { add: ['req', 'cid'], e: ['c1', 'c2'], hi: ['cid'], code: N3("import { AsyncLocalStorage } from 'node:async_hooks';", "", "const als = new AsyncLocalStorage();", "const log = (msg) => console.log(als.getStore()?.id, msg);", "", "const handle = (id) => als.run({ id }, async () => {", "  log('start');", "  await new Promise((r) => setTimeout(r, 5));", "  log('end');", "});", "", "await Promise.all([handle('req-1'), handle('req-2')]);"), key: ['tip', 'Pass the id on to other services in a header too. One id then follows the request across the system.'], short: 'Correlation' }),
    st('CONCEPT', 'Config comes from the environment', ['Twelve-factor apps keep settings out of the code: ports, database URLs and keys come from environment variables. The same build runs in dev, test and production.', 'Read and check them once at startup. If something is missing, stop right away instead of failing later in a request.'], { rm: ['req', 'cid', 'json', 'lvl'], add: ['env', 'cfg'], e: ['e1', 'e2'], hi: ['env', 'cfg'], code: N3("const need = ['DATABASE_URL', 'JWT_SECRET'];", "const missing = need.filter((k) => !process.env[k]);", "if (missing.length) {", "  console.error('Missing env: ' + missing.join(', '));", "  process.exit(1);", "}", "", "export const config = {", "  port: Number(process.env.PORT ?? 3000),", "  dbUrl: process.env.DATABASE_URL,", "};"), key: ['know', 'Env values are always strings. Convert numbers and booleans yourself, as the port line does.'], short: 'Config' }),
    st('WATCH OUT', 'Never log secrets', ['Passwords, tokens and API keys end up in log files that many people can read. Redact them before logging objects.', 'Do not commit .env files either. Keep a .env.example with fake values.'], { rm: ['env'], add: ['sec', 'logf'], e: ['s1'], hi: ['sec'], code: N3("const redact = (o) => JSON.parse(JSON.stringify(o, (k, v) =>", "  /pass|token|secret|key/i.test(k) ? '[redacted]' : v));", "", "console.log(redact({ user: 'ana', password: 'x', apiKey: 'y' }));"), key: ['warn', 'Logging a whole request body or headers object is the usual way secrets leak.'], short: 'Secrets' }),
    st('RECAP', 'What to remember', ['Log JSON with levels and a correlation id. Read config from env vars and validate it at startup.', 'Redact secrets and never commit them.'], { hi: [], short: 'Recap' })

});

lesson({
  id: 'performance', lvl: 4, title: 'Performance and Memory', sub: 'Keep the event loop free, ask the database fewer questions, and stop memory growing.', min: 10, diff: 'Intermediate',
  learn: ['Why a blocked loop hurts everyone', 'Batching, chunking and caching', 'Heap and garbage collection', 'Common leaks and profiling'],
  nodes: {
    ra: { k: 'cube', p: [-3.4, -1.6], c: 'blue', g: 'A', t: 'Request A', s: 'heavy loop' },
    rb: { k: 'cube', p: [-3.4, 1.6], c: 'blue', g: 'B', t: 'Request B', s: 'tiny, waits' },
    loop: { k: 'hex', p: [0, 0], c: 'purple', g: 'loop', t: 'Event loop', s: 'one thread', r: 38, h: 34 },
    stuck: { k: 'cube', p: [3.4, 0], c: 'red', g: '!', t: 'Blocked', s: 'everything waits' },
    chunk: { k: 'cube', p: [3.4, 0], c: 'green', g: 'ok', t: 'Chunks', s: 'others get a turn' },
    db: { k: 'cube', p: [3.4, 1.8], c: 'amber', g: 'DB', t: 'Database', s: 'the slow part' },
    cache: { k: 'cube', p: [0, -2.6], c: 'pink', g: 'TTL', t: 'Cache', s: 'answers kept in memory' },
    heap: { k: 'cube', p: [0, 2.6], c: 'amber', g: 'heap', t: 'Heap', s: 'objects live here' },
    leak: { k: 'cube', p: [3.4, -2.2], c: 'red', g: 'ref', t: 'Leaked list', s: 'still referenced' }
  },
  edges: {
    a1: { a: 'ra', b: 'loop', t: 'sync loop', c: 'red', pk: true },
    b1: { a: 'rb', b: 'loop', t: 'waiting', dash: true, c: 'red' },
    l1: { a: 'loop', b: 'stuck', t: 'cannot run', dash: true, c: 'red' },
    c1: { a: 'loop', b: 'chunk', t: 'setImmediate', pk: true },
    q1: { a: 'loop', b: 'db', t: 'one query each', c: 'red', dash: true },
    q2: { a: 'loop', b: 'db', t: 'one batched query', pk: true },
    k1: { a: 'loop', b: 'cache', t: 'check first', pk: true },
    h1: { a: 'loop', b: 'heap', t: 'allocates', pk: true },
    h2: { a: 'leak', b: 'heap', t: 'never freed', c: 'red', dash: true }
  },
  steps: [
    st('PROBLEM', 'One slow request blocks everyone', ['Node runs your JavaScript on one thread. A long synchronous loop in one request stops all the others, even tiny ones.', 'The server looks frozen, but the CPU is simply busy with one job.'], { add: ['ra', 'rb', 'loop', 'stuck'], e: ['a1', 'b1', 'l1'], hi: ['stuck'], code: N3("const t0 = Date.now();", "setTimeout(() => console.log('timer fired after', Date.now() - t0 >= 300 ? '300ms+' : 'on time'), 0);", "while (Date.now() - t0 < 300) {}   // blocks the loop"), key: ['warn', 'The timer asked for 0 ms, but it ran only after the loop finished.'], short: 'The catch' }),
    st('TECHNIQUE', 'Break big jobs into chunks', ['Do a slice of the work, then call setImmediate so waiting requests get a turn, then continue.', 'For truly heavy CPU work, move it to a worker thread instead. The next lessons cover that.'], { rm: ['stuck', 'ra'], add: ['chunk'], e: ['b1', 'c1'], hi: ['chunk'], code: N3("const items = Array.from({ length: 1e6 }, (_, i) => i);", "let sum = 0, i = 0;", "const step = () => {", "  const end = Math.min(i + 1e5, items.length);", "  for (; i < end; i++) sum += items[i];", "  if (i < items.length) setImmediate(step);", "  else console.log('sum', sum);", "};", "step();"), key: ['idea', 'JSON.parse on a huge string, big regex and sync file calls also block. Watch for them.'], short: 'Chunking' }),
    st('CONCEPT', 'The N+1 query problem', ['Loading 100 users and then asking for each user\'s posts one by one is 101 queries. Each one waits on the network.', 'Fetch the posts for all ids in a single query, and the cost stays flat as the list grows.'], { rm: ['chunk', 'rb'], add: ['db'], e: ['q1', 'q2'], hi: ['db'], code: N3("let queries = 0;", "const db = {", "  users: async () => (queries++, [1, 2, 3]),", "  posts: async (id) => (queries++, [id]),", "  postsFor: async (ids) => (queries++, ids),", "};", "", "const slow = async () => { for (const u of await db.users()) await db.posts(u); };", "const fast = async () => db.postsFor(await db.users());", "", "await slow(); console.log('N+1 queries:', queries); queries = 0;", "await fast(); console.log('batched queries:', queries);"), key: ['know', 'In SQL this is a JOIN or WHERE id IN (...). ORMs call it eager loading.'], short: 'N+1' }),
    st('TECHNIQUE', 'Cache answers you reuse', ['If many requests need the same slow result, keep it in memory for a short time. This is a TTL cache.', 'For several servers, use a shared cache such as Redis. Also turn on gzip or brotli compression for text responses.'], { add: ['cache'], e: ['k1'], hi: ['cache'], code: N3("const cache = new Map();", "const cached = async (key, ttlMs, load) => {", "  const hit = cache.get(key);", "  if (hit && hit.exp > Date.now()) return hit.value;", "  const value = await load();", "  cache.set(key, { value, exp: Date.now() + ttlMs });", "  return value;", "};", "", "let loads = 0;", "const load = async () => ++loads;", "await cached('a', 1000, load);", "await cached('a', 1000, load);", "console.log('loads:', loads);"), key: ['warn', 'Caches go stale. Pick a TTL you can live with, and cap the size or the cache itself becomes a leak.'], short: 'Caching' }),
    st('CONCEPT', 'Memory: the heap and the garbage collector', ['Objects live on the heap. The garbage collector frees an object only when nothing can reach it any more.', 'A memory leak in Node is almost always an object that something still references, so it can never be freed.'], { rm: ['ra', 'db', 'cache', 'rb'], add: ['heap'], e: ['h1'], hi: ['heap'], code: N3("const leaks = [];", "const before = process.memoryUsage().heapUsed;", "for (let i = 0; i < 1e5; i++) leaks.push({ i, data: 'x'.repeat(100) });", "const grew = process.memoryUsage().heapUsed - before;", "console.log('heap grew:', grew > 1e6 ? 'yes' : 'no');"), key: ['idea', 'Check with process.memoryUsage(), or run node --inspect and use the Chrome DevTools Memory tab.'], short: 'Heap' }),
    st('WATCH OUT', 'The usual leaks', ['Global arrays and Maps that only grow, caches with no limit, timers never cleared, and event listeners added on every request but never removed.', 'Node warns you about the last one after 10 listeners on one event.'], { add: ['leak'], e: ['h2'], hi: ['leak'], code: N3("import { EventEmitter } from 'node:events';", "", "const e = new EventEmitter();", "process.on('warning', (w) => console.log(w.name));", "", "for (let i = 0; i < 11; i++) e.on('tick', () => {});"), key: ['warn', 'Find slow code first by measuring. node --cpu-prof or the DevTools profiler show where the time goes, so do not guess.'], short: 'Leaks' }),
    st('RECAP', 'What to remember', ['Never block the loop: chunk the work or use a worker. Batch queries to avoid N+1. Cache with a TTL and a size cap.', 'Leaks are objects still referenced. Measure with a profiler before you optimise.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'cluster-workers', lvl: 5, title: 'Cluster and Worker Threads', sub: 'Use every CPU core: processes for requests, threads for heavy computing.', min: 10, diff: 'Advanced',
  learn: ['Why one process uses one core', 'Cluster, worker threads and child processes', 'Message passing with workers', 'What does not get shared'],
  nodes: {
    req: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'req', t: 'Requests', s: 'many at once' },

  },
  edges: {

    h1: { a: 'main', b: 'cpu', t: 'runs inline', dash: true, c: 'red' },
    w1: { a: 'main', b: 'wt', t: 'postMessage', pk: true },
    w2: { a: 'wt', b: 'res', t: 'message back', pk: true },
    k1: { a: 'req', b: 'cw', t: 'balanced', pk: true },

    x1: { a: 'main', b: 'cp', t: 'spawn', pk: true },
    m1: { a: 'mem', b: 'cw', t: 'not shared', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'One process, one core', ['A Node process runs your JavaScript on one thread, so it uses one CPU core even on a 16-core machine.', 'Heavy computing on that thread also blocks every request waiting behind it.'], { add: ['req', 'main', 'cpu'], e: ['r1', 'h1'], hi: ['cpu'], read: [['cores used', '1']], key: ['warn', 'I/O-bound work (network, disk) is fine on one thread. CPU-bound work is the problem.'], short: 'The catch' }),
    st('CONCEPT', 'Three tools, three jobs', ['worker_threads: threads inside one process, each with its own event loop. Best for CPU-heavy work.', 'cluster: several copies of your server as separate processes sharing one port. Best to use all cores for requests. child_process: run another program.'], { add: ['wt', 'cp'], hi: ['wt', 'cp'], key: ['idea', 'Rule of thumb: heavy calculation, use a worker thread. More request capacity, use cluster or run more containers.'], short: 'Which tool' }),
    st('TECHNIQUE', 'Worker threads talk by messages', ['The main thread sends data with postMessage and gets an answer back through an event. The worker does the slow calculation without blocking the main loop.', 'Data is copied between threads. SharedArrayBuffer can share memory when you really need it.'], { rm: ['cpu', 'cp'], add: ['res'], e: ['r1', 'w1', 'w2'], hi: ['wt', 'res'], code: N3("import { Worker, isMainThread, parentPort, workerData } from 'node:worker_threads';", "", "if (isMainThread) {", "  const w = new Worker(new URL(import.meta.url), { workerData: 35 });", "  w.on('message', (n) => console.log('fib(35) =', n));", "} else {", "  const fib = (n) => (n < 2 ? n : fib(n - 1) + fib(n - 2));", "  parentPort.postMessage(fib(workerData));", "}"), key: ['know', 'Creating a thread costs time. For many small jobs, keep a pool of workers instead of starting one per job.'], short: 'Worker threads' }),
    st('TECHNIQUE', 'Cluster: one worker per core', ['The primary process forks workers. They all listen on the same port, and the system spreads connections across them.', 'If a worker crashes, the primary notices and forks a new one.'], { rm: ['wt', 'res'], add: ['cw'], e: ['k1', 'k2'], hi: ['cw'], code: N3("import cluster from 'node:cluster';", "import http from 'node:http';", "import { availableParallelism } from 'node:os';", "", "if (cluster.isPrimary) {", "  const n = Math.min(availableParallelism(), 2);", "  for (let i = 0; i < n; i++) cluster.fork();", "  cluster.on('exit', () => cluster.fork());   // replace a dead worker", "} else {", "  http.createServer((req, res) => res.end('pid ' + process.pid)).listen(3000);", "}"), key: ['tip', 'In containers, many people skip cluster and run several container copies behind a load balancer instead.'], short: 'Cluster' }),
    st('WATCH OUT', 'Processes do not share memory', ['Each cluster worker has its own variables. A counter, session map or cache kept in a variable is different in every process.', 'Keep shared state in a database or Redis.'], { add: ['mem'], e: ['m1'], hi: ['mem'], code: N3("let hits = 0;   // lives inside ONE process", "app.get('/', (req, res) => res.send(String(++hits)));"), key: ['warn', 'Sticky sessions and in-memory login state break the moment you run a second process.'], short: 'Not shared' }),
    st('TECHNIQUE', 'child_process runs other programs', ['Use it to run a command-line tool or another script and read what it prints.', 'Prefer execFile with an argument list. Building a shell command string from user input invites command injection.'], { rm: ['mem', 'cw'], add: ['cp'], e: ['x1'], hi: ['cp'], code: N3("import { execFile } from 'node:child_process';", "import { promisify } from 'node:util';", "", "const { stdout } = await promisify(execFile)(process.execPath, ['-e', 'console.log(21 * 2)']);", "console.log(stdout.trim());"), key: ['warn', 'exec() runs a shell. Never pass user input to it. Use execFile or spawn with an array.'], short: 'child_process' }),
    st('RECAP', 'What to remember', ['worker_threads for CPU work, cluster (or more containers) for request capacity, child_process for other programs.', 'Workers talk by messages and do not share variables.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'queues-ratelimit', lvl: 5, title: 'Queues, Jobs and Rate Limiting', sub: 'Do slow work later, retry safely, and protect your server from floods.', min: 11, diff: 'Advanced',
  learn: ['Why slow work leaves the request', 'Retries with backoff and idempotency', 'A token-bucket rate limiter', 'Shutting down without dropping work'],
  nodes: {
    req: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'req', t: 'Request', s: 'sign up' },
    web: { k: 'cube', p: [0, 0], c: 'purple', g: 'web', t: 'Web server', s: 'answers fast' },
    mail: { k: 'cube', p: [3.4, 0], c: 'red', g: 'slow', t: 'Email sender', s: 'slow, can fail' },

  },
  edges: {

    a2: { a: 'web', b: 'mail', t: 'wait for it', dash: true, c: 'red' },
    j1: { a: 'web', b: 'jq', t: 'add job', pk: true },
    j2: { a: 'jq', b: 'wk', t: 'pull', pk: true },
    r1: { a: 'wk', b: 'retry', t: 'on failure', dash: true },

  },
  steps: [
    st('PROBLEM', 'Slow work inside the request', ['Sending an email or resizing an image inside the request makes the user wait. If it fails, the work is lost.', 'The web server should answer fast and hand the slow job to someone else.'], { add: ['req', 'web', 'mail'], e: ['a1', 'a2'], hi: ['mail'], read: [['user waits', 'seconds']], key: ['warn', 'A slow or failing helper should never slow down or break the request itself.'], short: 'The catch' }),
    st('CONCEPT', 'A job queue decouples them', ['The web server adds a job to a queue and replies right away. A separate worker pulls jobs and does the slow part.', 'Real systems use Redis (BullMQ), RabbitMQ or SQS. This tiny in-memory version shows the idea.'], { rm: ['mail', 'req'], add: ['jq', 'wk'], e: ['j1', 'j2'], hi: ['jq', 'wk'], code: N3("const queue = [];", "const add = (job) => queue.push(job);", "const worker = async () => {", "  while (queue.length) {", "    const job = queue.shift();", "    console.log('done', job.id);", "  }", "};", "", "add({ id: 1 }); add({ id: 2 });", "await worker();"), key: ['know', 'An in-memory queue is lost when the process dies. Real queues store jobs durably.'], short: 'Job queue' }),
    st('TECHNIQUE', 'Retry with exponential backoff and jitter', ['When a job fails, wait and try again. Double the wait each time, and add randomness (jitter) so many failing jobs do not retry at the same instant.', 'Stop after a maximum number of tries and park the job somewhere you can inspect.'], { add: ['retry'], e: ['j2', 'r1'], hi: ['retry'], code: N3("const sleep = (ms) => new Promise((r) => setTimeout(r, ms));", "", "export async function retry(fn, tries = 4, base = 100) {", "  for (let i = 0; ; i++) {", "    try { return await fn(); }", "    catch (err) {", "      if (i + 1 >= tries) throw err;", "      await sleep(Math.random() * base * 2 ** i);   // full jitter", "    }", "  }", "}", "", "let calls = 0;", "const flaky = async () => {", "  if (++calls < 3) throw new Error('boom');", "  return 'ok after ' + calls;", "};", "console.log(await retry(flaky));"), key: ['warn', 'Only retry things that are safe to repeat, and never retry forever.'], short: 'Backoff' }),
    st('TECHNIQUE', 'Make jobs idempotent', ['Retries and at-least-once queues mean a job can run twice. Make running it twice harmless.', 'Keep a set of ids you have handled, or use a unique key in the database, and skip repeats.'], { rm: ['retry'], add: ['seen'], e: ['j2', 'd1'], hi: ['seen'], code: N3("const done = new Set();", "const handle = (msg) => {", "  if (done.has(msg.id)) return 'skipped';", "  done.add(msg.id);", "  return 'processed';", "};", "", "console.log(handle({ id: 'a' }), handle({ id: 'a' }));"), key: ['idea', 'Charging a card twice is the classic bug here. Use an idempotency key.'], short: 'Idempotent' }),
    st('TECHNIQUE', 'Rate limit with a token bucket', ['A bucket holds up to N tokens and refills at a steady rate. Each request takes one token. No token means reject with 429.', 'It allows short bursts but caps the average rate.'], { rm: ['jq', 'wk', 'seen'], add: ['req', 'tb', 'no'], e: ['t1', 't2'], hi: ['tb'], code: N3("export class TokenBucket {", "  constructor(capacity, perSecond, now = Date.now) {", "    this.cap = capacity; this.rate = perSecond; this.tokens = capacity;", "    this.now = now; this.last = now();", "  }", "  take() {", "    const t = this.now();", "    this.tokens = Math.min(this.cap, this.tokens + ((t - this.last) / 1000) * this.rate);", "    this.last = t;", "    if (this.tokens >= 1) { this.tokens -= 1; return true; }", "    return false;", "  }", "}", "", "let t = 0;", "const b = new TokenBucket(2, 1, () => t);", "console.log(b.take(), b.take(), b.take());", "t = 1000;", "console.log(b.take());"), key: ['know', 'Behind several servers, keep the counters in Redis. A per-process limiter lets each process allow its own share.'], short: 'Rate limit' }),
    st('WATCH OUT', 'Shut down gracefully', ['On a deploy, the platform sends SIGTERM. If you just die, in-flight requests and jobs are cut off.', 'Stop accepting new work, let current work finish, then exit.'], { rm: ['req', 'tb', 'no'], add: ['sig', 'web', 'done'], e: ['g1', 'g2'], hi: ['sig'], code: N3("import http from 'node:http';", "", "const server = http.createServer((req, res) => setTimeout(() => res.end('done'), 200)).listen(0);", "", "process.on('SIGTERM', () => {", "  server.close(() => {", "    console.log('closed cleanly');", "    process.exit(0);", "  });", "});"), key: ['warn', 'Also set a hard timeout. If draining takes too long, exit anyway.'], short: 'Shutdown' }),
    st('RECAP', 'What to remember', ['Queue slow work. Retry with backoff and jitter, but make handlers idempotent. Rate limit with a token bucket.', 'On SIGTERM, stop taking work and finish what you have.'], { hi: [], short: 'Recap' })
  ]
});

lesson({

  nodes: {

  steps: [
    st('PROBLEM', 'It works on my machine', ['Your laptop has one Node version and one set of libraries. The server has another. A bug appears only in production.', 'A container packs your code and its exact runtime together.'], { add: ['dev', 'prod'], e: ['x1'], hi: ['prod'], read: [['environments', 'all different']], key: ['warn', 'Differences between machines are the hardest bugs to reproduce.'], short: 'The catch' }),
    st('TECHNIQUE', 'A multi-stage Dockerfile', ['Build in one stage with all dev tools, then copy only the compiled output into a clean runtime stage. The final image is smaller and safer.', 'Set NODE_ENV=production, install without dev dependencies, and run as the non-root node user.'], { rm: ['dev', 'prod'], add: ['build', 'run'], e: ['s1'], hi: ['build', 'run'], code: N3('FROM node:22-alpine AS build', 'WORKDIR /app', 'COPY package*.json ./', 'RUN npm ci', 'COPY . .', 'RUN npm run build', '', 'FROM node:22-alpine', 'WORKDIR /app', 'ENV NODE_ENV=production', 'COPY package*.json ./', 'RUN npm ci --omit=dev', 'COPY --from=build /app/dist ./dist', 'USER node', 'CMD ["node", "dist/server.js"]'), key: ['idea', 'Copy package files and install before copying the code. Docker then reuses the cached dependency layer when only code changed.'], short: 'Dockerfile' }),
    st('CONCEPT', 'Keep the image lean', ['A .dockerignore file keeps node_modules, .git and local .env files out of the build. This makes builds faster and stops secrets going into the image.', 'An image is a snapshot. Containers are running copies of it.'], { add: ['ign', 'img'], rm: ['build', 'run'], e: ['g1'], hi: ['ign'], code: N3('node_modules', '.git', '.env', 'npm-debug.log'), key: ['warn', 'Anything COPY-ed into an image can be read by whoever gets the image. Never bake secrets in.'], short: 'dockerignore' }),
    st('TECHNIQUE', 'Health checks: alive vs ready', ['Liveness says the process is running. If it fails, restart it. Readiness says it can serve traffic right now. If it fails, stop sending requests but do not restart.', 'Return 503 on the readiness route while the app is still starting or its database is down.'], { rm: ['ign', 'img'], add: ['lb', 'live', 'ready'], e: ['h1', 'h2'], hi: ['live', 'ready'], code: N3("import express from 'express';", "", "const app = express();", "let ready = false;", "", "app.get('/healthz', (req, res) => res.send('alive'));", "app.get('/readyz', (req, res) =>", "  ready ? res.send('ready') : res.status(503).send('starting'));", "", "setTimeout(() => { ready = true; }, 100);"), key: ['know', 'Keep liveness trivial. If it checks the database, a database outage restarts every healthy app.'], short: 'Health checks' }),
    st('WATCH OUT', 'Signals and PID 1', ['In a container, your process is PID 1 and must handle SIGTERM itself. Starting through npm start can leave your app without the signal.', 'Run node directly in CMD, and use the exec form (a JSON array) so no shell sits in between.'], { add: ['pid1'], e: ['p1'], hi: ['pid1'], code: N3('# risky: npm may not pass SIGTERM on', 'CMD npm start', '', '# better: node is PID 1 and gets the signal', 'CMD ["node", "dist/server.js"]'), key: ['warn', 'docker run --init adds a tiny init process that forwards signals and reaps zombies. A process manager like pm2 is rarely needed inside a container.'], short: 'PID 1' }),
    st('TECHNIQUE', 'Roll out without downtime', ['Start new copies (v2) next to the old ones (v1). Only send traffic to v2 once its readiness check passes, then stop v1.', 'Orchestrators like Kubernetes do this with a rolling update. maxUnavailable: 0 means never go below the current capacity.'], { rm: ['live', 'ready', 'pid1'], add: ['v1', 'v2'], e: ['d1', 'd2'], hi: ['v2'], code: N3('strategy:', '  type: RollingUpdate', '  rollingUpdate:', '    maxUnavailable: 0', '    maxSurge: 1'), key: ['tip', 'Combine this with graceful shutdown. Old copies finish their in-flight requests before they stop.'], short: 'Rolling deploy' }),
    st('RECAP', 'What to remember', ['Multi-stage Dockerfile, non-root user, NODE_ENV=production, and a .dockerignore.', 'Separate liveness from readiness, run node as PID 1, and roll out gradually behind readiness checks.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'microservices', lvl: 5, title: 'Services Talking to Services', sub: 'When to split an app, and how to stop one failing service from taking down the rest.', min: 11, diff: 'Advanced',
  learn: ['Monolith vs microservices trade-offs', 'Timeouts on every call', 'Circuit breakers', 'Events and an API gateway'],
  nodes: {
    mono: { k: 'cube', p: [0, 0], c: 'purple', g: 'ALL', t: 'Monolith server', s: 'one deploy, one database' },
    orders: { k: 'cube', p: [-3.4, 0], c: 'purple', g: 'ord', t: 'Orders service', s: 'owns order data' },
    pay: { k: 'cube', p: [3.4, 0], c: 'purple', g: 'pay', t: 'Payments service', s: 'owns payment data' },

    slow: { k: 'cube', p: [3.4, 2.4], c: 'red', g: '500ms', t: 'Slow service', s: 'answers late' },
    to: { k: 'cube', p: [0, 2.6], c: 'green', g: '100ms', t: 'Timeout', s: 'give up and move on' },

    stock: { k: 'cube', p: [3.4, 1.6], c: 'purple', g: 'stk', t: 'Stock service', s: 'listens' },
    gw: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'API', t: 'API gateway', s: 'one front door' },

  },
  edges: {
    c1: { a: 'orders', b: 'pay', t: 'HTTP call', pk: true },
    n1: { a: 'orders', b: 'net', t: 'every hop', dash: true, c: 'red' },
    s1: { a: 'orders', b: 'slow', t: 'waits 500ms', dash: true, c: 'red' },
    t1: { a: 'orders', b: 'to', t: 'cuts at 100ms', pk: true },

    e2: { a: 'bus', b: 'mail', t: 'event', pk: true },
    e3: { a: 'bus', b: 'stock', t: 'event', pk: true },

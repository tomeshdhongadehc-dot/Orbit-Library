<title>Node Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fira+Code:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Node Orbit: night-sky theme, glowing floating tiles, lesson map, segmented progress. */
:root {
  --bg: #080c1d; --panel: #111936; --panel2: #1a2450; --ink: #eef1ff; --muted: #9aa6d8; --line: #28346a; --dot: #34417e;
  --a1: #2de2c4; --a2: #9b7bff; --a3: #ffb62e; --a4: #ff5d8f; --shadow: rgba(0, 0, 0, .5); --glow: rgba(45, 226, 196, .8); --pillbg: #0b1230;
  --idea: #2d2470; --tip: #0f4440; --warn: #5a3a0c; --catch: #5c1c3c; --wrap: #1d2c70;
  --disp: "Sora", system-ui, sans-serif; --body: "DM Sans", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
    --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
    --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
  --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
  --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: clip; }
body { margin: 0; background: radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--a2) 22%, transparent), transparent), radial-gradient(700px 380px at 5% 0%, color-mix(in srgb, var(--a1) 14%, transparent), transparent), var(--bg); color: var(--ink); font: 14px/1.6 var(--body); padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; position: relative; z-index: 20; }
.brand { font: 700 18px var(--disp); display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; }
.ring { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, var(--a1), var(--a2), var(--a4), var(--a3), var(--a1)); position: relative; }
.ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.menu { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font: 600 12.5px var(--disp); display: flex; gap: 8px; align-items: center; }
.menu:hover { border-color: var(--a1); }
.spacer { flex: 1; }
.pg { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.bar { width: 110px; height: 6px; border-radius: 6px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); }
.map { display: none; position: absolute; left: 0; right: 0; top: 100%; max-height: min(70vh, 640px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 24px 60px var(--shadow); }
.map.show { display: block; }
.map h3 { margin: 12px 0 8px; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.map h3:first-child { margin-top: 0; }
.map h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.lc { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: flex; gap: 9px; align-items: center; }
.lc:hover { border-color: var(--a1); }
.lc.on { border-color: var(--a1); box-shadow: 0 0 0 1px var(--a1) inset; }
.lc b { font: 600 12px var(--mono); color: var(--muted); width: 22px; flex: none; }
.lc span { font: 600 13px var(--disp); line-height: 1.25; flex: 1; }
.lc em { font-style: normal; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 10px; }
.lc.done em { background: var(--a1); border-color: var(--a1); color: #04201c; }
.lc.done em::after { content: "\2713"; font-weight: 700; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.center { min-width: 0; display: grid; gap: 10px; }
.crumb { font: 500 11.5px var(--mono); color: var(--a1); margin: 0; letter-spacing: .04em; }
.head h1 { font: 700 clamp(22px, 3.4vw, 32px)/1.1 var(--disp); margin: 4px 0 4px; letter-spacing: -.02em; background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--a2) 60%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font: 500 11px var(--mono); border-radius: 999px; padding: 2px 10px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.chip:nth-child(1) { color: var(--a1); border-color: color-mix(in srgb, var(--a1) 50%, var(--line)); }
.chip:nth-child(2) { color: var(--a3); border-color: color-mix(in srgb, var(--a3) 50%, var(--line)); }
.chip:nth-child(3) { color: var(--a4); border-color: color-mix(in srgb, var(--a4) 50%, var(--line)); }
.stagebox { position: relative; background: radial-gradient(640px 300px at 50% 42%, color-mix(in srgb, var(--a2) 20%, var(--panel)), var(--panel)); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.read { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; max-width: calc(100% - 200px); }
.rd { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-left: 3px solid var(--a1); border-radius: 8px; padding: 3px 10px; min-width: 80px; backdrop-filter: blur(6px); }
.rd:nth-child(2) { border-left-color: var(--a3); } .rd:nth-child(3) { border-left-color: var(--a4); } .rd:nth-child(4) { border-left-color: var(--a2); }
.rd small { display: block; font: 500 9.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.rd b { font: 600 13px var(--mono); color: var(--ink); }
.tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 2; }
.sbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font: 600 12px var(--disp); }
.sbtn:hover { border-color: var(--a1); }
.scrollx { overflow: hidden; }
svg.scene { display: block; width: 100%; height: auto; max-height: calc(100vh - 290px); }
.gdot { fill: var(--dot); }
.face { stroke: color-mix(in srgb, #fff 30%, transparent); stroke-width: 1; stroke-linejoin: round; }
.shadow { fill: var(--shadow); stroke: none; filter: blur(5px); }
.glyph { font: 600 12px var(--mono); fill: #060c1c; text-anchor: middle; pointer-events: none; }
.pillbox { fill: var(--pillbg); stroke: color-mix(in srgb, var(--a1) 55%, var(--line)); stroke-width: 1.2; }
.pt { font: 600 12.5px var(--mono); fill: var(--ink); text-anchor: middle; }
.ps { font: 400 10.5px var(--mono); fill: var(--muted); text-anchor: middle; }
.n { transition: transform .75s cubic-bezier(.3, .8, .3, 1); }
.in { transition: opacity .45s, transform .6s cubic-bezier(.3, 1.4, .5, 1); }
.in.off { opacity: 0; transform: translateY(-22px) scale(.92); }
.n.dim .in { opacity: .28; }
.n.hi .in { filter: drop-shadow(0 0 10px var(--glow)); animation: bob 1.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.eg { fill: none; stroke-width: 2.4; stroke-linecap: round; animation: draw .5s ease backwards; }
.eg circle { filter: drop-shadow(0 0 5px var(--glow)); }
@keyframes draw { from { opacity: 0; } to { opacity: 1; } }
.legend { display: flex; gap: 12px 16px; padding: 4px 14px 10px; font: 400 11px var(--mono); color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stepper { overflow-x: hidden; position: sticky; bottom: 8px; z-index: 6; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 12px; box-shadow: 0 -8px 24px var(--shadow); }
.stepper h5 { margin: 0 0 8px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; background: none; border: 0; padding: 0; text-align: left; }
.dot span.c { display: block; width: 100%; height: 7px; border-radius: 99px; background: var(--line); font-size: 0; transition: background .3s; }
.dot.past span.c { background: var(--a1); opacity: .7; }
.dot.cur span.c { background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); box-shadow: 0 0 12px var(--glow); }
.dot span.l { font: 500 10.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot.cur span.l { color: var(--ink); font-weight: 600; }
.panel { position: sticky; top: 8px; display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 15px; position: relative; overflow: hidden; }
.card:first-child::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--a1), var(--a2), var(--a4)); }
.stephead { display: flex; justify-content: space-between; align-items: center; font: 500 11px var(--mono); color: var(--muted); }
.tag { border-radius: 999px; padding: 2px 10px; font: 600 10px var(--mono); letter-spacing: .08em; color: var(--ink); }
.tag.PROBLEM { background: var(--catch); } .tag.CONCEPT { background: var(--idea); } .tag.TECHNIQUE { background: var(--tip); } .tag.WATCH { background: var(--warn); } .tag.RECAP { background: var(--wrap); }
.card h2 { font: 700 19px/1.25 var(--disp); margin: 9px 0 8px; letter-spacing: -.01em; }
.card p { margin: 0 0 8px; }
.card code, .kc code { font: 500 12px var(--mono); background: var(--panel2); border-radius: 5px; padding: 1px 5px; color: var(--a1); }
pre.cd { background: #060a17; color: #dbe4ff; font: 400 12px/1.65 var(--mono); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.kc { border-radius: 12px; padding: 9px 12px; margin-top: 10px; border-left: 3px solid var(--a2); }
.kc small { display: block; font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; color: var(--muted); }
.kc.idea { background: var(--idea); border-color: var(--a2); } .kc.know { background: var(--tip); border-color: var(--a1); } .kc.warn { background: var(--warn); border-color: var(--a3); }
.chg { margin-top: 10px; font-size: 12.5px; }
.chg small { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chg ul { margin: 4px 0 0; padding-left: 16px; }
.nav { display: flex; gap: 8px; margin-top: 12px; }
.nbtn { border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); background: var(--panel2); }
.nbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; flex: 1; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.nbtn:disabled { opacity: .35; cursor: default; }
.hint { font: 400 10.5px var(--mono); color: var(--muted); margin-top: 8px; }
.learn h4 { margin: 0 0 6px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.learn label { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 2px 0; color: var(--muted); }
.learn label.on { color: var(--ink); }
.learn .bx { width: 14px; height: 14px; border: 1.5px solid var(--dot); border-radius: 50%; flex: none; margin-top: 3px; display: grid; place-items: center; font-size: 9px; }
.learn label.on .bx { background: var(--a1); border-color: var(--a1); color: #04201c; }
.learn label.on .bx::after { content: "\2713"; font-weight: 700; }
@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
  .read { max-width: 100%; position: static; padding: 8px 10px 0; }
  .tools { position: static; padding: 8px 10px 0; }
  .pg .bar { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 13.5px; }
  .dot span.l { display: none; }
  .sbtn { padding: 3px 10px; }
  .rd { min-width: 0; }
  .card h2 { font-size: 17px; }
  svg.scene { max-height: 56vh; }
  .stepper { padding: 8px 10px; }
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style>
[hidden] { display: none !important; }
.mode { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode a { font: 600 12.5px var(--disp); color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 999px; }
.mode a.on { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; }
#iv { display: grid; gap: 12px; max-width: 980px; margin: 0 auto; }
.ivhero { display: flex; gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.ivhero h1 { font: 700 clamp(24px, 4vw, 34px)/1.1 var(--disp); margin: 4px 0; letter-spacing: -.02em; }
.ivprog { min-width: 150px; display: grid; gap: 4px; font: 500 12px var(--mono); color: var(--muted); }
.ivprog b { font: 700 22px var(--disp); color: var(--ink); }
.ivprog .bar { width: 100%; }
.how { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font: 600 12px var(--disp); }
.how .chip { color: var(--a1); }
.ivtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.ivtab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); display: flex; gap: 8px; align-items: center; }
.ivtab em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.ivtab:hover { border-color: var(--a1); }
.ivtab.on { background: linear-gradient(90deg, color-mix(in srgb, var(--a1) 28%, var(--panel)), color-mix(in srgb, var(--a2) 28%, var(--panel))); border-color: var(--a1); }
.tabdesc { margin: 0; }
.ivbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ivbar input { flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 8px 12px; font: 14px var(--body); }
.ivbar input:focus { outline: 2px solid var(--a1); outline-offset: 1px; }
.chip.fb { cursor: pointer; }
.chip.fb.on { background: var(--a1); color: #04201c; border-color: var(--a1); }
.ivlist { display: grid; gap: 8px; }
.ivc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ivc[open] { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.ivc summary { list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 11px 14px; }
.ivc summary::-webkit-details-marker { display: none; }
.ivc .num { font: 600 12px var(--mono); color: var(--a2); }
.ivc .tt { flex: 1; font: 600 14.5px/1.35 var(--disp); }
.ivc .tt small { display: block; font: 400 11px var(--mono); color: var(--muted); margin-top: 2px; }
.lvl { font: 600 10px var(--mono); border-radius: 999px; padding: 2px 9px; background: var(--panel2); color: var(--muted); letter-spacing: .04em; }
.lvl.l-mustknow, .lvl.l-tricky { color: var(--a4); } .lvl.l-easy { color: var(--a1); } .lvl.l-medium, .lvl.l-common { color: var(--a3); } .lvl.l-seniorish { color: var(--a2); }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 11px; font-style: normal; }
.ivc.done .tick { background: var(--a1); border-color: var(--a1); color: #04201c; }
.ivc.done .tick::after { content: "\2713"; font-weight: 700; }
.ivb { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.ivb .ask { margin: 8px 0 0; font-size: 14.5px; }
.ivb .lab { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 4px; }
.ivb .kc { margin: 0; }
.ivb pre.cd { margin: 0; }
.ivl { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.ivbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font: 600 12.5px var(--disp); justify-self: start; }
.ivbtn:hover:not(:disabled) { border-color: var(--a1); }
.ivbtn:disabled { opacity: .45; cursor: default; }
.ivbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; }
.ivbtn.mark { margin-top: 4px; }
.ivb .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ans { display: grid; gap: 8px; }
.hint-i { background: var(--panel2); border-left: 3px solid var(--a3); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; margin-top: 6px; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
@media (max-width: 640px) { .ivc summary { padding: 10px; gap: 8px; } .lvl { display: none; } .mode a { padding: 5px 10px; } }
</style>

<style>
#rv { display: grid; gap: 12px; max-width: 1100px; margin: 0 auto; }
.cs { columns: 300px; column-gap: 12px; }
.csc { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tone, var(--a1)); border-radius: 14px; padding: 4px 12px 8px; margin: 0 0 12px; }
.csc h3 { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px; font: 700 14px var(--disp); }
.csc h3 em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.csdef, .csidea { margin: 4px 0 0; font-size: 12.5px; }
.csdef b, .csidea b { font: 700 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--tone, var(--a1)); margin-right: 4px; }
.csidea { background: var(--panel2); border-left: 3px solid var(--tone, var(--a1)); border-radius: 8px; padding: 6px 10px; margin: 8px 0 6px; }
.csr { padding: 7px 0; border-top: 1px dashed var(--line); }
.csr:first-of-type { border-top: 0; }
.csr pre { margin: 0; font: 500 12px/1.5 var(--mono); color: var(--tone, var(--a1)); white-space: pre-wrap; overflow-wrap: anywhere; }
.csr p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.rvlist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.rvlist.day { grid-template-columns: 1fr; }
.rvb { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.rvb.done { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.rvh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rvh h3 { margin: 0; font: 700 16px var(--disp); }
.rvh small { display: block; font: 500 11px var(--mono); color: var(--muted); }
.rvn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--disp); background: linear-gradient(135deg, var(--a1), var(--a2)); color: #06121f; flex: none; }
.rvt { font: 600 11.5px var(--mono); color: var(--a3); background: var(--panel2); border-radius: 999px; padding: 3px 11px; flex: none; }
.rvcks { display: grid; gap: 4px; }

function applyModels() {
  LESSONS.forEach(L => {
    for (const id in L.nodes) {

    st('CONCEPT', 'Buffer holds raw bytes', ['A Buffer is a fixed block of bytes. Files and sockets give you Buffers, and you decode them to text with an encoding.', 'Length is in bytes, not characters.'], { add: ['buf'], e: ['d'], hi: ['buf'], code: `const b = Buffer.from('héllo', 'utf8');
console.log(b.length, 'héllo'.length);
console.log(b.toString('hex'));
console.log(Buffer.concat([b, Buffer.from('!')]).toString());`, read: [['Output', '6 5, 68c3a96c6c6f, héllo!']], key: ['know', 'The letter é takes 2 bytes in UTF-8, so length is 6 but there are 5 characters.'], short: 'Buffer' }),
    st('CONCEPT', 'A Readable gives chunks', ['A Readable stream emits data events, one chunk at a time, then end.', 'Files, HTTP requests, and process.stdin are all Readable streams.'], { add: ['src', 'dst'], hi: ['src'], code: `const { Readable } = require('stream');
const src = Readable.from(['a', 'b', 'c']);
src.on('data', chunk => console.log('chunk', chunk));
src.on('end', () => console.log('done'));`, read: [['Output', 'chunk a, chunk b, chunk c, done']], key: ['idea', 'Same idea for a file, a socket or an array: pieces arrive over time.'], short: 'Readable' }),
    st('CONCEPT', 'A Transform changes chunks on the way', ['A Transform sits between a source and a destination. Compression, parsing and encryption are transforms.', 'pipeline connects the three and returns when it all finishes.'], { add: ['tr'], e: ['a', 'b'], hi: ['tr'], code: `const { Readable, Transform, Writable, pipeline } = require('stream');
const upper = new Transform({
  transform(chunk, enc, cb) { cb(null, chunk.toString().toUpperCase()); }
});
const out = [];
const sink = new Writable({
  write(chunk, enc, cb) { out.push(chunk.toString()); cb(); }
});
pipeline(Readable.from(['a', 'b']), upper, sink, err => {
  console.log(err ? 'failed' : out.join(''));
});`, read: [['Output', 'AB']], key: ['know', 'Each stage only needs to handle one chunk at a time.'], short: 'Transform' }),
    st('WATCH OUT', 'Backpressure: a slow destination', ['If the source is faster than the destination, chunks pile up in memory. write() returns false to say "stop, buffer full".', 'Wait for the drain event before writing more. pipe and pipeline do this for you.'], { add: ['bp'], e: ['a', 'b', 'c'], hi: ['bp'], code: `const { Writable } = require('stream');
const slow = new Writable({
  highWaterMark: 3,
  write(chunk, enc, cb) { setTimeout(cb, 5); }
});
console.log(slow.write('ab'));
console.log(slow.write('cd'));
slow.once('drain', () => console.log('drain: safe to write again'));`, read: [['Output', 'true, false, drain: safe to write again']], key: ['warn', 'Ignoring a false from write() is how streaming code runs out of memory.'], short: 'Backpressure' }),
    st('TECHNIQUE', 'Use pipeline, not pipe', ['pipe does not clean up when one side fails, which can leak file handles.', 'pipeline from stream/promises handles errors and closes everything. Use it with await.'], { rm: ['bp'], e: ['a', 'b'], hi: ['src', 'tr', 'dst'], code: `const { pipeline } = require('stream/promises');
const fs = require('fs');
const zlib = require('zlib');
const os = require('os');
const path = require('path');
const src = path.join(os.tmpdir(), 'in.txt');
const dst = src + '.gz';
fs.writeFileSync(src, 'hello '.repeat(1000));
pipeline(fs.createReadStream(src), zlib.createGzip(), fs.createWriteStream(dst))
  .then(() => console.log('gzip smaller:', fs.statSync(dst).size < fs.statSync(src).size))
  .catch(console.error);`, read: [['Output', 'gzip smaller: true']], key: ['idea', 'One call, errors handled, files closed.'], short: 'pipeline' }),
    st('RECAP', 'Remember', ['Buffer is bytes. Streams move chunks. Respect backpressure. Use pipeline.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'events-process', lvl: 1, title: 'Events and Process', sub: 'Emitting events, reading config, and shutting down cleanly.', min: 8, diff: 'Beginner',
  learn: ['EventEmitter on, once and emit', 'Why an error event needs a listener', 'process.env and process.argv', 'Signals and exit codes'],
  nodes: {
    em: { k: 'cube', p: [-3.4, -1.4], c: 'blue', g: 'emit', t: 'EventEmitter', s: 'emit and on' },
    ls: { k: 'cube', p: [0, -1.4], c: 'purple', g: 'fn', t: 'Listeners', s: 'run in order' },
    err: { k: 'cube', p: [3.4, -1.4], c: 'red', g: '!', t: '\'error\' event', s: 'no listener = crash' },
    env: { k: 'cube', p: [-3.4, 1.7], c: 'amber', g: 'env', t: 'Environment config', s: 'process.env, argv' },

  edges: {

    s1: { a: 'sig', b: 'ex', t: 'then exit', pk: true }
  },
  steps: [
    st('PROBLEM', 'Parts of a program need to talk', ['One part finishes something, and several others need to react without being hard-wired together.', 'Node builds a lot on one idea: emit an event, and anyone listening runs.'], { add: ['em'], hi: ['em'], key: ['idea', 'Streams, servers and processes are all event emitters underneath.'], short: 'Why' }),
    st('CONCEPT', 'EventEmitter: on, once, emit', ['on registers a listener. once registers one that runs a single time. emit calls the listeners synchronously, in the order they were added.', 'The emitter does not wait for anything. It just calls them.'], { add: ['ls'], e: ['e1'], hi: ['em', 'ls'], code: `const EventEmitter = require('events');
const bus = new EventEmitter();
bus.on('order', id => console.log('email for', id));
bus.on('order', id => console.log('stock for', id));
bus.once('order', () => console.log('first order only'));
bus.emit('order', 1);
bus.emit('order', 2);`, read: [['Output', 'email, stock, first order only, then email and stock again']], key: ['know', 'Listeners run in the order they were added. once removes itself after one call.'], short: 'EventEmitter' }),
    st('WATCH OUT', 'An error event needs a listener', ['If an emitter emits "error" and nobody listens, Node throws and the process can crash.', 'Always add an error listener to streams, sockets and your own emitters.'], { add: ['err'], e: ['e2'], hi: ['err'], code: `const EventEmitter = require('events');
const e = new EventEmitter();
try { e.emit('error', new Error('boom')); } catch (err) { console.log('thrown:', err.message); }
e.on('error', err => console.log('handled:', err.message));
e.emit('error', new Error('boom'));`, read: [['Output', 'thrown: boom, handled: boom']], key: ['warn', 'No listener, so it throws. With a listener it is handled.'], short: 'error event' }),
    st('CONCEPT', 'Configuration from outside', ['process.argv holds the command-line words. Your own arguments start at index 2.', 'process.env holds environment variables. Values are always strings, or undefined if not set.'], { add: ['env'], e: ['v1'], hi: ['env'], code: `console.log(process.argv.slice(2));
console.log(process.env.PORT ?? 'unset');
process.env.PORT = 5;
console.log(typeof process.env.PORT);`, read: [['Run as', 'node app.js --port 3000'], ['Output', "[ '--port', '3000' ], unset, string"]], key: ['warn', 'Even a number you assign to process.env becomes the string "5".'], short: 'env and argv' }),
    st('CONCEPT', 'Signals ask you to stop', ['When a deploy or Ctrl+C stops your app, the system sends a signal such as SIGTERM or SIGINT.', 'Listen for it, finish current requests, close connections, then exit.'], { add: ['sig'], hi: ['sig'], code: `process.on('SIGTERM', () => {
  console.log('draining, then exit');
  process.exit(0);
});
setInterval(() => {}, 1000);`, key: ['know', 'Without a handler the process just dies, and in-flight requests are cut off.'], short: 'Signals' }),
    st('TECHNIQUE', 'Exit codes tell the caller what happened', ['0 means success and anything else means failure. Schedulers and CI read it.', 'Set process.exitCode to let pending work finish. process.exit() stops immediately.'], { add: ['ex'], e: ['s1'], hi: ['ex'], code: `process.on('exit', code => console.log('exit code', code));
process.exitCode = 2;
console.log('still running to the end');`, read: [['Output', 'still running to the end, exit code 2']], key: ['idea', 'exitCode lets the program finish. exit() cuts it off.'], short: 'Exit codes' }),
    st('RECAP', 'Remember', ['Emitters call listeners in order. Always handle error. Env values are strings. Handle signals and set a clear exit code.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'async-errors', lvl: 1, title: 'Async and Error Handling in Node', sub: 'Why try/catch misses async errors, and how to deal with the ones that matter.', min: 9, diff: 'Intermediate',
  learn: ['Error-first callbacks', 'promisify and async/await', 'Unhandled rejections', 'Operational vs programmer errors'],
  nodes: {
    cb: { k: 'cube', p: [-3.4, -1.4], c: 'blue', g: 'cb', t: 'Callback', s: 'error first' },
    pr: { k: 'cube', p: [0, -1.4], c: 'amber', g: 'p', t: 'Promise', s: 'then and catch' },
    aw: { k: 'cube', p: [3.4, -1.4], c: 'purple', g: 'await', t: 'async / await', s: 'try and catch' },
    rej: { k: 'cube', p: [-3.4, 1.7], c: 'red', g: '!', t: 'Unhandled rejection', s: 'nobody caught it' },
    op: { k: 'cube', p: [0, 1.7], c: 'orange', g: 'ok', t: 'Operational error', s: 'handle and recover' },
    bug: { k: 'cube', p: [3.4, 1.7], c: 'red', g: 'bug', t: 'Programmer error', s: 'fix the code' }
  },
  edges: {
    a: { a: 'cb', b: 'pr', t: 'promisify', pk: true },
    b: { a: 'pr', b: 'aw', t: 'await', pk: true },
    r1: { a: 'rej', b: 'pr', t: 'escapes', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'try/catch cannot see later errors', ['A try block only covers code that runs inside it right now. An error thrown later from a timer or a callback happens after the block has finished.', 'It goes straight to the process.'], { add: ['cb'], hi: ['cb'], code: `process.on('uncaughtException', e => console.log('uncaught:', e.message));
try {
  setTimeout(() => { throw new Error('later'); }, 0);
} catch (e) { console.log('never reached'); }
console.log('after try');`, read: [['Output', 'after try, uncaught: later']], key: ['warn', 'The catch never ran. The throw happened on a later turn of the loop.'], short: 'The trap' }),
    st('CONCEPT', 'Error-first callbacks', ['The classic Node style: the callback gets (err, result). If err is set, something failed.', 'Always check err first and return.'], { hi: ['cb'], code: `const fs = require('fs');
fs.readFile('/no/such/file', 'utf8', (err, data) => {
  if (err) return console.log(err.code);
  console.log(data);
});`, read: [['Output', 'ENOENT']], key: ['know', 'ENOENT means no such file or directory. Error codes are stable. Messages are not.'], short: 'Callbacks' }),
    st('TECHNIQUE', 'Promisify, then async/await', ['util.promisify turns an error-first function into one that returns a promise.', 'With await, try/catch works again, because the error comes back to your code.'], { add: ['pr', 'aw'], e: ['a', 'b'], hi: ['pr', 'aw'], code: `const { promisify } = require('util');
const fs = require('fs');
const readFile = promisify(fs.readFile);
(async () => {
  try { await readFile('/no/such/file', 'utf8'); }
  catch (err) { console.log('caught', err.code); }
})();`, read: [['Output', 'caught ENOENT']], key: ['idea', 'await turns a rejected promise back into a throw you can catch.'], short: 'async/await' }),
    st('WATCH OUT', 'A forgotten await becomes an unhandled rejection', ['Calling an async function without await or catch leaves its failure with nobody.', 'Since Node 15 an unhandled rejection crashes the process by default.'], { add: ['rej'], e: ['r1'], hi: ['rej'], code: `process.on('unhandledRejection', reason => console.log('unhandled:', reason.message));
async function fail() { throw new Error('nobody awaited me'); }
fail();
console.log('carried on');`, read: [['Output', 'carried on, unhandled: nobody awaited me']], key: ['warn', 'Always await, return or catch a promise. Never leave one dangling.'], short: 'Dangling promise' }),
    st('CONCEPT', 'Two kinds of errors', ['Operational errors are expected problems: bad input, a missing file, a network timeout. Handle them and carry on.', 'Programmer errors are bugs: a TypeError, an undefined property. Fix the code. Do not try to recover.'], { add: ['op', 'bug'], hi: ['op', 'bug'], code: `class AppError extends Error {
  constructor(message, status) {
    super(message);
    this.status = status;
    this.isOperational = true;
  }
}
function parseAge(x) {
  if (!Number.isInteger(x)) throw new AppError('age must be an integer', 400);
  return x;
}
try { parseAge('7'); } catch (e) { console.log(e.isOperational, e.status, e instanceof Error); }`, read: [['Output', 'true 400 true']], key: ['know', 'A flag or class lets your handler tell expected errors from bugs.'], short: 'Two kinds' }),
    st('TECHNIQUE', 'Last resort: log, then exit', ['After an uncaught exception the process state is unknown. Log it, then exit and let a supervisor restart you.', 'Do not keep running as if nothing happened.'], { hi: ['bug'], code: `process.on('uncaughtException', err => {
  console.error('fatal:', err.message);
  process.exit(1);
});
setTimeout(() => { throw new Error('bug'); }, 0);`, read: [['Output', 'fatal: bug, exit code 1']], key: ['idea', 'Crash early and restart cleanly beats running in a broken state.'], short: 'Last resort' }),
    st('RECAP', 'Remember', ['Use async/await so try/catch works. Never leave a promise dangling. Handle operational errors. Crash and restart on bugs.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'http-core', lvl: 2, title: 'The http Module', sub: 'What every Node web framework is built on: a function that gets a request and writes a response.', min: 9, diff: 'Beginner',
  learn: ['createServer, req and res', 'Status codes and headers', 'Reading the body and streaming a reply', 'Keep-alive and the headers-sent trap'],
  nodes: {
    cli: { k: 'cube', p: [-3.6, 0], c: 'blue', g: 'req', t: 'Browser', s: 'sends a request' },
    srv: { k: 'cube', p: [-0.8, 0], c: 'purple', g: 'node', t: 'HTTP server', s: 'createServer' },
    hdr: { k: 'cube', p: [-0.8, -2.6], c: 'amber', g: 'hdr', t: 'Headers', s: 'Content-Type' },
    ok: { k: 'cube', p: [2.4, -1.7], c: 'green', g: '200', t: 'Status code', s: '200, 404, 500' },
    str: { k: 'cube', p: [2.4, 1.7], c: 'teal', g: 'bits', t: 'Streamed body', s: 'sent in pieces' },
    ka: { k: 'cube', p: [-0.8, 2.6], c: 'pink', g: 'keep', t: 'Keep-alive', s: 'socket reused' },
    late: { k: 'cube', p: [4.0, 0], c: 'red', g: 'late', t: 'Late write', s: 'headers already sent' }
  },
  edges: {
    e1: { a: 'cli', b: 'srv', t: 'request', pk: true },
    e2: { a: 'srv', b: 'hdr', t: 'sets' },
    e3: { a: 'srv', b: 'ok', t: 'status', pk: true },
    e4: { a: 'srv', b: 'str', t: 'pipe', pk: true },
    e5: { a: 'ka', b: 'srv', t: 'reuses', dash: true, c: 'teal' },
    e6: { a: 'srv', b: 'late', t: 'too late', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'A server is a function from request to response', ['http.createServer takes one function. Node calls it for every request with a request object (req) and a response object (res).', 'Express, Fastify and Nest all sit on top of this one idea.'], { add: ['cli', 'srv'], e: ['e1'], hi: ['srv'], read: [['Module', 'node:http']], code: "const http = require('node:http');\n\nconst server = http.createServer((req, res) => {\n  res.writeHead(200, { 'Content-Type': 'text/plain' });\n  res.end('hello from ' + req.method + ' ' + req.url);\n});\n\nserver.listen(3000);", key: ['idea', 'Everything starts with req and res. A framework only adds routing and helpers around them.'], short: 'The idea' }),
    st('CONCEPT', 'Status and headers describe the reply', ['writeHead sets the status code and the headers in one call. The status says what happened. Content-Type says how to read the body.', 'There is no router here. You look at req.method and req.url yourself.'], { add: ['hdr', 'ok'], e: ['e1', 'e2', 'e3'], hi: ['ok'], read: [['Found', '200'], ['Missing', '404']], code: "const http = require('node:http');\n\nconst server = http.createServer((req, res) => {\n  if (req.method === 'GET' && req.url === '/health') {\n    res.writeHead(200, { 'Content-Type': 'application/json' });\n    return res.end(JSON.stringify({ ok: true }));\n  }\n  res.writeHead(404, { 'Content-Type': 'application/json' });\n  res.end(JSON.stringify({ error: 'not found' }));\n});\n\nserver.listen(3000);", key: ['know', 'Use 404 for an unknown route, not a 200 with an error message in the body.'], short: 'Status' }),
    st('TECHNIQUE', 'A request body arrives in chunks', ['req is a readable stream. The data event fires for each chunk and end fires when the body is complete.', 'Collect the chunks, join them, then parse. Frameworks do this for you with body parsers.'], { rm: ['hdr', 'ok'], e: ['e1'], hi: ['cli', 'srv'], read: [['Events', 'data, end']], code: "const http = require('node:http');\n\nhttp.createServer((req, res) => {\n  const chunks = [];\n  req.on('data', (chunk) => chunks.push(chunk));\n  req.on('end', () => {\n    const body = JSON.parse(Buffer.concat(chunks).toString() || '{}');\n    res.writeHead(201, { 'Content-Type': 'application/json' });\n    res.end(JSON.stringify({ got: body }));\n  });\n}).listen(3000);", key: ['know', 'Never parse before the end event. A half-received body is not valid JSON.'], short: 'Body' }),
    st('TECHNIQUE', 'Stream big replies instead of building them', ['res is a writable stream. Pipe a file, a database cursor or a generated list into it and Node sends it piece by piece.', 'Memory stays small even when the reply is huge. pipeline also cleans up if the client disconnects.'], { add: ['str', 'ok'], e: ['e1', 'e3', 'e4'], hi: ['str'], read: [['Memory', 'stays flat']], code: "const http = require('node:http');\nconst { pipeline, Readable } = require('node:stream');\n\nhttp.createServer((req, res) => {\n  res.writeHead(200, { 'Content-Type': 'text/plain' });\n  const lines = Readable.from(['one\\n', 'two\\n', 'three\\n']);\n  pipeline(lines, res, (err) => {\n    if (err) console.error(err);\n  });\n}).listen(3000);", key: ['idea', 'Prefer pipeline over manual pipe. It forwards errors and destroys both streams on failure.'], short: 'Stream' }),
    st('TECHNIQUE', 'Keep-alive reuses the connection', ['A keep-alive socket is kept open after a reply so the next request skips the connection setup.', 'Node closes idle sockets after a timeout. If a load balancer idles longer than that, it can send a request down a socket Node has just closed.'], { rm: ['ok', 'str'], add: ['ka'], e: ['e1', 'e5'], hi: ['ka'], read: [['Rule', 'Node timeout > proxy']], code: "const http = require('node:http');\n\nconst server = http.createServer((req, res) => res.end('ok'));\n\n// Keep idle sockets open longer than the load balancer in front of you does,\n// otherwise it may reuse a socket that Node has just closed.\nserver.keepAliveTimeout = 65000;\nserver.headersTimeout = 66000;\n\nserver.listen(3000);", key: ['know', 'Sporadic 502s from a load balancer are often a keep-alive timeout that is too short on the Node side.'], short: 'Keep-alive' }),
    st('WATCH OUT', 'Headers go out once', ['After the first write or end, the status line and headers are already on the wire. Changing them throws ERR_HTTP_HEADERS_SENT.', 'This usually comes from a missing return after sending a reply, so the code carries on and sends again.'], { rm: ['ka'], add: ['late'], e: ['e1', 'e6'], hi: ['late'], read: [['Error', 'ERR_HTTP_HEADERS_SENT']], code: "const http = require('node:http');\n\nconst server = http.createServer((req, res) => {\n  res.end('first');\n  try {\n    res.setHeader('X-Late', '1');\n  } catch (err) {\n    console.log(err.code);\n  }\n});\n\nserver.listen(3000);", key: ['warn', 'Write return res.end(...) or return res.json(...). One reply per request.'], short: 'Headers sent' }),
    st('RECAP', 'Remember', ['A server is one function of req and res. Set status and headers first, read the body from events, and stream large replies.', 'Match the keep-alive timeout to your proxy, and send exactly one reply per request.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'express-middleware', lvl: 2, title: 'Express and Middleware', sub: 'A request walks down a line of small functions until one of them replies.', min: 10, diff: 'Beginner',
  learn: ['Routes and params', 'The middleware chain and its order', 'Routers for grouping', 'Error-handling middleware'],
  nodes: {

<style>
/* Layout: a tab bar over one topic at a time; every topic is a small machine you operate. */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --fg: #121820; --muted: #566274; --line: #dbe1ea;
  --accent: #f7df1e; --accent-ink: #121820; --blue: #2457d6; --green: #157a3c; --red: #cc2b2b;
  --code-bg: #0f141b; --code-fg: #e4eaf2; --tint: #eaeff7;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1016; --surface: #141a23; --fg: #e8edf4; --muted: #98a4b6; --line: #263040;
    --blue: #7aaeff; --green: #4ade80; --red: #ff7b72; --code-bg: #090d12; --tint: #1b2330;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1016; --surface: #141a23; --fg: #e8edf4; --muted: #98a4b6; --line: #263040;
  --blue: #7aaeff; --green: #4ade80; --red: #ff7b72; --code-bg: #090d12; --tint: #1b2330;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
.wrap { max-width: 980px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 20px; padding: 12px 0; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--font-display); color: var(--fg); text-decoration: none; white-space: nowrap; }
.mark { background: var(--accent); color: var(--accent-ink); font: 700 13px var(--font-mono); padding: 3px 6px; border-radius: 4px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; white-space: nowrap; font-weight: 500; font-size: 14px; }
.tabs a:hover { color: var(--fg); background: var(--tint); }
.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
.hero { padding: 48px 0 28px; }
.hero h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.04; font-weight: 700; max-width: 14ch; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--accent) 62%); }
.hero p { color: var(--muted); max-width: 52ch; font-size: 17px; margin: 14px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: transform .15s, border-color .15s; }
.card:hover { transform: translateY(-2px); border-color: var(--fg); }
.card .tag { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.card h3 { margin: 0; font: 600 19px var(--font-display); }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card .glyph { font: 500 13px var(--font-mono); background: var(--tint); border-radius: 8px; padding: 8px 10px; margin-top: 6px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.topic { padding-top: 32px; }
.kicker { font: 500 12px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.topic h2 { font-size: clamp(28px, 4.6vw, 40px); font-weight: 700; }
.lede { color: var(--muted); max-width: 60ch; font-size: 16px; margin: 8px 0 20px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--fg); color: var(--bg); border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 600; font-size: 14px; }
.btn.alt { background: var(--tint); color: var(--fg); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:not(:disabled):active { transform: translateY(1px); }
.code { background: var(--code-bg); color: var(--code-fg); font: 400 13px/1.65 var(--font-mono); border-radius: 12px; padding: 16px 18px; margin: 16px 0 0; overflow-x: auto; }
.code .c { color: #7d8a9c; } .code .s { color: #a5d6a7; } .code .k { color: #ff9e64; } .code .n { color: #7dcfff; }
.say { margin: 16px 0 0; background: var(--tint); border-radius: 12px; padding: 12px 16px; max-width: 70ch; }
.say b { font-family: var(--font-display); }
.note { color: var(--muted); font-size: 14px; min-height: 2.9em; margin: 12px 0 0; }

/* event loop */
.codebox { background: var(--code-bg); border-radius: 12px; padding: 10px 0; font: 400 13px/1.9 var(--font-mono); color: var(--code-fg); overflow-x: auto; }
.cl { display: flex; gap: 12px; padding: 0 16px; white-space: pre; border-left: 3px solid transparent; }
.cl .ln { color: #5d6a7d; width: 1ch; }
.cl.on { background: #1d2735; border-left-color: var(--accent); }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.col { border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 12px; min-height: 150px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.col h4 { margin: 0; font: 600 13px var(--font-display); }
.col small { color: var(--muted); font-size: 11.5px; margin-top: -6px; }
.list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.list.stack { flex-direction: column-reverse; justify-content: flex-start; }
.chip { font: 500 12px var(--font-mono); padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.chip.stack { border-color: var(--fg); }
.chip.micro { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--surface)); }
.chip.macro, .chip.web { border-color: var(--muted); }
.chip.new { animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.7) translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
.out { display: flex; gap: 8px; align-items: center; margin-top: 14px; min-height: 40px; flex-wrap: wrap; }
.out b { font: 600 13px var(--font-display); margin-right: 4px; }
.out .o { font: 600 15px var(--font-mono); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 4px 11px; }
.out .o.new { animation: pop .35s ease; }
.step { color: var(--muted); font: 500 12px var(--font-mono); margin-left: auto; }

/* promises */
.states { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.st { flex: 1 1 140px; border: 2px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; transition: all .25s; opacity: .55; }
.st b { display: block; font: 600 17px var(--font-display); }
.st span { font-size: 12.5px; color: var(--muted); }
.st.on { opacity: 1; }
.st.pending.on { border-color: var(--muted); background: var(--tint); }
.st.fulfilled.on { border-color: var(--green); background: color-mix(in srgb, var(--green) 14%, var(--surface)); }
.st.rejected.on { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--surface)); }
.arrow { color: var(--muted); font-size: 20px; }
.handlers { margin: 16px 0 0; display: grid; gap: 8px; }
.h { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 500 13px var(--font-mono); background: var(--bg); transition: all .25s; flex-wrap: wrap; }
.h .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.h.ran { border-color: var(--green); } .h.ran .dot { background: var(--green); }
.h.skip { opacity: .45; } .h.skip .dot { background: var(--red); }
.h .msg { margin-left: auto; color: var(--muted); font-family: var(--font-body); font-size: 13px; }

/* closures */
.counters { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
.cc { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg); }
.cc .scope { font: 500 12px var(--font-mono); color: var(--muted); }
.cc .big { font: 700 44px var(--font-display); line-height: 1.1; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
.cc .name { font: 600 14px var(--font-display); }

/* prototype */
.levels { display: grid; gap: 6px; margin-top: 16px; max-width: 520px; }
.lv { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; transition: all .2s; background: var(--bg); }
.lv b { font: 600 15px var(--font-display); margin-right: 8px; }
.lv .props { display: inline-flex; gap: 6px; flex-wrap: wrap; vertical-align: middle; }
.lv .p { font: 500 12px var(--font-mono); background: var(--tint); border-radius: 6px; padding: 2px 7px; }
.lv.look { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--surface)); }
.lv.hit { border-color: var(--green); background: color-mix(in srgb, var(--green) 16%, var(--surface)); }
.lv.miss { opacity: .6; }
.link { color: var(--muted); font: 500 12px var(--font-mono); padding-left: 18px; }
.result { margin-top: 14px; font: 500 14px var(--font-mono); min-height: 1.6em; }

/* this */
.split { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 18px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: 500 12.5px var(--font-mono); }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.detail { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.detail .callcode { font: 500 14px var(--font-mono); background: var(--code-bg); color: var(--code-fg); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
.badge { display: inline-block; font: 600 14px var(--font-mono); padding: 6px 12px; border-radius: 8px; background: var(--tint); }
.badge.good { background: color-mix(in srgb, var(--green) 18%, var(--surface)); }
.badge.bad { background: color-mix(in srgb, var(--red) 18%, var(--surface)); }

/* bubbling */
.nest { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px 18px; background: var(--bg); }
.nest .nest { background: var(--tint); margin-top: 8px; }
.nest > b { font: 600 13px var(--font-mono); display: block; margin-bottom: 4px; pointer-events: none; }
.nest button.target { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; }
.flash { animation: flash .5s; }
@keyframes flash { from { border-color: var(--blue); } to { border-color: var(--line); } }
.bub { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.log { list-style: none; margin: 0; padding: 0; font: 500 12.5px var(--font-mono); display: grid; gap: 4px; align-content: start; max-height: 300px; overflow-y: auto; }
.log li { padding: 5px 9px; border-radius: 7px; background: var(--bg); display: flex; gap: 8px; }
.log li.head { background: transparent; color: var(--muted); padding-top: 10px; }
.log .ph { font-weight: 600; width: 8ch; flex: none; }
.log .capture .ph { color: var(--blue); } .log .bubble .ph { color: var(--green); }
.checks { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; font-size: 14px; }
.checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }

/* debounce */
canvas.tl { width: 100%; height: 190px; display: block; border-radius: 10px; background: var(--bg); }
.pad { margin-top: 12px; border: 2px dashed var(--line); border-radius: 12px; padding: 22px 12px; text-align: center; color: var(--muted); user-select: none; touch-action: none; }
.pad:hover { border-color: var(--blue); color: var(--fg); }
.range { display: flex; gap: 12px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.range input { accent-color: var(--blue); }
.counts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font: 500 13px var(--font-mono); }
.counts b { font-size: 20px; font-family: var(--font-display); margin-right: 4px; }

/* arrays */
.pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 42px; }
.pill { font: 600 15px var(--font-mono); min-width: 42px; text-align: center; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); transition: all .2s; }
.pill.hit { border-color: var(--green); background: color-mix(in srgb, var(--green) 16%, var(--surface)); }
.pill.dim { opacity: .35; }
.pill.out { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); animation: pop .35s ease backwards; }
.lbl { font: 600 12px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 8px; }
.ops { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.ops button { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: 500 13px var(--font-mono); }
.ops button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input.txt { font: 500 14px var(--font-mono); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: min(260px, 100%); }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 20; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.foot { color: var(--muted); font-size: 13px; padding-top: 36px; }
.foot a { color: var(--fg); }

@media (max-width: 720px) {
  .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .bub { grid-template-columns: minmax(0, 1fr); }
  .bar { flex-direction: column; align-items: flex-start; gap: 8px; }
  .tabs { width: 100%; }
  .stage { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function hl(src) {
  const esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const re = /(\/\/.*)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|new|if|else|for|of|await|async|class|this|true|false|null|undefined)\b|\b(\d+)\b/g;
  return esc.replace(re, (m, c, s, k, n) => c ? `<span class="c">${m}</span>` : s ? `<span class="s">${m}</span>` : k ? `<span class="k">${m}</span>` : `<span class="n">${m}</span>`);
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2000);
}
function frame(m) {
  const sec = h('section', { class: 'topic' },
    h('p', { class: 'kicker' }, m.kicker), h('h2', null, m.title), h('p', { class: 'lede' }, m.lede));
  const stage = h('div', { class: 'stage' });
  sec.append(stage);
  if (m.code) sec.append(h('pre', { class: 'code', html: hl(m.code) }));
  if (m.say) sec.append(h('p', { class: 'say' }, h('b', null, 'Say it like this: '), m.say));
  return { sec, stage };
}

/* ---------- 1. Event loop ---------- */
const EL_CODE = [
  "console.log('A');",
  "setTimeout(() => console.log('B'), 0);",
  "Promise.resolve().then(() => console.log('C'));",
  "console.log('D');"
];
const S = (hl, stack, web, micro, macro, out, note) => ({ hl, stack, web, micro, macro, out, note });
const EL_STEPS = [
  S(-1, [], [], [], [], [], 'Guess the output order before you press Next. The script is about to start.'),
  S(0, ['main()', 'log(A)'], [], [], [], [], 'Line 1 runs on the call stack.'),
  S(0, ['main()'], [], [], [], ['A'], 'A is printed.'),
  S(1, ['main()', 'setTimeout()'], ['timer 0ms'], [], [], ['A'], 'setTimeout hands the timer to the browser and returns at once.'),
  S(1, ['main()'], ['timer 0ms'], [], [], ['A'], 'The code keeps going. The timer waits outside the stack.'),
  S(2, ['main()', 'then()'], ['timer 0ms'], [], [], ['A'], 'The promise is already resolved, so its callback is queued right away.'),
  S(2, ['main()'], ['timer 0ms'], ['log(C)'], [], ['A'], 'log(C) waits in the microtask queue.'),
  S(3, ['main()', 'log(D)'], ['timer 0ms'], ['log(C)'], [], ['A'], 'Line 4 is still synchronous, so it runs before any queue.'),
  S(3, ['main()'], ['timer 0ms'], ['log(C)'], [], ['A', 'D'], 'D is printed.'),
  S(-1, [], [], ['log(C)'], ['log(B)'], ['A', 'D'], 'The script ends. The timer is done, so log(B) moves to the macrotask queue.'),
  S(-1, ['log(C)'], [], [], ['log(B)'], ['A', 'D'], 'The stack is empty. Microtasks go first, so log(C) runs.'),
  S(-1, [], [], [], ['log(B)'], ['A', 'D', 'C'], 'C is printed. No microtasks are left.'),
  S(-1, ['log(B)'], [], [], [], ['A', 'D', 'C'], 'Now the loop takes one macrotask: log(B).'),
  S(-1, [], [], [], [], ['A', 'D', 'C', 'B'], 'Done. The order is A, D, C, B.')
];
function renderEventLoop() {
  const { sec, stage } = frame({
    kicker: 'Async / the one everyone asks', title: 'The event loop',
    lede: 'JavaScript runs one thing at a time. Step through a real snippet and watch where each piece of code waits.',
    say: 'Synchronous code runs first, then every microtask (promises), then one macrotask (a timer), and the loop repeats.'
  });
  const codeBox = h('div', { class: 'codebox' }, EL_CODE.map((l, n) => h('div', { class: 'cl', 'data-n': n }, h('span', { class: 'ln' }, n + 1), h('code', { html: hl(l) }))));
  const defs = [['stack', 'Call stack', 'runs now'], ['web', 'Web APIs', 'waiting outside'], ['micro', 'Microtasks', 'promises, first'], ['macro', 'Macrotasks', 'timers, one at a time']];
  const lists = {};
  const cols = h('div', { class: 'cols' }, defs.map(([k, t, s]) => {
    lists[k] = h('div', { class: 'list' + (k === 'stack' ? ' stack' : '') });
    return h('div', { class: 'col' }, h('h4', null, t), h('small', null, s), lists[k]);
  }));
  const out = h('div', { class: 'out' });
  const note = h('p', { class: 'note' });
  const stepLbl = h('span', { class: 'step' });
  let i = 0, timer = null;
  const prevB = h('button', { class: 'btn alt', onclick: () => go(i - 1) }, 'Back');
  const nextB = h('button', { class: 'btn', onclick: () => go(i + 1) }, 'Next');
  const playB = h('button', { class: 'btn alt', onclick: () => toggle() }, 'Auto-play');
  const resetB = h('button', { class: 'btn alt', onclick: () => { stop(); go(0); } }, 'Reset');
  function stop() { clearInterval(timer); timer = null; playB.textContent = 'Auto-play'; }
  function toggle() {
    if (timer) return stop();
    if (i >= EL_STEPS.length - 1) go(0);
    playB.textContent = 'Pause';
    timer = setInterval(() => { if (i >= EL_STEPS.length - 1) stop(); else go(i + 1); }, 1500);

    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    if (on) a.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>

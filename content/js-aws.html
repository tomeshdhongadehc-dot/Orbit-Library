<title>AWS Orbit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fira+Code:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* AWS Orbit: night-sky theme, glowing floating tiles, lesson map, segmented progress. */
:root {
  --bg: #080c1d; --panel: #111936; --panel2: #1a2450; --ink: #eef1ff; --muted: #9aa6d8; --line: #28346a; --dot: #34417e;
  --a1: #2de2c4; --a2: #9b7bff; --a3: #ffb62e; --a4: #ff5d8f; --shadow: rgba(0, 0, 0, .5); --glow: rgba(45, 226, 196, .8); --pillbg: #0b1230;
  --idea: #2d2470; --tip: #0f4440; --warn: #5a3a0c; --catch: #5c1c3c; --wrap: #1d2c70;
  --disp: "Sora", system-ui, sans-serif; --body: "DM Sans", system-ui, sans-serif; --mono: "Fira Code", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
    --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
    --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1ff; --panel: #ffffff; --panel2: #e8ecff; --ink: #161b40; --muted: #56608f; --line: #d3d9f3; --dot: #bcc4ea;
  --a1: #0a9a85; --a2: #6a47e0; --a3: #d97706; --a4: #e11d62; --shadow: rgba(50, 60, 120, .25); --glow: rgba(10, 154, 133, .55); --pillbg: #ffffff;
  --idea: #e4dafd; --tip: #cdf3ea; --warn: #fde8bd; --catch: #fcd5e4; --wrap: #dbe3ff; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: clip; }
body { margin: 0; background: radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--a2) 22%, transparent), transparent), radial-gradient(700px 380px at 5% 0%, color-mix(in srgb, var(--a1) 14%, transparent), transparent), var(--bg); color: var(--ink); font: 14px/1.6 var(--body); padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px)); padding-block: 0 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; position: relative; z-index: 20; }
.brand { font: 700 18px var(--disp); display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; }
.ring { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, var(--a1), var(--a2), var(--a4), var(--a3), var(--a1)); position: relative; }
.ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
.menu { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font: 600 12.5px var(--disp); display: flex; gap: 8px; align-items: center; }
.menu:hover { border-color: var(--a1); }
.spacer { flex: 1; }
.pg { font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.bar { width: 110px; height: 6px; border-radius: 6px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); }
.map { display: none; position: absolute; left: 0; right: 0; top: 100%; max-height: min(70vh, 640px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 24px 60px var(--shadow); }
.map.show { display: block; }
.map h3 { margin: 12px 0 8px; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.map h3:first-child { margin-top: 0; }
.map h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.lc { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: flex; gap: 9px; align-items: center; }
.lc:hover { border-color: var(--a1); }
.lc.on { border-color: var(--a1); box-shadow: 0 0 0 1px var(--a1) inset; }
.lc b { font: 600 12px var(--mono); color: var(--muted); width: 22px; flex: none; }
.lc span { font: 600 13px var(--disp); line-height: 1.25; flex: 1; }
.lc em { font-style: normal; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 10px; }
.lc.done em { background: var(--a1); border-color: var(--a1); color: #04201c; }
.lc.done em::after { content: "\2713"; font-weight: 700; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.center { min-width: 0; display: grid; gap: 10px; }
.crumb { font: 500 11.5px var(--mono); color: var(--a1); margin: 0; letter-spacing: .04em; }
.head h1 { font: 700 clamp(22px, 3.4vw, 32px)/1.1 var(--disp); margin: 4px 0 4px; letter-spacing: -.02em; background: linear-gradient(90deg, var(--ink), color-mix(in srgb, var(--a2) 60%, var(--ink))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font: 500 11px var(--mono); border-radius: 999px; padding: 2px 10px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.chip:nth-child(1) { color: var(--a1); border-color: color-mix(in srgb, var(--a1) 50%, var(--line)); }
.chip:nth-child(2) { color: var(--a3); border-color: color-mix(in srgb, var(--a3) 50%, var(--line)); }
.chip:nth-child(3) { color: var(--a4); border-color: color-mix(in srgb, var(--a4) 50%, var(--line)); }
.stagebox { position: relative; background: radial-gradient(640px 300px at 50% 42%, color-mix(in srgb, var(--a2) 20%, var(--panel)), var(--panel)); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.read { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; max-width: calc(100% - 200px); }
.rd { background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-left: 3px solid var(--a1); border-radius: 8px; padding: 3px 10px; min-width: 80px; backdrop-filter: blur(6px); }
.rd:nth-child(2) { border-left-color: var(--a3); } .rd:nth-child(3) { border-left-color: var(--a4); } .rd:nth-child(4) { border-left-color: var(--a2); }
.rd small { display: block; font: 500 9.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.rd b { font: 600 13px var(--mono); color: var(--ink); }
.tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 2; }
.sbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font: 600 12px var(--disp); }
.sbtn:hover { border-color: var(--a1); }
.scrollx { overflow: hidden; }
svg.scene { display: block; width: 100%; height: auto; max-height: calc(100vh - 290px); }
.gdot { fill: var(--dot); }
.face { stroke: color-mix(in srgb, #fff 30%, transparent); stroke-width: 1; stroke-linejoin: round; }
.deco { stroke: none; }
.shadow { fill: var(--shadow); stroke: none; filter: blur(5px); }
.glyph { font: 600 12px var(--mono); fill: #060c1c; text-anchor: middle; pointer-events: none; }
.pillbox { fill: var(--pillbg); stroke: color-mix(in srgb, var(--a1) 55%, var(--line)); stroke-width: 1.2; }
.pt { font: 600 12.5px var(--mono); fill: var(--ink); text-anchor: middle; }
.ps { font: 400 10.5px var(--mono); fill: var(--muted); text-anchor: middle; }
.n { transition: transform .75s cubic-bezier(.3, .8, .3, 1); }
.in { transition: opacity .45s, transform .6s cubic-bezier(.3, 1.4, .5, 1); }
.in.off { opacity: 0; transform: translateY(-22px) scale(.92); }
.n.dim .in { opacity: .28; }
.n.hi .in { filter: drop-shadow(0 0 10px var(--glow)); animation: bob 1.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.eg { fill: none; stroke-width: 2.4; stroke-linecap: round; animation: draw .5s ease backwards; }
.eg circle { filter: drop-shadow(0 0 5px var(--glow)); }
@keyframes draw { from { opacity: 0; } to { opacity: 1; } }
.legend { display: flex; gap: 12px 16px; padding: 4px 14px 10px; font: 400 11px var(--mono); color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stepper { overflow-x: hidden; position: sticky; bottom: 8px; z-index: 6; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 12px; box-shadow: 0 -8px 24px var(--shadow); }
.stepper h5 { margin: 0 0 8px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; background: none; border: 0; padding: 0; text-align: left; }
.dot span.c { display: block; width: 100%; height: 7px; border-radius: 99px; background: var(--line); font-size: 0; transition: background .3s; }
.dot.past span.c { background: var(--a1); opacity: .7; }
.dot.cur span.c { background: linear-gradient(90deg, var(--a1), var(--a2), var(--a4)); box-shadow: 0 0 12px var(--glow); }
.dot span.l { font: 500 10.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot.cur span.l { color: var(--ink); font-weight: 600; }
.panel { position: sticky; top: 8px; display: grid; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 15px; position: relative; overflow: hidden; }
.card:first-child::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--a1), var(--a2), var(--a4)); }
.stephead { display: flex; justify-content: space-between; align-items: center; font: 500 11px var(--mono); color: var(--muted); }
.tag { border-radius: 999px; padding: 2px 10px; font: 600 10px var(--mono); letter-spacing: .08em; color: var(--ink); }
.tag.PROBLEM { background: var(--catch); } .tag.CONCEPT { background: var(--idea); } .tag.TECHNIQUE { background: var(--tip); } .tag.WATCH { background: var(--warn); } .tag.RECAP { background: var(--wrap); }
.card h2 { font: 700 19px/1.25 var(--disp); margin: 9px 0 8px; letter-spacing: -.01em; }
.card p { margin: 0 0 8px; }
.card code, .kc code { font: 500 12px var(--mono); background: var(--panel2); border-radius: 5px; padding: 1px 5px; color: var(--a1); }
pre.cd { background: #060a17; color: #dbe4ff; font: 400 12px/1.65 var(--mono); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.kc { border-radius: 12px; padding: 9px 12px; margin-top: 10px; border-left: 3px solid var(--a2); }
.kc small { display: block; font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; color: var(--muted); }
.kc.idea { background: var(--idea); border-color: var(--a2); } .kc.know { background: var(--tip); border-color: var(--a1); } .kc.warn { background: var(--warn); border-color: var(--a3); }
.chg { margin-top: 10px; font-size: 12.5px; }
.chg small { font: 600 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chg ul { margin: 4px 0 0; padding-left: 16px; }
.nav { display: flex; gap: 8px; margin-top: 12px; }
.nbtn { border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); background: var(--panel2); }
.nbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; flex: 1; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.nbtn:disabled { opacity: .35; cursor: default; }
.hint { font: 400 10.5px var(--mono); color: var(--muted); margin-top: 8px; }
.learn h4 { margin: 0 0 6px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.learn label { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 2px 0; color: var(--muted); }
.learn label.on { color: var(--ink); }
.learn .bx { width: 14px; height: 14px; border: 1.5px solid var(--dot); border-radius: 50%; flex: none; margin-top: 3px; display: grid; place-items: center; font-size: 9px; }
.learn label.on .bx { background: var(--a1); border-color: var(--a1); color: #04201c; }
.learn label.on .bx::after { content: "\2713"; font-weight: 700; }
@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
  .read { max-width: 100%; position: static; padding: 8px 10px 0; }
  .tools { position: static; padding: 8px 10px 0; }
  .pg .bar { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 13.5px; }
  .dot span.l { display: none; }
  .sbtn { padding: 3px 10px; }
  .rd { min-width: 0; }
  .card h2 { font-size: 17px; }
  svg.scene { max-height: 56vh; }
  .stepper { padding: 8px 10px; }
  .grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style>
[hidden] { display: none !important; }
.mode { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode a { font: 600 12.5px var(--disp); color: var(--muted); text-decoration: none; padding: 5px 14px; border-radius: 999px; }
.mode a.on { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; }
#iv { display: grid; gap: 12px; max-width: 980px; margin: 0 auto; }
.ivhero { display: flex; gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.ivhero h1 { font: 700 clamp(24px, 4vw, 34px)/1.1 var(--disp); margin: 4px 0; letter-spacing: -.02em; }
.ivprog { min-width: 150px; display: grid; gap: 4px; font: 500 12px var(--mono); color: var(--muted); }
.ivprog b { font: 700 22px var(--disp); color: var(--ink); }
.ivprog .bar { width: 100%; }
.how { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font: 600 12px var(--disp); }
.how .chip { color: var(--a1); }
.ivtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.ivtab { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: 600 13px var(--disp); display: flex; gap: 8px; align-items: center; }
.ivtab em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.ivtab:hover { border-color: var(--a1); }
.ivtab.on { background: linear-gradient(90deg, color-mix(in srgb, var(--a1) 28%, var(--panel)), color-mix(in srgb, var(--a2) 28%, var(--panel))); border-color: var(--a1); }
.tabdesc { margin: 0; }
.ivbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ivbar input { flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 8px 12px; font: 14px var(--body); }
.ivbar input:focus { outline: 2px solid var(--a1); outline-offset: 1px; }
.chip.fb { cursor: pointer; }
.chip.fb.on { background: var(--a1); color: #04201c; border-color: var(--a1); }
.ivlist { display: grid; gap: 8px; }
.ivc { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ivc[open] { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.ivc summary { list-style: none; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 11px 14px; }
.ivc summary::-webkit-details-marker { display: none; }
.ivc .num { font: 600 12px var(--mono); color: var(--a2); }
.ivc .tt { flex: 1; font: 600 14.5px/1.35 var(--disp); }
.ivc .tt small { display: block; font: 400 11px var(--mono); color: var(--muted); margin-top: 2px; }
.lvl { font: 600 10px var(--mono); border-radius: 999px; padding: 2px 9px; background: var(--panel2); color: var(--muted); letter-spacing: .04em; }
.lvl.l-mustknow, .lvl.l-tricky { color: var(--a4); } .lvl.l-easy { color: var(--a1); } .lvl.l-medium, .lvl.l-common { color: var(--a3); } .lvl.l-seniorish { color: var(--a2); }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--dot); flex: none; display: grid; place-items: center; font-size: 11px; font-style: normal; }
.ivc.done .tick { background: var(--a1); border-color: var(--a1); color: #04201c; }
.ivc.done .tick::after { content: "\2713"; font-weight: 700; }
.ivb { padding: 4px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.ivb .ask { margin: 8px 0 0; font-size: 14.5px; }
.ivb .lab { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 4px; }
.ivb .kc { margin: 0; }
.ivb pre.cd { margin: 0; }
.ivl { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.ivbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font: 600 12.5px var(--disp); justify-self: start; }
.ivbtn:hover:not(:disabled) { border-color: var(--a1); }
.ivbtn:disabled { opacity: .45; cursor: default; }
.ivbtn.go { background: linear-gradient(90deg, var(--a1), var(--a2)); color: #06121f; border: 0; }
.ivbtn.mark { margin-top: 4px; }
.ivb .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ans { display: grid; gap: 8px; }
.hint-i { background: var(--panel2); border-left: 3px solid var(--a3); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; margin-top: 6px; }
.empty { color: var(--muted); padding: 20px; text-align: center; }
@media (max-width: 640px) { .ivc summary { padding: 10px; gap: 8px; } .lvl { display: none; } .mode a { padding: 5px 10px; } }
</style>

<style>
#rv { display: grid; gap: 12px; max-width: 1100px; margin: 0 auto; }
.cs { columns: 300px; column-gap: 12px; }
.csc { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tone, var(--a1)); border-radius: 14px; padding: 4px 12px 8px; margin: 0 0 12px; }
.csc h3 { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px; font: 700 14px var(--disp); }
.csc h3 em { font: 500 10.5px var(--mono); font-style: normal; color: var(--muted); }
.csdef, .csidea { margin: 4px 0 0; font-size: 12.5px; }
.csdef b, .csidea b { font: 700 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--tone, var(--a1)); margin-right: 4px; }
.csidea { background: var(--panel2); border-left: 3px solid var(--tone, var(--a1)); border-radius: 8px; padding: 6px 10px; margin: 8px 0 6px; }
.csr { padding: 7px 0; border-top: 1px dashed var(--line); }
.csr:first-of-type { border-top: 0; }
.csr pre { margin: 0; font: 500 12px/1.5 var(--mono); color: var(--tone, var(--a1)); white-space: pre-wrap; overflow-wrap: anywhere; }
.csr p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.rvlist { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.rvlist.day { grid-template-columns: 1fr; }
.rvb { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.rvb.done { border-color: color-mix(in srgb, var(--a1) 55%, var(--line)); }
.rvh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.rvh h3 { margin: 0; font: 700 16px var(--disp); }
.rvh small { display: block; font: 500 11px var(--mono); color: var(--muted); }
.rvn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--disp); background: linear-gradient(135deg, var(--a1), var(--a2)); color: #06121f; flex: none; }
.rvt { font: 600 11.5px var(--mono); color: var(--a3); background: var(--panel2); border-radius: 999px; padding: 3px 11px; flex: none; }
.rvcks { display: grid; gap: 4px; }

  for (const [m, re] of MODEL_RULES) if (re.test(text)) return m;

function applyModels() {
  LESSONS.forEach(L => {
    for (const id in L.nodes) {

      n.m = m;

      n.k = 'cube'; delete n.r;
      n.w = SZ[m].w; n.d = SZ[m].d; n.h = SZ[m].h;
    }
  });
}

    st('TECHNIQUE', 'Events arrive in three ways', ['Synchronous: the caller waits for the answer, as with API Gateway.', 'Asynchronous: the event is queued and retried on failure, as with S3 or SNS.', 'Polling: Lambda reads from a stream or queue such as SQS or Kinesis.'], { hi: ['ev', 'fn'], e: ['e1'], read: [['API', 'sync'], ['S3', 'async'], ['SQS', 'polled']], key: ['know', 'The way it is invoked decides how errors and retries behave.'], short: 'Sources' }),
    st('CONCEPT', 'The execution role decides what it can do', ['The function runs as an IAM role. That role lists which AWS services it may call.', 'Without an Allow for DynamoDB, the write fails.'], { add: ['role', 'db'], e: ['e1', 'e2', 'e3'], hi: ['role', 'db'], key: ['warn', 'Give each function only the permissions it needs.'], short: 'Role' }),
    st('WATCH OUT', 'Cold starts add delay', ['When there is no ready copy of your function, Lambda starts a new execution environment first. That first call is slower.', 'Later calls reuse the environment, so create clients outside the handler.'], { add: ['cold'], hi: ['cold'], code: J1('const client = new DynamoDBClient({});   // created once, reused', '', 'export const handler = async (event) => {', '  // uses client', '};'), key: ['idea', 'Provisioned concurrency keeps copies warm when latency matters.'], short: 'Cold start' }),
    st('TECHNIQUE', 'Concurrency and timeouts', ['Each simultaneous request gets its own copy, so Lambda scales out fast. There is an account limit, and you can reserve some for a function.', 'A function also has a timeout. Set it to what the job needs, not the maximum.'], { rm: ['cold'], add: ['conc'], hi: ['conc'], key: ['know', 'A traffic spike can exhaust concurrency and starve other functions.'], short: 'Concurrency' }),
    st('WATCH OUT', 'Events can arrive twice', ['Asynchronous and queue events are delivered at least once. Your function may see the same event again.', 'Make it idempotent: processing the same event twice must give the same result.'], { hi: ['fn'], e: ['e1', 'e3'], code: J1('export const handler = async (event) => {', '  if (await alreadyProcessed(event.id)) return;   // safe to retry', '  await process(event);', '  await markProcessed(event.id);', '};'), key: ['warn', 'Charging a card twice is what idempotency prevents.'], short: 'Idempotent' }),
    st('RECAP', 'Remember', ['Event in, handler runs, role decides access. Create clients outside the handler to reuse them.', 'Expect cold starts, concurrency limits, and duplicate events.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'containers', lvl: 1, title: 'Containers: ECS, EKS and Fargate', sub: 'Package once, run anywhere, and choose who runs the machines.', min: 9, diff: 'Intermediate',
  learn: ['Images and ECR', 'ECS vs EKS', 'Fargate vs EC2 launch', 'Task role vs execution role'],
  nodes: {
    img: { k: 'cube', p: [-3.6, -1.4], c: 'amber', g: 'img', t: 'Container image', s: 'app plus its libraries' },
    ecr: { k: 'hex', p: [-3.6, 1.8], c: 'pink', g: 'ECR', t: 'ECR registry', s: 'stores images', r: 36, h: 32 },
    ecs: { k: 'cube', p: [0, -1.4], c: 'purple', g: 'ECS', t: 'ECS', s: 'AWS-native orchestrator' },
    eks: { k: 'cube', p: [0, 1.8], c: 'purple', g: 'K8s', t: 'EKS', s: 'managed Kubernetes' },
    fg: { k: 'hex', p: [3.6, -1.4], c: 'pink', g: 'Fargate', t: 'Fargate', s: 'no servers to manage', r: 36, h: 32 },
    ec2: { k: 'cube', p: [3.6, 1.8], c: 'gray', g: 'EC2', t: 'EC2 nodes', s: 'you manage them' }
  },
  edges: {
    p1: { a: 'img', b: 'ecr', t: 'push', pk: true },
    p2: { a: 'ecr', b: 'ecs', t: 'pull', pk: true, bend: 18 },
    p3: { a: 'ecr', b: 'eks', t: 'pull', pk: true },
    r1: { a: 'ecs', b: 'fg', t: 'runs on', pk: true },
    r2: { a: 'ecs', b: 'ec2', t: 'or on', dash: true, bend: 18 }
  },
  steps: [
    st('PROBLEM', 'It works on my machine', ['Apps break when the server has different libraries. A container image bundles the app with everything it needs, so it runs the same everywhere.'], { add: ['img'], hi: ['img'], code: J1('FROM node:20-alpine', 'WORKDIR /app', 'COPY . .', 'RUN npm ci --omit=dev', 'CMD ["node", "server.js"]'), key: ['idea', 'Build the image once. Run the same image in every environment.'], short: 'The catch' }),
    st('TECHNIQUE', 'ECR stores the images', ['Elastic Container Registry is AWS\'s private image store. You tag the image and push it, and your services pull from it.'], { add: ['ecr'], e: ['p1'], hi: ['ecr'], code: J1('aws ecr get-login-password | docker login --username AWS \\', '  --password-stdin <account>.dkr.ecr.<region>.amazonaws.com', 'docker push <account>.dkr.ecr.<region>.amazonaws.com/web:1.0'), short: 'ECR' }),
    st('CONCEPT', 'ECS runs containers the AWS way', ['In Elastic Container Service you describe a task (which image, how much CPU and memory) and a service that keeps a number of tasks running.', 'It is simpler than Kubernetes and tied to AWS.'], { add: ['ecs'], e: ['p1', 'p2'], hi: ['ecs'], key: ['know', 'Task definition is the blueprint. Service keeps copies alive.'], short: 'ECS' }),
    st('CONCEPT', 'EKS is managed Kubernetes', ['Elastic Kubernetes Service runs the Kubernetes control plane for you. You work with the normal tools: kubectl, Pods, Deployments.', 'It is more portable and more complex.'], { add: ['eks'], e: ['p1', 'p2', 'p3'], hi: ['eks'], key: ['idea', 'Pick EKS if you already use Kubernetes or need its ecosystem. Otherwise ECS is simpler.'], short: 'EKS' }),
    st('TECHNIQUE', 'Fargate or your own EC2 nodes', ['With Fargate, AWS runs the machines. You only say how much CPU and memory the task needs.', 'With EC2 you manage a fleet of servers yourself, which gives more control and more work.'], { add: ['fg', 'ec2'], e: ['p1', 'p2', 'r1', 'r2'], hi: ['fg', 'ec2'], key: ['know', 'Start on Fargate. Move to EC2 only for special hardware or tight cost control.'], short: 'Fargate' }),
    st('WATCH OUT', 'Two roles, two jobs', ['The task execution role lets ECS itself pull the image and write logs.', 'The task role is what your application code uses to call AWS services such as S3.'], { hi: ['ecs'], e: ['p1', 'p2', 'r1'], code: J1('{', '  "family": "web",', '  "networkMode": "awsvpc",', '  "requiresCompatibilities": ["FARGATE"],', '  "cpu": "256",', '  "memory": "512",', '  "executionRoleArn": "arn:aws:iam::123456789012:role/ecsTaskExecutionRole",', '  "taskRoleArn": "arn:aws:iam::123456789012:role/webTaskRole",', '  "containerDefinitions": [{', '    "name": "web",', '    "image": "123456789012.dkr.ecr.eu-west-1.amazonaws.com/web:1.0",', '    "portMappings": [{ "containerPort": 3000 }]', '  }]', '}'), key: ['warn', 'Mixing up the two roles is a classic "AccessDenied" mystery.'], short: 'Two roles' }),
    st('RECAP', 'Remember', ['Image in ECR. Run it with ECS or EKS. Fargate removes the servers.', 'Execution role for ECS itself, task role for your code.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 's3', lvl: 2, title: 'S3: Object Storage', sub: 'Unlimited-feeling storage for files, reached over an API instead of a disk.', min: 9, diff: 'Beginner',
  learn: ['Buckets, objects and keys', 'Storage classes and lifecycle rules', 'Versioning and keeping data private', 'Presigned URLs for temporary access'],
  nodes: {
    app: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'app', t: 'Your app', s: 'PUT and GET' },
    bkt: { k: 'hex', p: [-0.6, 0], c: 'amber', g: 'S3', t: 'Bucket', s: 'flat key space', r: 38, h: 34 },
    obj: { k: 'cube', p: [2.4, -1.6], c: 'amber', g: 'obj', t: 'Object', s: 'img/cat.png' },
    cls: { k: 'cube', p: [2.4, 1.6], c: 'orange', g: 'tier', t: 'Storage classes', s: 'cost vs access' },
    ver: { k: 'cube', p: [-0.6, -2.6], c: 'teal', g: 'v2', t: 'Versions', s: 'old copies kept' },
    pol: { k: 'cube', p: [-0.6, 2.6], c: 'red', g: 'deny', t: 'Bucket policy', s: 'private by default' },
    url: { k: 'cube', p: [3.9, 0], c: 'green', g: 'URL', t: 'Presigned URL', s: 'expires soon' }
  },
  edges: {
    e1: { a: 'app', b: 'bkt', t: 'PUT / GET', pk: true },
    e2: { a: 'bkt', b: 'obj', t: 'key', pk: true },
    e3: { a: 'bkt', b: 'cls', t: 'tiers' },
    e4: { a: 'bkt', b: 'ver', t: 'versioning' },
    e5: { a: 'pol', b: 'bkt', t: 'guards', dash: true, c: 'red' },
    e6: { a: 'bkt', b: 'url', t: 'signed', pk: true }
  },
  steps: [
    st('PROBLEM', 'Files need a home that never fills up', ['S3 stores objects, which are files plus metadata, inside buckets. You reach them through an HTTPS API, not a mounted disk.', 'It is the default place for images, backups, logs and static sites.'], { add: ['app', 'bkt'], e: ['e1'], hi: ['bkt'], read: [['Service', 'S3']], code: 'aws s3 cp cat.png s3://my-bucket/img/cat.png', key: ['idea', 'S3 is object storage: whole objects in, whole objects out. It is not a file system.'], short: 'The need' }),
    st('CONCEPT', 'A bucket holds objects by key', ['The key is the full name of the object, such as img/cat.png. The slash is just a character. The console shows folders, but they are only key prefixes.', 'S3 gives strong read-after-write consistency, so a new object can be read right after the PUT succeeds.'], { add: ['obj'], e: ['e1', 'e2'], hi: ['obj'], read: [['Key', 'img/cat.png']], key: ['know', 'Bucket names are globally unique across all AWS accounts.'], short: 'Keys' }),
    st('TECHNIQUE', 'Storage classes trade cost for access', ['Standard is for hot data. Infrequent-access classes cost less to store but charge to read. Glacier classes are for archives and take longer to retrieve. Intelligent-Tiering moves objects for you.', 'A lifecycle rule moves objects to cheaper classes or deletes them after a number of days.'], { add: ['cls'], e: ['e2', 'e3'], hi: ['cls'], read: [['Rule', 'age based']], code: '{\n  "Rules": [{\n    "ID": "archive-logs",\n    "Status": "Enabled",\n    "Filter": { "Prefix": "logs/" },\n    "Transitions": [\n      { "Days": 30, "StorageClass": "STANDARD_IA" },\n      { "Days": 90, "StorageClass": "GLACIER" }\n    ],\n    "Expiration": { "Days": 365 }\n  }]\n}', key: ['know', 'Lifecycle rules are the easy answer to "how do we cut S3 cost for old logs".'], short: 'Classes' }),
    st('TECHNIQUE', 'Versioning protects against mistakes', ['With versioning on, an overwrite keeps the old version, and a delete only adds a delete marker. You can restore an earlier version.', 'Once enabled, versioning can be suspended but not switched off.'], { rm: ['obj', 'cls'], add: ['ver'], e: ['e1', 'e4'], hi: ['ver'], read: [['Delete', 'adds a marker']], code: 'aws s3api put-bucket-versioning \\\n  --bucket my-bucket \\\n  --versioning-configuration Status=Enabled', key: ['warn', 'Old versions still cost storage. Pair versioning with a lifecycle rule.'], short: 'Versions' }),
    st('WATCH OUT', 'Keep it private on purpose', ['New buckets are private. Block Public Access is a safety switch that stops a policy or ACL from making data public by accident.', 'Grant access with IAM roles or a bucket policy that names a specific principal.'], { rm: ['ver'], add: ['pol'], e: ['e1', 'e5'], hi: ['pol'], read: [['Public', 'blocked']], code: '{\n  "Version": "2012-10-17",\n  "Statement": [{\n    "Sid": "AppReadOnly",\n    "Effect": "Allow",\n    "Principal": { "AWS": "arn:aws:iam::111122223333:role/app-role" },\n    "Action": "s3:GetObject",\n    "Resource": "arn:aws:s3:::my-bucket/*"\n  }]\n}', key: ['warn', 'A public bucket is one of the most common causes of leaked data.'], short: 'Private' }),
    st('TECHNIQUE', 'Presigned URLs give temporary access', ['A presigned URL carries a signature and an expiry time. Anyone holding it can do that one action until it expires, with the permissions of whoever signed it.', 'It lets a browser upload or download straight from S3 without making the bucket public.'], { rm: ['pol'], add: ['url'], e: ['e1', 'e6'], hi: ['url'], read: [['Expires', 'in minutes']], code: "import { S3Client, GetObjectCommand } from '@aws-sdk/client-s3';\nimport { getSignedUrl } from '@aws-sdk/s3-request-presigner';\n\nconst url = await getSignedUrl(\n  new S3Client({}),\n  new GetObjectCommand({ Bucket, Key }),\n  { expiresIn: 300 }\n);", key: ['know', 'Typical pattern: your API signs, the client talks to S3 directly, and your servers skip the heavy transfer.'], short: 'Presigned' }),
    st('RECAP', 'Remember', ['Objects in buckets, found by key. Pick the storage class by access pattern, then let lifecycle rules move data.', 'Stay private by default, version what matters, and share with presigned URLs.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'block-file-storage', lvl: 2, title: 'EBS and EFS: Block and File Storage', sub: 'A disk for one server, a shared folder for many, and a scratch disk that vanishes.', min: 9, diff: 'Beginner',
  learn: ['What EBS volumes are and where they live', 'Snapshots and restoring', 'EFS as a shared file system', 'When instance store data is lost'],
  nodes: {
    ec2: { k: 'cube', p: [-3.4, 0], c: 'purple', g: 'EC2', t: 'EC2 in AZ-a', s: 'your server' },
    ebs: { k: 'cube', p: [-0.6, -1.6], c: 'amber', g: 'EBS', t: 'EBS volume', s: 'disk in AZ-a' },
    snap: { k: 'cube', p: [2.4, -2.2], c: 'pink', g: 'snap', t: 'Snapshot', s: 'backup copy' },
    ec2b: { k: 'cube', p: [2.4, 1.2], c: 'purple', g: 'EC2', t: 'EC2 in AZ-b', s: 'another server' },
    efs: { k: 'hex', p: [-0.6, 1.8], c: 'amber', g: 'EFS', t: 'EFS', s: 'shared folder', r: 38, h: 34 },
    inst: { k: 'cube', p: [-3.4, 2.6], c: 'orange', g: 'tmp', t: 'Instance store', s: 'scratch only' }
  },
  edges: {
    e1: { a: 'ec2', b: 'ebs', t: 'attached', pk: true },
    e2: { a: 'ebs', b: 'snap', t: 'incremental', pk: true },
    e3: { a: 'ebs', b: 'ec2b', t: 'cannot attach', dash: true, c: 'red' },
    e4: { a: 'ec2', b: 'efs', t: 'NFS mount', pk: true },
    e5: { a: 'ec2b', b: 'efs', t: 'NFS mount', pk: true },
    e6: { a: 'inst', b: 'ec2', t: 'local disk', dash: true }
  },
  steps: [
    st('PROBLEM', 'A server needs disk, but which kind?', ['An EC2 instance needs somewhere to keep its operating system and data. AWS offers several kinds, each with different rules.', 'Start with the most common one: EBS.'], { add: ['ec2', 'ebs'], e: ['e1'], hi: ['ebs'], read: [['Block', 'EBS']], key: ['idea', 'Three shapes of storage: block (EBS), file (EFS) and object (S3).'], short: 'The need' }),
    st('CONCEPT', 'EBS is a network disk in one AZ', ['An EBS volume is block storage that you attach to an instance, like a virtual hard drive. It lives in a single Availability Zone and keeps its data when the instance stops.', 'Types trade price for speed: gp3 is the general SSD, io2 is for high provisioned IOPS, and HDD types suit big sequential work.'], { hi: ['ebs'], read: [['Scope', 'one AZ']], key: ['know', 'Whether a volume survives instance termination depends on its Delete on termination setting.'], short: 'EBS' }),
    st('TECHNIQUE', 'Snapshots are your backups', ['A snapshot is a point-in-time copy of a volume, stored durably by AWS. After the first one, each snapshot saves only the blocks that changed.', 'You can restore a snapshot into a new volume, even in another AZ or Region.'], { add: ['snap'], e: ['e1', 'e2'], hi: ['snap'], read: [['Backup', 'incremental']], code: 'aws ec2 create-snapshot \\\n  --volume-id vol-0abc1234 \\\n  --description "nightly"', short: 'Snapshots' }),
    st('WATCH OUT', 'A volume cannot cross AZs', ['An EBS volume attaches only to instances in its own AZ. You cannot attach it to a server in another zone.', 'To move data, snapshot the volume and create a new volume from it in the other AZ.'], { add: ['ec2b'], e: ['e1', 'e2', 'e3'], hi: ['ec2b'], read: [['AZ-b', 'cannot attach']], key: ['warn', 'Snapshot, then restore in the target AZ. That is the standard answer.'], short: 'AZ bound' }),
    st('CONCEPT', 'EFS is a shared file system', ['EFS is a managed network file system you mount over NFS. Many instances, across many AZs, can read and write the same files at once.', 'It grows and shrinks automatically. It is for Linux; Windows file shares use FSx.'], { rm: ['snap', 'ebs'], add: ['efs'], e: ['e4', 'e5'], hi: ['efs'], read: [['Shared', 'many servers']], code: 'sudo mount -t nfs4 fs-0abc.efs.us-east-1.amazonaws.com:/ /mnt/shared', key: ['idea', 'Need the same files on every web server? Reach for EFS.'], short: 'EFS' }),
    st('WATCH OUT', 'Instance store is only scratch space', ['Instance store is a disk physically inside the host. It is very fast, but the data is lost when the instance stops, terminates, or its hardware fails.', 'Use it for caches, buffers and temporary files that can be rebuilt.'], { rm: ['ec2b', 'efs'], add: ['inst', 'ebs'], e: ['e1', 'e6'], hi: ['inst'], read: [['On stop', 'data gone']], key: ['warn', 'Never keep the only copy of anything on instance store.'], short: 'Ephemeral' }),
    st('RECAP', 'Pick the right shape', ['EBS is one disk for one server in one AZ. EFS is a shared folder. Instance store is scratch. S3 is objects.', 'Back up EBS with snapshots, and copy them across AZs or Regions when you need to move or protect data.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'rds-aurora', lvl: 2, title: 'RDS and Aurora', sub: 'Managed relational databases: AWS runs the servers, you run the schema.', min: 9, diff: 'Intermediate',
  learn: ['What RDS manages for you', 'Multi-AZ vs read replicas', 'Backups and point-in-time restore', 'How Aurora is different'],
  nodes: {
    app: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'app', t: 'Your app', s: 'SQL queries' },
    pri: { k: 'hex', p: [-0.6, 0], c: 'amber', g: 'DB', t: 'Primary', s: 'reads and writes', r: 38, h: 34 },
    stb: { k: 'cube', p: [2.4, -2.0], c: 'amber', g: 'DB', t: 'Standby in AZ-b', s: 'synchronous copy' },
    rep: { k: 'cube', p: [2.4, 1.6], c: 'amber', g: 'DB', t: 'Read replica', s: 'async copy' },
    bkp: { k: 'cube', p: [-0.6, -2.6], c: 'pink', g: 'bak', t: 'Backups', s: 'snapshots and logs' },
    aur: { k: 'hex', p: [-0.6, 2.4], c: 'pink', g: 'Aur', t: 'Aurora storage', s: 'shared, 6 copies, 3 AZs', r: 38, h: 34 },
    fo: { k: 'orb', p: [3.9, -0.2], c: 'red', t: 'Failover', s: 'DNS flips' }
  },
  edges: {
    e1: { a: 'app', b: 'pri', t: 'SQL', pk: true },
    e2: { a: 'pri', b: 'stb', t: 'sync', pk: true },
    e3: { a: 'pri', b: 'rep', t: 'async', pk: true },
    e4: { a: 'pri', b: 'bkp', t: 'daily + logs' },
    e5: { a: 'pri', b: 'aur', t: 'storage layer' },
    e6: { a: 'stb', b: 'fo', t: 'promoted', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'Running a database yourself is a job', ['Patching, backups, failover and monitoring take real effort. Amazon RDS does that work for you on engines like PostgreSQL, MySQL, MariaDB, Oracle and SQL Server. Aurora is AWS own MySQL and PostgreSQL compatible engine.', 'You still design the schema, write the queries and tune the indexes.'], { add: ['app', 'pri'], e: ['e1'], hi: ['pri'], read: [['Managed', 'RDS']], key: ['idea', 'RDS removes the server chores, not the database design work.'], short: 'The need' }),
    st('CONCEPT', 'Multi-AZ is for availability', ['In a Multi-AZ setup RDS keeps a standby copy in another AZ and replicates to it synchronously. If the primary fails, RDS promotes the standby and flips the endpoint.', 'In the classic Multi-AZ instance setup the standby does not serve reads.'], { add: ['stb'], e: ['e1', 'e2'], hi: ['stb'], read: [['Goal', 'stay up']], key: ['know', 'Multi-AZ is about surviving failure. It is not a way to scale reads.'], short: 'Multi-AZ' }),
    st('CONCEPT', 'Read replicas are for scaling reads', ['A read replica receives changes asynchronously and serves read-only queries. You can add several, and even place one in another Region.', 'Because replication is async, a replica can lag. A read right after a write may return old data.'], { add: ['rep'], e: ['e1', 'e2', 'e3'], hi: ['rep'], read: [['Goal', 'scale reads']], key: ['warn', 'Send reads that must be fresh to the primary, not to a replica.'], short: 'Replicas' }),
    st('TECHNIQUE', 'Backups and point-in-time restore', ['Automated backups take a daily snapshot and keep transaction logs. Together they let you restore to any second inside the retention period.', 'A restore always creates a new instance. Manual snapshots stay until you delete them.'], { rm: ['stb', 'rep'], add: ['bkp'], e: ['e1', 'e4'], hi: ['bkp'], read: [['Restore', 'new instance']], code: 'aws rds restore-db-instance-to-point-in-time \\\n  --source-db-instance-identifier prod-db \\\n  --target-db-instance-identifier prod-db-restore \\\n  --restore-time 2025-03-14T10:30:00Z', short: 'Backups' }),
    st('CONCEPT', 'Aurora separates compute from storage', ['Aurora keeps its data in a shared storage layer, copied six ways across three AZs, that grows automatically. Database instances sit on top and share it.', 'Readers attach to the same storage, so replicas have little lag and failover is quick.'], { rm: ['bkp'], add: ['aur'], e: ['e1', 'e5'], hi: ['aur'], read: [['Copies', 'six, three AZs']], key: ['idea', 'Aurora replicates storage, not whole databases. That is why it recovers quickly.'], short: 'Aurora' }),
    st('WATCH OUT', 'Failover changes who answers', ['During a failover the endpoint name points to a new instance, and open connections drop.', 'Always connect by the cluster or instance endpoint name, never an IP address, and make your app retry connections.'], { rm: ['aur'], add: ['stb', 'fo'], e: ['e1', 'e2', 'e6'], hi: ['fo'], read: [['Connect by', 'endpoint name']], key: ['warn', 'Cached DNS and long-lived connection pools are the usual cause of long outages after failover.'], short: 'Failover' }),
    st('RECAP', 'Remember', ['Multi-AZ gives availability. Read replicas give read scale. Backups give point-in-time restore into a new instance.', 'Aurora trades a shared, replicated storage layer for faster recovery and easier read scaling.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'dynamodb', lvl: 2, title: 'DynamoDB', sub: 'A serverless key-value and document database that you design around your queries.', min: 10, diff: 'Intermediate',
  learn: ['Partition keys and sort keys', 'Query vs Scan', 'Global secondary indexes', 'Capacity modes and hot partitions'],

    pb: { k: 'cube', p: [2.4, 1.6], c: 'amber', g: 'B', t: 'Partition B', s: 'USER#77' },

    e2: { a: 'tbl', b: 'pa', t: 'hash(PK)', pk: true },
    e3: { a: 'tbl', b: 'pb', t: 'hash(PK)', pk: true },
    e4: { a: 'tbl', b: 'gsi', t: 'copies items' },

  },
  steps: [
    st('PROBLEM', 'Fast at any size, if you ask the right way', ['DynamoDB is serverless and gives steady single-digit millisecond reads and writes at huge scale. There are no joins and no ad hoc queries.', 'So you design the table around the questions your app asks, called access patterns.'], { add: ['app', 'tbl'], e: ['e1'], hi: ['tbl'], read: [['Style', 'key-value']], key: ['idea', 'In SQL you model the data first. In DynamoDB you model the queries first.'], short: 'The need' }),
    st('CONCEPT', 'Partition key and sort key', ['The partition key is hashed to choose where an item lives. The sort key orders items that share a partition key. Together they identify one item.', 'Many entity types can share one table by using prefixes in the keys.'], { add: ['pa', 'pb'], e: ['e1', 'e2', 'e3'], hi: ['pa', 'pb'], read: [['Item id', 'PK + SK']], code: '{\n  "PK": "USER#42",\n  "SK": "ORDER#2025-03-14#001",\n  "total": 1999\n}', short: 'Keys' }),
    st('TECHNIQUE', 'Query beats Scan', ['Query reads items under one partition key, optionally narrowed by the sort key. It touches only what you ask for.', 'Scan reads the whole table and filters afterwards, so it gets slower and costlier as the table grows.'], { add: ['scan'], e: ['e1', 'e2', 'e5'], hi: ['scan'], read: [['Cost', 'Query is small']], code: '{\n  "TableName": "App",\n  "KeyConditionExpression": "PK = :pk AND begins_with(SK, :p)",\n  "ExpressionAttributeValues": {\n    ":pk": { "S": "USER#42" },\n    ":p": { "S": "ORDER#" }\n  }\n}', key: ['warn', 'A Scan in a hot code path is a design smell.'], short: 'Query' }),
    st('TECHNIQUE', 'Global secondary indexes', ['A GSI lets you query by a different key, for example email instead of user id. DynamoDB keeps a copy of the projected attributes under the new key.', 'GSI reads are eventually consistent. A local secondary index shares the table partition key and can only be created with the table.'], { rm: ['scan'], add: ['gsi'], e: ['e1', 'e4'], hi: ['gsi'], read: [['Reads', 'eventually consistent']], key: ['know', 'Strongly consistent reads are available on the base table, not on a GSI.'], short: 'GSI' }),
    st('CONCEPT', 'Capacity: on-demand or provisioned', ['On-demand charges per request and scales without planning. Provisioned lets you set read and write capacity, with auto scaling, which can cost less for steady traffic.', 'Go over the limit and requests are throttled. The SDK retries with backoff, but your app should handle the error too.'], { rm: ['gsi'], e: ['e1', 'e2', 'e3'], hi: ['tbl'], read: [['Throttle', 'retry with backoff']], key: ['know', 'Unpredictable traffic points to on-demand. Steady, known traffic points to provisioned.'], short: 'Capacity' }),
    st('WATCH OUT', 'Hot partitions', ['Throughput is spread by partition key. If most requests share one key, such as a date or a status, that partition becomes the bottleneck even when the table has spare capacity.', 'Choose high-cardinality keys, or add a random suffix to spread a busy key.'], { rm: ['pb'], add: ['hot'], e: ['e1', 'e2', 'e6'], hi: ['hot'], read: [['Fix', 'spread the keys']], key: ['warn', 'Many distinct partition key values is the single most important DynamoDB rule.'], short: 'Hot keys' }),
    st('RECAP', 'Remember', ['Design for access patterns. Use Query with good keys, add a GSI for a second access path, and avoid Scan on big tables.', 'Pick on-demand or provisioned capacity, and spread traffic across many partition keys.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'elasticache', lvl: 2, title: 'ElastiCache: Caching', sub: 'Keep hot data in memory so the database does less work.', min: 8, diff: 'Intermediate',
  learn: ['Why a cache helps', 'The cache-aside pattern', 'TTL, invalidation and eviction', 'Redis vs Memcached and cache stampedes'],
  nodes: {
    app: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'app', t: 'Your app', s: 'repeated reads' },
    cache: { k: 'hex', p: [-0.6, -1.2], c: 'pink', g: 'RAM', t: 'ElastiCache', s: 'in-memory', r: 38, h: 34 },
    db: { k: 'cube', p: [2.4, 1.2], c: 'amber', g: 'DB', t: 'Database', s: 'source of truth' },
    hit: { k: 'orb', p: [2.6, -2.4], c: 'green', t: 'Cache hit', s: 'fast answer' },
    ttl: { k: 'cube', p: [-3.4, 2.6], c: 'orange', g: 'TTL', t: 'Expiry', s: 'bounds staleness' },
    evict: { k: 'cube', p: [-0.6, 2.4], c: 'gray', g: 'LRU', t: 'Eviction', s: 'when memory is full' },
    herd: { k: 'cube', p: [3.9, -0.2], c: 'red', g: '!!', t: 'Stampede', s: 'many misses at once' }
  },
  edges: {
    e1: { a: 'app', b: 'cache', t: 'GET', pk: true },
    e2: { a: 'cache', b: 'hit', t: 'hit', pk: true },
    e3: { a: 'app', b: 'db', t: 'miss: read', pk: true },
    e4: { a: 'app', b: 'cache', t: 'SET', dash: true, bend: 18 },
    e5: { a: 'ttl', b: 'cache', t: 'expires', dash: true },
    e6: { a: 'evict', b: 'cache', t: 'frees space', dash: true },
    e7: { a: 'db', b: 'herd', t: 'overload', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'The same reads hit the database again and again', ['A popular product page asks the database the same question thousands of times. That is slow and wastes capacity.', 'A cache keeps recent answers in memory, which is far faster than a disk-backed database.'], { add: ['app', 'db'], e: ['e3'], hi: ['db'], read: [['Cost', 'repeat reads']], key: ['idea', 'Cache what is read often and changes rarely.'], short: 'The need' }),
    st('CONCEPT', 'Cache-aside is the usual pattern', ['The app checks the cache first. On a hit it returns at once. On a miss it reads the database, stores the result in the cache, and returns it.', 'The app owns this logic. The cache never talks to the database by itself.'], { add: ['cache', 'hit'], e: ['e1', 'e2', 'e3', 'e4'], hi: ['cache'], read: [['Miss', 'read DB, then SET']], code: "async function getUser(id) {\n  const hit = await cache.get('user:' + id);\n  if (hit) return JSON.parse(hit);\n  const user = await db.findUser(id);\n  await cache.set('user:' + id, JSON.stringify(user), { EX: 60 });\n  return user;\n}", short: 'Cache-aside' }),
    st('TECHNIQUE', 'TTL and invalidation keep data fresh', ['A TTL deletes an entry after a set time, which limits how stale it can get. When data changes you can also delete or overwrite the key.', 'Writing through the cache on every update is another option, but it adds write cost.'], { add: ['ttl'], e: ['e1', 'e5'], hi: ['ttl'], read: [['Stale for', 'up to TTL']], key: ['know', 'Cache invalidation is hard, so a short TTL is the safety net.'], short: 'TTL' }),
    st('CONCEPT', 'Eviction when memory fills up', ['Memory is limited. When it is full, the engine removes entries by a policy, such as least recently used.', 'So a cache can lose any key at any time. Treat it as a copy, never as the only home for data.'], { rm: ['ttl'], add: ['evict'], e: ['e1', 'e6'], hi: ['evict'], read: [['Policy', 'e.g. LRU']], key: ['warn', 'Never store the only copy of important data in a cache.'], short: 'Eviction' }),
    st('TECHNIQUE', 'Redis or Memcached', ['Redis supports data structures such as lists, sets and sorted sets, plus persistence, replication and pub/sub. It suits sessions, leaderboards and queues.', 'Memcached is simple and multi-threaded, with no persistence or replication. It suits a plain, disposable cache.'], { rm: ['evict'], e: ['e1', 'e2'], hi: ['cache'], read: [['Default pick', 'Redis']], key: ['know', 'If you need anything beyond get and set, choose Redis.'], short: 'Engines' }),
    st('WATCH OUT', 'Cache stampede', ['When a hot key expires, many requests miss at the same moment and all hit the database together.', 'Reduce the risk with random TTL jitter, or let one request rebuild the value while others wait.'], { add: ['herd'], e: ['e3', 'e7'], hi: ['herd'], read: [['Fix', 'jitter the TTL']], code: 'const ttl = 60 + Math.floor(Math.random() * 30);\n// 60 to 89 seconds, so keys do not all expire together', key: ['warn', 'Expiring many keys at the same second invites a stampede.'], short: 'Stampede' }),
    st('RECAP', 'Remember', ['Cache-aside: check the cache, fall back to the database, then fill the cache. Add a TTL and expect eviction.', 'Choose Redis for rich features and Memcached for the simplest cache, and guard hot keys against stampedes.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'vpc', lvl: 3, title: 'VPC: Networking', sub: 'Your own private network inside AWS: subnets, routes, gateways and firewalls.', min: 11, diff: 'Intermediate',
  learn: ['CIDR blocks and subnets', 'What makes a subnet public', 'NAT gateways for private subnets', 'Security groups, NACLs and endpoints'],
  nodes: {
    net: { k: 'orb', p: [-3.9, -0.4], c: 'blue', t: 'Internet', s: 'users and APIs' },

    sg: { k: 'cube', p: [-2.4, 2.6], c: 'teal', g: 'SG', t: 'Security group', s: 'stateful, per instance' },
    ep: { k: 'cube', p: [3.6, 2.6], c: 'pink', g: 'EP', t: 'VPC endpoint', s: 'private path to S3' },
    vtag: { k: 'tag', p: [-3.4, -2.6], t: 'VPC 10.0.0.0/16' }
  },
  edges: {
    e1: { a: 'net', b: 'igw', t: 'in and out', pk: true },
    e2: { a: 'igw', b: 'pub', t: 'route 0.0.0.0/0', pk: true },
    e3: { a: 'priv', b: 'nat', t: 'outbound', pk: true },
    e4: { a: 'nat', b: 'pub', t: 'lives here', dash: true },
    e5: { a: 'sg', b: 'priv', t: 'allow rules', dash: true },
    e6: { a: 'priv', b: 'ep', t: 'no internet', pk: true }
  },
  steps: [
    st('PROBLEM', 'Resources need a private network you control', ['A VPC is your own isolated network inside one Region. You choose its address range in CIDR notation, for example 10.0.0.0/16.', 'Everything you launch lives in a subnet inside it.'], { add: ['vtag', 'net'], hi: ['vtag'], read: [['VPC', '10.0.0.0/16']], key: ['idea', 'Pick a CIDR big enough, and one that does not overlap networks you may connect later.'], short: 'The need' }),
    st('CONCEPT', 'Subnets slice the VPC, one AZ each', ['A subnet is a range of addresses inside the VPC, located in a single Availability Zone. Use several, in different AZs, for resilience.', 'AWS reserves five addresses in every subnet, so a /24 gives 251 usable addresses, not 256.'], { add: ['pub', 'priv'], hi: ['pub', 'priv'], read: [['/24 usable', '251']], code: '// 2 ** (32 - 24) = 256 addresses in a /24\n// minus 5 reserved by AWS = 251 usable', key: ['know', 'A subnet is public or private because of its route table, not because of its name.'], short: 'Subnets' }),
    st('TECHNIQUE', 'The internet gateway makes a subnet public', ['A subnet is public when its route table sends 0.0.0.0/0 to an internet gateway. The instance also needs a public or Elastic IP.', 'The internet gateway is one horizontally scaled, highly available door for the whole VPC.'], { add: ['igw'], e: ['e1', 'e2'], hi: ['igw', 'pub'], read: [['Route', '0.0.0.0/0 to IGW']], key: ['warn', 'No route to the gateway, or no public IP, and the instance is not reachable.'], short: 'Public' }),
    st('TECHNIQUE', 'A NAT gateway lets private servers go out', ['Private subnets have no route to the internet gateway. To download patches, they send outbound traffic to a NAT gateway placed in a public subnet.', 'The internet can never start a connection to them through it. Run one per AZ for resilience.'], { add: ['nat'], e: ['e3', 'e4'], hi: ['nat', 'priv'], read: [['Direction', 'outbound only']], key: ['know', 'Private subnet to NAT to internet gateway is the classic outbound path.'], short: 'NAT' }),
    st('CONCEPT', 'Security groups and NACLs are two firewalls', ['A security group is attached to an instance. It is stateful, so return traffic is allowed automatically, and it only has allow rules.', 'A network ACL is attached to a subnet. It is stateless, so you must allow both directions, and it supports allow and deny rules.'], { rm: ['nat'], add: ['sg'], e: ['e5'], hi: ['sg'], read: [['SG', 'stateful, allow only']], code: 'aws ec2 authorize-security-group-ingress \\\n  --group-id sg-0abc1234 \\\n  --protocol tcp --port 443 \\\n  --cidr 10.0.1.0/24', key: ['know', 'Use security groups first. Add NACLs only for subnet-wide blocks.'], short: 'Firewalls' }),
    st('TECHNIQUE', 'VPC endpoints keep traffic off the internet', ['A gateway endpoint (S3 and DynamoDB) adds a route inside your VPC. An interface endpoint, powered by PrivateLink, puts a private address in your subnet for many other services.', 'Private servers can then reach those services without a NAT gateway or any internet path.'], { rm: ['sg', 'igw', 'pub'], add: ['ep'], e: ['e6'], hi: ['ep'], read: [['Path', 'stays inside AWS']], key: ['know', 'Endpoints improve security and often cut NAT data costs.'], short: 'Endpoints' }),
    st('RECAP', 'Remember', ['VPC is your network, subnets live in one AZ, and routes decide public or private. NAT is for outbound only.', 'Security groups are stateful and instance-level. NACLs are stateless and subnet-level. Endpoints keep AWS traffic private.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'dns-cdn', lvl: 3, title: 'Route 53 and CloudFront', sub: 'Turn names into addresses, then serve content from a location near the user.', min: 9, diff: 'Intermediate',
  learn: ['DNS records and alias records', 'Routing policies', 'How CloudFront caches at the edge', 'TTLs, invalidation and versioned files'],
  nodes: {
    user: { k: 'cube', p: [-3.6, 0], c: 'blue', g: 'user', t: 'User', s: 'far away' },
    r53: { k: 'hex', p: [-1.0, -1.8], c: 'pink', g: 'DNS', t: 'Route 53', s: 'name to address', r: 38, h: 34 },
    cf: { k: 'cube', p: [-0.6, 1.2], c: 'pink', g: 'CDN', t: 'CloudFront edge', s: 'cache near users' },
    org: { k: 'cube', p: [3.0, 0.4], c: 'amber', g: 'org', t: 'Origin', s: 'S3 or load balancer' },
    hit: { k: 'orb', p: [2.6, -2.4], c: 'green', t: 'Edge hit', s: 'served from cache' },
    old: { k: 'cube', p: [3.9, 2.8], c: 'red', g: 'old', t: 'Stale copy', s: 'until TTL ends' },
    oac: { k: 'cube', p: [-3.4, 2.6], c: 'teal', g: 'OAC', t: 'Origin access', s: 'S3 stays private' }
  },
  edges: {
    e1: { a: 'user', b: 'r53', t: 'who is it?', pk: true },
    e2: { a: 'user', b: 'cf', t: 'HTTPS', pk: true },
    e3: { a: 'cf', b: 'org', t: 'miss: fetch', pk: true },
    e4: { a: 'cf', b: 'hit', t: 'hit', pk: true },
    e5: { a: 'oac', b: 'org', t: 'signed access', dash: true },
    e6: { a: 'cf', b: 'old', t: 'cached', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'Names must become addresses, and distance is slow', ['Browsers use names like shop.example.com. DNS translates a name into an IP address. Route 53 is the AWS DNS service.', 'Users far from your servers also see higher latency, so we will also bring the content closer.'], { add: ['user', 'r53'], e: ['e1'], hi: ['r53'], read: [['DNS', 'Route 53']], key: ['idea', 'DNS answers "where is it?". A CDN answers "how do I get it fast?".'], short: 'The need' }),
    st('CONCEPT', 'Records and the alias record', ['An A record maps a name to an IPv4 address, AAAA to IPv6, CNAME to another name, MX to mail servers, and TXT to text such as domain proofs.', 'A CNAME cannot sit at the zone apex (example.com). Route 53 alias records can, and they point straight at AWS resources such as CloudFront or a load balancer.'], { hi: ['r53'], read: [['Apex', 'use an alias']], key: ['know', 'Alias is the Route 53 answer to "CNAME at the root domain".'], short: 'Records' }),
    st('TECHNIQUE', 'Routing policies pick the answer', ['Simple returns one answer. Weighted splits traffic by percentage. Latency routes to the Region with the lowest latency. Failover uses health checks to switch to a backup.', 'Geolocation answers by the user country, and multivalue returns several healthy addresses.'], { hi: ['r53'], read: [['Failover', 'needs health checks']], key: ['know', 'Weighted is the usual tool for gradual releases, failover for disaster recovery.'], short: 'Policies' }),
    st('CONCEPT', 'CloudFront caches at the edge', ['CloudFront keeps copies of your content in edge locations near users. The first request for an object is a miss, so the edge fetches it from the origin and keeps a copy.', 'Later requests are hits served directly from the edge, which cuts latency and load on your origin.'], { add: ['cf', 'org', 'hit'], e: ['e2', 'e3', 'e4'], hi: ['cf'], read: [['First request', 'miss, then hit']], key: ['idea', 'Origin load drops because most requests never reach it.'], short: 'CloudFront' }),
    st('TECHNIQUE', 'Cache controls and a private origin', ['The cache key says which requests count as the same object, such as path plus selected query strings. How long it lives comes from Cache-Control headers or the policy TTL.', 'Origin Access Control lets only your distribution read an S3 bucket, so the bucket can stay private.'], { rm: ['hit', 'r53'], add: ['oac'], e: ['e2', 'e3', 'e5'], hi: ['oac'], read: [['Bucket', 'stays private']], code: '{\n  "Version": "2012-10-17",\n  "Statement": [{\n    "Effect": "Allow",\n    "Principal": { "Service": "cloudfront.amazonaws.com" },\n    "Action": "s3:GetObject",\n    "Resource": "arn:aws:s3:::my-bucket/*",\n    "Condition": { "StringEquals": {\n      "AWS:SourceArn": "arn:aws:cloudfront::111122223333:distribution/EDFDVBD6EXAMPLE"\n    } }\n  }]\n}', short: 'Cache keys' }),
    st('WATCH OUT', 'Stale content and slow DNS changes', ['A cached copy stays until its TTL ends or you invalidate it. DNS answers are also cached by resolvers for the record TTL, so a change spreads slowly.', 'Lower the DNS TTL before a migration. For files, use versioned names such as app.4f3a.js so new content never needs invalidation.'], { rm: ['oac'], add: ['old'], e: ['e2', 'e3', 'e6'], hi: ['old'], read: [['Best fix', 'versioned file names']], code: 'aws cloudfront create-invalidation \\\n  --distribution-id EDFDVBD6EXAMPLE \\\n  --paths "/index.html"', key: ['warn', 'Invalidating everything on every deploy is the slow, costly way. Version the file names.'], short: 'Stale' }),
    st('RECAP', 'Remember', ['Route 53 answers names with records, aliases and routing policies. CloudFront serves cached copies from the edge.', 'Keep the origin private with OAC, and use versioned file names so TTLs never get in your way.'], { hi: [], short: 'Recap' })
  ]
});

const J3 = (...a) => a.join('\n');

lesson({
  id: 'messaging', lvl: 4, title: 'SQS, SNS and EventBridge', sub: 'Three ways to pass messages between services without tying them together.', min: 9, diff: 'Intermediate',
  learn: ['Why direct calls are fragile', 'Queue: buffer and retry with SQS', 'Topic: fan out with SNS', 'Event bus: route by rules with EventBridge'],
  nodes: {
    prod: { k: 'cube', p: [-3.4, 0], c: 'blue', g: 'app', t: 'Producer', s: 'sends work' },
    cons: { k: 'cube', p: [3.4, 0], c: 'purple', g: 'fn', t: 'Consumer', s: 'does the work' },
    q: { k: 'hex', p: [0, 0], c: 'pink', g: 'SQS', t: 'SQS queue', s: 'holds messages', r: 38, h: 34 },
    dlq: { k: 'cube', p: [0, 2.8], c: 'red', g: '!', t: 'Dead-letter queue', s: 'messages that keep failing' },
    topic: { k: 'hex', p: [0, 0], c: 'pink', g: 'SNS', t: 'SNS topic', s: 'pushes to everyone', r: 38, h: 34 },
    a: { k: 'cube', p: [3.4, -1.6], c: 'purple', g: 'fn', t: 'Email service', s: 'subscriber' },
    b: { k: 'cube', p: [3.4, 1.6], c: 'purple', g: 'fn', t: 'Billing', s: 'subscriber' },
    bus: { k: 'hex', p: [0, 0], c: 'pink', g: 'EB', t: 'EventBridge bus', s: 'matches rules', r: 38, h: 34 }
  },
  edges: {
    d1: { a: 'prod', b: 'cons', t: 'direct call', dash: true, c: 'red' },
    e1: { a: 'prod', b: 'q', t: 'send', pk: true },
    e2: { a: 'q', b: 'cons', t: 'poll', pk: true },
    e3: { a: 'q', b: 'dlq', t: 'after N tries', dash: true, c: 'red' },
    f0: { a: 'prod', b: 'topic', t: 'publish', pk: true },
    f1: { a: 'topic', b: 'a', t: 'push', pk: true },
    f2: { a: 'topic', b: 'b', t: 'push', pk: true },
    g0: { a: 'prod', b: 'bus', t: 'put event', pk: true },
    g1: { a: 'bus', b: 'a', t: 'rule match', pk: true },
    g2: { a: 'bus', b: 'b', t: 'rule match', pk: true }
  },
  steps: [
    st('PROBLEM', 'Direct calls tie services together', ['If the producer calls the consumer directly, both must be up at the same moment.', 'A slow or failing consumer makes the producer slow or failing too.'], { add: ['prod', 'cons'], e: ['d1'], hi: ['prod', 'cons'], read: [['coupling', 'tight']], key: ['warn', 'One slow service can drag down every service that calls it.'], short: 'The catch' }),
    st('CONCEPT', 'A queue sits in the middle', ['Amazon SQS stores messages until a consumer is ready. The producer sends and moves on.', 'If the consumer is down, messages wait safely in the queue.'], { add: ['q'], e: ['e1', 'e2'], hi: ['q'], read: [['queue', 'buffers work']], key: ['idea', 'A queue absorbs spikes. The consumer works at its own pace.'], short: 'SQS' }),
    st('TECHNIQUE', 'Receive, process, then delete', ['A consumer receives a message and SQS hides it for the visibility timeout. If you delete it in time, it is gone.', 'If you crash or are too slow, it becomes visible again and is retried.'], { hi: ['cons'], e: ['e1', 'e2'], code: J3("const { Messages } = await sqs.send(new ReceiveMessageCommand({", "  QueueUrl, WaitTimeSeconds: 10   // long polling", "}));", "await handle(Messages[0]);", "await sqs.send(new DeleteMessageCommand({", "  QueueUrl, ReceiptHandle: Messages[0].ReceiptHandle", "}));"), key: ['know', 'Long polling (WaitTimeSeconds) means fewer empty responses.'], short: 'Visibility' }),
    st('WATCH OUT', 'At-least-once and the dead-letter queue', ['A standard queue can deliver a message more than once and not always in order. Make consumers idempotent: processing twice must be safe.', 'A redrive policy moves a message to a dead-letter queue after too many failed receives, so one bad message does not block everything.'], { add: ['dlq'], e: ['e1', 'e2', 'e3'], hi: ['dlq'], code: JSON.stringify({ deadLetterTargetArn: 'arn:aws:sqs:eu-west-1:123456789012:orders-dlq', maxReceiveCount: 5 }, null, 2), key: ['warn', 'Need strict order and de-duplication? Use a FIFO queue. It is slower and has lower throughput than standard.'], short: 'DLQ' }),
    st('CONCEPT', 'A topic fans out to many', ['Amazon SNS is publish and subscribe. One publish is pushed to every subscriber: queues, Lambda functions, HTTP endpoints, email or SMS.', 'A common pattern is SNS to several SQS queues, so each subscriber gets its own buffer.'], { rm: ['q', 'cons', 'dlq'], add: ['topic', 'a', 'b'], e: ['f0', 'f1', 'f2'], hi: ['topic'], read: [['subscribers', '2']], key: ['idea', 'Queue: one group of consumers shares the work. Topic: everyone gets a copy.'], short: 'SNS' }),
    st('TECHNIQUE', 'An event bus routes by rules', ['Amazon EventBridge receives events and sends each one to the targets whose rule matches its content.', 'It also takes events from AWS services and SaaS partners, and can archive and replay events.'], { rm: ['topic'], add: ['bus'], set: { a: { t: 'Lambda', s: 'rule: OrderCreated' }, b: { t: 'Analytics', s: 'rule: every event' } }, e: ['g0', 'g1', 'g2'], hi: ['bus'], code: JSON.stringify({ source: ['shop.orders'], 'detail-type': ['OrderCreated'] }, null, 2), key: ['know', 'SNS filters by message attributes. EventBridge matches on the event body.'], short: 'EventBridge' }),
    st('RECAP', 'Pick the right tool', ['SQS: buffer work for one consumer group. SNS: fan out one message to many. EventBridge: route events by content.', 'Always assume a message can arrive twice, and design the consumer to cope.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'api-gateway', lvl: 4, title: 'API Gateway', sub: 'A managed front door for your backend: routing, auth, throttling and stages.', min: 9, diff: 'Intermediate',
  learn: ['Why a front door is needed', 'REST vs HTTP APIs', 'Lambda proxy integration', 'Authorizers, throttling and stages'],
  nodes: {

  steps: [
    st('PROBLEM', 'A backend open to the world', ['If clients call your function or server directly, you must build authentication, rate limits, routing and versioning yourself.', 'Every service then repeats the same work.'], { add: ['client', 'fn'], e: ['x'], hi: ['client', 'fn'], key: ['warn', 'Exposing a backend directly leaves no single place to protect it.'], short: 'The catch' }),
    st('CONCEPT', 'Put a front door in front', ['Amazon API Gateway receives every request, then routes it to a backend such as Lambda, an HTTP service or another AWS service.', 'It is fully managed and scales with traffic.'], { add: ['gw'], e: ['c1', 'c2'], hi: ['gw'], read: [['entry point', 'one URL']], key: ['idea', 'One door gives you one place for auth, limits, logging and versions.'], short: 'The door' }),
    st('TECHNIQUE', 'REST API or HTTP API?', ['HTTP APIs are simpler, faster and cheaper, with built-in JWT authorizers.', 'REST APIs have more features: usage plans and API keys, request validation, caching and WAF support.'], { hi: ['gw'], code: J3('HTTP API : simple proxy, JWT auth, lower cost', 'REST API : keys, usage plans, validation, caching, WAF', 'WebSocket: two-way, long-lived connections'), key: ['know', 'Start with HTTP API. Pick REST API only when you need its extra features.'], short: 'API types' }),
    st('TECHNIQUE', 'Lambda proxy integration', ['With proxy integration the whole request is passed to Lambda as an event. Your function returns the status code, headers and body.', 'API Gateway does no mapping for you, so the function decides the response.'], { add: ['db'], e: ['c1', 'c2', 'c3'], hi: ['fn'], code: J3('export const handler = async (event) => {', '  const id = event.pathParameters.id;', '  return {', '    statusCode: 200,', "    headers: { 'content-type': 'application/json' },", '    body: JSON.stringify({ id })', '  };', '};'), key: ['warn', 'The body must be a string, so use JSON.stringify.'], short: 'Proxy' }),

lesson({
  id: 'step-functions', lvl: 4, title: 'Step Functions', sub: 'Run a multi-step workflow as a state machine, with retries and error handling built in.', min: 9, diff: 'Intermediate',
  learn: ['Why one big Lambda is a poor workflow', 'States and the state machine', 'Retry and Catch', 'Orchestration vs choreography'],
  nodes: {
    big: { k: 'cube', p: [0, 0], c: 'red', g: 'fn', t: 'One big Lambda', s: 'retries buried in code' },
    st: { k: 'orb', p: [-3.8, 0], c: 'blue', t: 'Start', s: 'execution begins' },
    val: { k: 'cube', p: [-1.6, 0], c: 'purple', g: 'fn', t: 'Validate', s: 'Task state' },
    pay: { k: 'cube', p: [0.8, 0], c: 'purple', g: 'fn', t: 'Pay', s: 'Task state' },
    ok: { k: 'cube', p: [3.4, -1.6], c: 'green', g: 'ok', t: 'Success', s: 'Succeed state' },
    ref: { k: 'cube', p: [3.4, 1.6], c: 'red', g: 'undo', t: 'Refund', s: 'Catch handler' },
    chor: { k: 'hex', p: [-1.6, -2.8], c: 'pink', g: 'EB', t: 'Events', s: 'choreography', r: 36, h: 32 },
    std: { k: 'tag', p: [0.8, 2.8], t: 'Standard vs Express' }
  },
  edges: {
    w1: { a: 'st', b: 'val', t: 'start', pk: true },
    w2: { a: 'val', b: 'pay', t: 'Next', pk: true },
    w3: { a: 'pay', b: 'ref', t: 'Catch', dash: true, c: 'red' },
    w4: { a: 'pay', b: 'ok', t: 'Next', pk: true }
  },
  steps: [
    st('PROBLEM', 'One function doing every step', ['A single Lambda that validates, charges and ships has to carry its own retries, waiting and error handling.', 'If it times out half way, you may not know which steps already ran.'], { add: ['big'], hi: ['big'], key: ['warn', 'Long, multi-step logic hidden in one function is hard to retry, trace or change.'], short: 'The catch' }),
    st('CONCEPT', 'A workflow as a state machine', ['AWS Step Functions describes the flow as states. Each state does one job and names the next state.', 'You write it in Amazon States Language, which is JSON.'], { rm: ['big'], add: ['st', 'val', 'pay'], e: ['w1', 'w2'], hi: ['val', 'pay'], code: JSON.stringify({ StartAt: 'Validate', States: { Validate: { Type: 'Task', Resource: 'arn:aws:lambda:eu-west-1:123456789012:function:validate', Next: 'Pay' }, Pay: { Type: 'Task', Resource: 'arn:aws:lambda:eu-west-1:123456789012:function:pay', End: true } } }, null, 2), key: ['idea', 'Each step is small. The state machine keeps the state between steps.'], short: 'States' }),
    st('TECHNIQUE', 'Retry and Catch', ['Retry runs a failed state again with a wait that grows each time. Catch sends the flow to a fallback state when retries run out.', 'You declare this in the definition instead of coding it.'], { add: ['ref'], e: ['w1', 'w2', 'w3'], hi: ['ref'], code: JSON.stringify({ Pay: { Type: 'Task', Resource: 'arn:aws:lambda:eu-west-1:123456789012:function:pay', Retry: [{ ErrorEquals: ['States.TaskFailed'], IntervalSeconds: 2, MaxAttempts: 3, BackoffRate: 2 }], Catch: [{ ErrorEquals: ['States.ALL'], Next: 'Refund' }], End: true } }, null, 2), key: ['know', 'Retry for temporary errors, Catch for failures you want to compensate.'], short: 'Retry' }),
    st('TECHNIQUE', 'More than Task states', ['Choice branches on data, Parallel runs branches together, Map repeats a step for each item, and Wait pauses. Pass, Succeed and Fail are simple helpers.', 'Many AWS services can be called directly from a state without a Lambda in between.'], { add: ['ok'], e: ['w2', 'w3', 'w4'], hi: ['ok'], code: JSON.stringify({ Review: { Type: 'Choice', Choices: [{ Variable: '$.amount', NumericGreaterThan: 100, Next: 'ManualApproval' }], Default: 'Pay' } }, null, 2), short: 'State types' }),
    st('CONCEPT', 'Orchestration or choreography?', ['Orchestration has a conductor: Step Functions owns the whole flow, so you can see and change it in one place.', 'Choreography has no conductor: services react to events, which is loosely coupled but makes the overall flow harder to see.'], { add: ['chor'], hi: ['chor', 'st'], key: ['idea', 'Use orchestration when order and error handling matter. Use events when services should stay independent.'], short: 'Two styles' }),
    st('WATCH OUT', 'Standard or Express?', ['Standard workflows can run for a long time, run each execution exactly once and keep a visible history.', 'Express workflows are for very high volume, short jobs and may run a step more than once, so steps must be idempotent. State data has a size limit, so pass a pointer to S3 for big payloads.'], { add: ['std'], hi: ['std'], key: ['warn', 'Do not put large payloads through the state machine. Pass an S3 key instead.'], short: 'Standard' }),
    st('RECAP', 'Remember', ['Step Functions turns a multi-step job into visible states with built-in Retry and Catch.', 'Standard for long and exact, Express for fast and busy. Keep payloads small.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'cloudwatch', lvl: 5, title: 'CloudWatch: Logs, Metrics and Alarms', sub: 'Know that something is wrong before your users tell you.', min: 9, diff: 'Intermediate',
  learn: ['Metrics, logs and alarms', 'Querying logs with Logs Insights', 'CloudTrail vs CloudWatch', 'Traces with X-Ray'],
  nodes: {
    app: { k: 'cube', p: [-3.4, 0], c: 'purple', g: 'app', t: 'Your app', s: 'running in prod' },
    logs: { k: 'cube', p: [0, -1.8], c: 'amber', g: 'log', t: 'Logs', s: 'groups and streams' },
    met: { k: 'cube', p: [0, 1.6], c: 'amber', g: '~', t: 'Metrics', s: 'numbers over time' },
    alarm: { k: 'cube', p: [3.4, 1.6], c: 'red', g: '!', t: 'Alarm', s: 'threshold crossed' },
    sns: { k: 'hex', p: [3.4, -1.4], c: 'pink', g: 'SNS', t: 'SNS', s: 'tells the team', r: 34, h: 30 },
    trail: { k: 'cube', p: [-3.4, 2.8], c: 'teal', g: 'API', t: 'CloudTrail', s: 'who called which API' },
    xray: { k: 'cube', p: [-3.4, -2.8], c: 'orange', g: 'trace', t: 'X-Ray', s: 'request traces' }
  },
  edges: {
    m1: { a: 'app', b: 'met', t: 'numbers', pk: true },
    l1: { a: 'app', b: 'logs', t: 'log lines', pk: true },
    a1: { a: 'met', b: 'alarm', t: 'threshold', pk: true },
    a2: { a: 'alarm', b: 'sns', t: 'notify', pk: true },
    x1: { a: 'app', b: 'xray', t: 'trace', pk: true }
  },
  steps: [
    st('PROBLEM', 'How do you know it is broken?', ['A service in production fails quietly. Without data you find out from angry users.', 'You need numbers, text records and an automatic alert.'], { add: ['app'], hi: ['app'], key: ['warn', 'If nobody is watching, a failure can last for hours.'], short: 'The catch' }),
    st('CONCEPT', 'Metrics are numbers over time', ['A metric is a series of data points, such as CPU use or request count. AWS services publish many for you.', 'You can add your own custom metrics.'], { add: ['met'], e: ['m1'], hi: ['met'], code: 'aws cloudwatch put-metric-data \\\n  --namespace Shop --metric-name Orders --value 1', key: ['warn', 'EC2 does not report memory or disk use by default. Install the CloudWatch agent for those.'], short: 'Metrics' }),
    st('TECHNIQUE', 'Logs and Logs Insights', ['Applications write log lines into log groups, split into log streams. Logs Insights lets you query them.', 'Set a retention period on every log group.'], { add: ['logs'], e: ['m1', 'l1'], hi: ['logs'], code: J3('fields @timestamp, @message', '| filter @message like /ERROR/', '| sort @timestamp desc', '| limit 20'), key: ['warn', 'By default log groups never expire, so they keep growing and costing money.'], short: 'Logs' }),
    st('TECHNIQUE', 'Alarms turn numbers into action', ['An alarm watches a metric against a threshold. Its state is OK, ALARM or INSUFFICIENT_DATA.', 'It can notify through SNS or trigger an action such as scaling.'], { add: ['alarm', 'sns'], e: ['a1', 'a2'], hi: ['alarm', 'sns'], code: J3('aws cloudwatch put-metric-alarm \\', '  --alarm-name high-cpu --namespace AWS/EC2 \\', '  --metric-name CPUUtilization --statistic Average \\', '  --period 300 --evaluation-periods 2 --threshold 80 \\', '  --comparison-operator GreaterThanThreshold \\', '  --alarm-actions <sns-topic-arn>'), key: ['know', 'Evaluating over several periods avoids alarms for a single blip.'], short: 'Alarms' }),
    st('CONCEPT', 'CloudTrail is not CloudWatch', ['CloudWatch tells you how your system performs and what it logged.', 'CloudTrail records API calls: who changed a security group, deleted a bucket or assumed a role.'], { add: ['trail'], hi: ['trail', 'logs'], key: ['idea', 'CloudWatch: how is it running? CloudTrail: who did what, and when?'], short: 'CloudTrail' }),
    st('TECHNIQUE', 'X-Ray follows one request', ['AWS X-Ray traces a request as it moves through services and shows the time spent in each hop.', 'It helps you find the slow dependency in a chain of calls.'], { add: ['xray'], e: ['x1'], hi: ['xray'], key: ['know', 'Metrics say something is slow. Traces say where.'], short: 'X-Ray' }),
    st('RECAP', 'Remember', ['Metrics for numbers, logs for details, alarms for action, dashboards for the big picture.', 'CloudTrail answers who did what. X-Ray shows where a request spent its time.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'iac', lvl: 5, title: 'CloudFormation and CDK', sub: 'Describe your infrastructure in files so it can be reviewed, repeated and rolled back.', min: 10, diff: 'Intermediate',
  learn: ['Why click-built infrastructure fails', 'Templates and stacks', 'Change sets and drift', 'CDK: code that makes templates'],
  nodes: {
    con: { k: 'cube', p: [-3.4, 0], c: 'red', g: 'click', t: 'Console clicks', s: 'not repeatable' },
    tmpl: { k: 'cube', p: [-3.4, 0], c: 'amber', g: 'yml', t: 'Template', s: 'YAML or JSON' },
    cfn: { k: 'hex', p: [-0.4, 0], c: 'pink', g: 'CFN', t: 'CloudFormation', s: 'builds it for you', r: 38, h: 34 },
    stack: { k: 'cube', p: [2.8, -1.6], c: 'purple', g: 'stk', t: 'Stack', s: 'resources as one unit' },
    res: { k: 'cube', p: [2.8, 1.6], c: 'green', g: 'S3', t: 'S3 bucket', s: 'a resource' },
    cs: { k: 'cube', p: [-0.4, -2.8], c: 'teal', g: 'diff', t: 'Change set', s: 'preview the update' },
    drift: { k: 'cube', p: [-0.4, 2.8], c: 'red', g: '?', t: 'Drift', s: 'changed by hand' },
    cdk: { k: 'cube', p: [-3.4, -2.8], c: 'orange', g: 'code', t: 'CDK app', s: 'TypeScript, Python...' }
  },
  edges: {
    t1: { a: 'tmpl', b: 'cfn', t: 'deploy', pk: true },
    t2: { a: 'cfn', b: 'stack', t: 'creates', pk: true },
    t3: { a: 'stack', b: 'res', t: 'contains', pk: true },
    c1: { a: 'cfn', b: 'cs', t: 'preview', dash: true },
    k1: { a: 'cdk', b: 'tmpl', t: 'synth', pk: true }
  },
  steps: [
    st('PROBLEM', 'Infrastructure built by clicking', ['Clicks in the console leave no record. Nobody can repeat the setup, review it or roll it back.', 'Dev and prod slowly become different.'], { add: ['con'], hi: ['con'], key: ['warn', 'If it cannot be rebuilt from a file, you do not really know what you have.'], short: 'The catch' }),
    st('CONCEPT', 'A template becomes a stack', ['In AWS CloudFormation you describe resources in a template. CloudFormation creates them together as a stack.', 'Delete the stack and it removes what it created.'], { rm: ['con'], add: ['tmpl', 'cfn', 'stack'], e: ['t1', 't2'], hi: ['tmpl', 'stack'], code: J3('Resources:', '  Bucket:', '    Type: AWS::S3::Bucket', '    Properties:', '      VersioningConfiguration:', '        Status: Enabled'), key: ['idea', 'Infrastructure as code: review it in a pull request, version it in git.'], short: 'Stack' }),
    st('TECHNIQUE', 'Parameters and outputs', ['Parameters let one template serve many environments. Outputs share values such as a bucket name with other stacks.', 'Only the Resources section is required.'], { add: ['res'], e: ['t1', 't2', 't3'], hi: ['res'], code: J3('Parameters:', '  Env:', '    Type: String', '    AllowedValues: [dev, prod]', 'Resources:', '  Bucket:', '    Type: AWS::S3::Bucket', '    Properties:', '      BucketName: !Sub "app-${Env}-assets"', 'Outputs:', '  BucketArn:', '    Value: !GetAtt Bucket.Arn'), short: 'Parameters' }),
    st('WATCH OUT', 'Preview with a change set', ['A change set shows what an update will add, change or delete before you apply it.', 'Some property changes force a replacement: the resource is deleted and recreated, which can lose data.'], { add: ['cs'], e: ['t1', 't2', 'c1'], hi: ['cs'], code: J3('aws cloudformation create-change-set \\', '  --stack-name app --change-set-name preview \\', '  --template-body file://template.yaml'), key: ['warn', 'For databases and buckets set DeletionPolicy and UpdateReplacePolicy to Retain or Snapshot.'], short: 'Change sets' }),
    st('WATCH OUT', 'Drift: someone changed it by hand', ['Drift means a real resource no longer matches its template, because someone edited it in the console.', 'Drift detection finds the difference so you can fix the template or the resource.'], { add: ['drift'], hi: ['drift'], code: 'aws cloudformation detect-stack-drift --stack-name app', key: ['know', 'Make the template the only way changes happen.'], short: 'Drift' }),
    st('TECHNIQUE', 'CDK writes the template for you', ['The AWS CDK lets you define infrastructure in a programming language. cdk synth turns it into a CloudFormation template, and cdk deploy applies it.', 'Constructs come in levels: L1 maps one-to-one to CloudFormation, L2 adds sensible defaults, L3 are whole patterns.'], { add: ['cdk'], e: ['k1', 't1', 't2'], hi: ['cdk'], code: J3("import { Stack } from 'aws-cdk-lib';", "import { Bucket } from 'aws-cdk-lib/aws-s3';", '', 'export class AppStack extends Stack {', '  constructor(scope, id) {', '    super(scope, id);', "    new Bucket(this, 'Bucket', { versioned: true });", '  }', '}'), key: ['know', 'cdk diff shows what would change, like a change set.'], short: 'CDK' }),
    st('RECAP', 'Remember', ['Templates describe, stacks create, change sets preview, drift detection catches hand edits.', 'CDK is code on top of CloudFormation. Protect stateful resources with deletion policies.'], { hi: [], short: 'Recap' })
  ]
});

lesson({
  id: 'cicd', lvl: 5, title: 'CI/CD on AWS', sub: 'Build, test and release automatically, and undo a bad release quickly.', min: 9, diff: 'Intermediate',
  learn: ['Why manual deploys fail', 'Pipeline, build and deploy stages', 'Blue/green and canary releases', 'Rollback'],
  nodes: {
    man: { k: 'cube', p: [0, 0], c: 'red', g: 'ssh', t: 'Manual deploy', s: 'copy files, hope' },
    src: { k: 'cube', p: [-3.6, 0], c: 'amber', g: 'git', t: 'Source', s: 'GitHub or S3' },
    bld: { k: 'cube', p: [-1.2, 0], c: 'purple', g: 'build', t: 'CodeBuild', s: 'test and package' },
    dep: { k: 'cube', p: [1.2, 0], c: 'purple', g: 'ship', t: 'CodeDeploy', s: 'releases it' },

    gate: { k: 'orb', p: [1.2, -2.8], c: 'teal', t: 'Approval', s: 'optional manual gate' },
    v1: { k: 'cube', p: [3.8, -1.6], c: 'gray', g: 'v1', t: 'Blue: current', s: 'serves users' },
    v2: { k: 'cube', p: [3.8, 1.6], c: 'green', g: 'v2', t: 'Green: new', s: 'tested first' },
    rb: { k: 'cube', p: [1.2, 2.8], c: 'red', g: 'undo', t: 'Rollback', s: 'back to blue' }
  },
  edges: {
    p1: { a: 'src', b: 'bld', t: 'commit', pk: true },
    p2: { a: 'bld', b: 'dep', t: 'artifact', pk: true },
    d1: { a: 'dep', b: 'v1', t: 'current', pk: true },
    d2: { a: 'dep', b: 'v2', t: 'new', pk: true },
    r1: { a: 'v2', b: 'rb', t: 'alarm fires', dash: true, c: 'red' }
  },
  steps: [
    st('PROBLEM', 'Releases done by hand', ['Copying files to a server by hand skips tests, differs each time and is hard to undo.', 'Friday evening releases become scary.'], { add: ['man'], hi: ['man'], key: ['warn', 'The more manual a release is, the more likely it is to go wrong.'], short: 'The catch' }),
    st('CONCEPT', 'A pipeline automates the path', ['AWS CodePipeline runs stages in order: source, build, test, deploy. A push to git starts it.', 'CodeBuild runs your build and tests from a buildspec file.'], { rm: ['man'], add: ['src', 'bld', 'dep', 'pipe'], e: ['p1', 'p2'], hi: ['pipe', 'bld'], code: J3('version: 0.2', 'phases:', '  install:', '    commands:', '      - npm ci', '  build:', '    commands:', '      - npm test', '      - npm run build', 'artifacts:', '  base-directory: dist', '  files:', "    - '**/*'"), key: ['idea', 'The same steps run the same way every time.'], short: 'Pipeline' }),
    st('TECHNIQUE', 'Blue/green: two environments', ['With blue/green, the current version (blue) keeps serving users while the new version (green) is deployed and tested next to it.', 'Compare with an in-place deploy, which updates the running servers and has no clean way back.'], { add: ['v1', 'v2'], e: ['p2', 'd1', 'd2'], hi: ['v1', 'v2'], key: ['know', 'CodeDeploy supports in-place and blue/green for EC2, ECS and Lambda.'], short: 'Blue/green' }),
    st('TECHNIQUE', 'Shift traffic gradually', ['A canary release sends a small share of traffic to the new version first, then the rest if it looks healthy. A linear release increases the share in steps.', 'For Lambda, CodeDeploy moves an alias from one version to another.'], { hi: ['v2'], code: J3('version: 0.0', 'Resources:', '  - OrderFn:', '      Type: AWS::Lambda::Function', '      Properties:', '        Name: order-fn', '        Alias: live', "        CurrentVersion: '1'", "        TargetVersion: '2'"), key: ['know', 'Preset configs such as LambdaCanary10Percent5Minutes describe the shift for you.'], short: 'Canary' }),
    st('WATCH OUT', 'Plan the way back', ['Attach CloudWatch alarms to the deployment. If an alarm fires, CodeDeploy can roll back to the old version automatically.', 'Rollback only works if the old version is still around and the database change is backward compatible.'], { add: ['rb'], e: ['r1'], hi: ['rb'], key: ['warn', 'Change the database in two steps so old and new code can both run.'], short: 'Rollback' }),
    st('TECHNIQUE', 'Gates and tests', ['Add an approval action for a human check before production, and run integration tests in a stage before it.', 'Automation does not remove review. It moves it to the right place.'], { add: ['gate'], hi: ['gate'], key: ['idea', 'Fast feedback early, careful control before production.'], short: 'Gates' }),
    st('RECAP', 'Remember', ['Pipeline orchestrates, CodeBuild builds and tests, CodeDeploy releases.', 'Blue/green and canary lower the risk. Alarms and a clear rollback make releases boring.'], { hi: [], short: 'Recap' })
  ]
});

/* ===== app runtime ===== */
const TAGN = { PROBLEM: 'THE CATCH', CONCEPT: 'IDEA', TECHNIQUE: 'HOW IT WORKS', WATCH: 'CAREFUL', RECAP: 'WRAP-UP' };

const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function isDark() {
  const t = document.documentElement.getAttribute('data-theme');

}
function stateAt(L, i) {

    (s.add || []).forEach(n => on.add(n));

}
function buildSide() {

function closeMap() { $('side').classList.remove('show'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
function renderHead() {
  const L = LESSONS[cur];
  $('crumb').textContent = `${LEVELS[L.lvl].name}  ·  Lesson ${cur + 1} of ${LESSONS.length}`;
  $('title').textContent = L.title; $('sub').textContent = L.sub;

}
function renderStepper() {
  const L = LESSONS[cur], n = L.steps.length;
  const h = document.createElement('h5'); h.innerHTML = `<span>Steps</span><span>${stepI + 1} / ${n}</span>`;
  const dots = document.createElement('div'); dots.className = 'dots';
  L.steps.forEach((s, i) => {

function renderPanel() {
  const L = LESSONS[cur], s = L.steps[stepI], n = L.steps.length, p = $('panel');
  const prevOn = stepI ? stateAt(L, stepI - 1).on : new Set(), now = stateAt(L, stepI).on;
  const label = (id) => { const nd = L.nodes[id]; return nd.t || nd.g || id; };
  const added = [...now].filter(x => !prevOn.has(x) && L.nodes[x].k !== 'tag' || false).map(x => '+ ' + label(x));
  const gone = [...prevOn].filter(x => !now.has(x) && L.nodes[x].k !== 'tag').map(x => '− ' + label(x));
  const chg = [...added, ...gone].slice(0, 5);

  if (chg.length) html += `<div class="chg"><small>Now on stage</small><ul>${chg.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`;
  html += `<div class="nav"><button class="nbtn" id="bk" ${stepI === 0 ? 'disabled' : ''}>Prev</button><button class="nbtn go" id="nx"><span>${stepI === n - 1 ? (cur < LESSONS.length - 1 ? 'Next lesson' : 'Finish') : 'Next'}</span><span>&rarr;</span></button></div>`;
  html += `<div class="hint">Keys: &larr; &rarr; step, space plays, R replays</div></div>`;
  html += `<div class="card learn"><h4>Goals</h4>${L.learn.map((t, i) => `<label class="${i < upto ? 'on' : ''}"><span class="bx"></span><span>${esc(t)}</span></label>`).join('')}</div>`;
  p.innerHTML = html;
  $('bk').onclick = () => go(stepI - 1); $('nx').onclick = next;
  if (stepI === n - 1) { const qc = quizCard(L); if (qc) p.firstElementChild.after(qc); }
  const rd = $('read'); rd.replaceChildren();
  (s.read || []).forEach(([k, v]) => { const d = document.createElement('div'); d.className = 'rd'; d.innerHTML = `<small>${esc(k)}</small><b>${esc(v)}</b>`; rd.append(d); });
}
function paint() {
  const L = LESSONS[cur]; DARK = isDark();
  Scene.apply(stateAt(L, stepI));
  const st0 = stateAt(L, stepI);
  Scene.apply({ ...st0, over: st0.over, hi: st0.hi, edges: st0.edges });
  renderStepper(); renderPanel();
  if (stepI === L.steps.length - 1 && !done.has(L.id)) { done.add(L.id); store.set('jsm-done', JSON.stringify([...done])); buildSide(); }
}
function go(i) {
  const n = LESSONS[cur].steps.length;
  stepI = Math.max(0, Math.min(n - 1, i)); paint();
}
function next() {
  const n = LESSONS[cur].steps.length;
  if (stepI < n - 1) go(stepI + 1);
  else if (cur < LESSONS.length - 1) location.hash = LESSONS[cur + 1].id;
  else stop();
}
function stop() { playing = false; clearInterval(timer); $('play').textContent = 'Play'; }
function play() {
  if (playing) return stop();
  playing = true; $('play').textContent = 'Pause';
  timer = setInterval(() => { const n = LESSONS[cur].steps.length; if (stepI < n - 1) go(stepI + 1); else stop(); }, 3800);
}
function open(idx) {
  stop(); cur = idx; stepI = 0; openLv.add(LESSONS[idx].lvl);
  Scene.load(LESSONS[idx]); renderHead(); buildSide();
  DARK = isDark(); Scene.refresh(); paint();
  window.scrollTo(0, 0);
}
function route() {
  const hsh = (location.hash || '').slice(1);
  const isIv = hsh.startsWith('interview'), isRv = hsh.startsWith('revise');
  document.querySelector('.app').hidden = isIv || isRv; $('iv').hidden = !isIv; $('rv').hidden = !isRv;
  $('mLess').classList.toggle('on', !isIv && !isRv); $('mIv').classList.toggle('on', isIv); $('mRv').classList.toggle('on', isRv);
  $('menuBtn').hidden = isIv || isRv; closeMap();

  if (isRv) { stop(); document.title = 'Revise · AWS Orbit'; renderRv(hsh.split('/')[1] || rvState.tab); window.scrollTo(0, 0); return; }

$('replay').onclick = () => { stop(); go(0); play(); };
$('play').onclick = play;
$('menuBtn').onclick = () => { const s = $('side'); const sh = s.classList.toggle('show'); $('menuBtn').setAttribute('aria-expanded', String(sh)); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMap(); });
document.addEventListener('keydown', (e) => {

/* ===== Recap quiz: 3 rounds (5, 7, 9 questions), each unlocks after 60% ===== */
const QUIZ = {};
const QR = [{ n: 5, name: 'Easy' }, { n: 7, name: 'Medium' }, { n: 9, name: 'Hard' }];
const qPass = (n) => Math.ceil(n * 0.6);
let qBest = {}; try { qBest = JSON.parse(store.get('orbit-quiz') || '{}'); } catch (e) { }
const qSave = () => store.set('orbit-quiz', JSON.stringify(qBest));
const QZ = {};
function qShuf(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function qRich(s) { return String(s).split('`').map((t, i) => i % 2 ? E('code', {}, t) : t); }
function qUnlocked(id, r) { if (r === 0) return true; const b = qBest[id] || []; return (b[r - 1] || 0) >= qPass(QR[r - 1].n); }
function qStart(id, r) { const qs = QUIZ[id][r]; QZ[id] = { r, i: 0, pick: -1, score: 0, fin: false, res: [], ord: qs.map(q => qShuf(q.o.map((_, k) => k))) }; }
function quizCard(L) {
  const data = QUIZ[L.id]; if (!data) return null;
  const card = E('div', { class: 'card quiz' });
  card.addEventListener('keydown', (e) => e.stopPropagation());
  const draw = () => {
    card.replaceChildren();
    const S = QZ[L.id], best = qBest[L.id] || [];
    card.append(E('div', { class: 'qhead' }, E('h4', {}, 'Quick check'), E('span', { class: 'qsub' }, 'Pass a round (60%) to unlock the next')));
    card.append(E('div', { class: 'qrounds' }, QR.map((R, r) => {
      const un = qUnlocked(L.id, r), b = best[r];
      return E('button', { class: 'qr' + (S && S.r === r ? ' on' : '') + (un ? '' : ' lock'), disabled: !un, onclick: () => { qStart(L.id, r); draw(); } },
        E('span', {}, R.name), E('small', {}, R.n + ' questions'), E('em', {}, un ? (b != null ? 'best ' + b + '/' + R.n : 'not tried') : 'locked'));
    })));
